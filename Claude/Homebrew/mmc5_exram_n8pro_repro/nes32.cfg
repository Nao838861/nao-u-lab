MEMORY {
    HEADER: start=$0,    size=$10,   type=ro, file=%O, fill=yes;
    BANK0:  start=$8000, size=$2000, type=ro, file=%O, fill=yes, fillval=$FF;
    BANK1:  start=$A000, size=$2000, type=ro, file=%O, fill=yes, fillval=$FF;
    BANK2:  start=$C000, size=$2000, type=ro, file=%O, fill=yes, fillval=$FF;
    BANK3:  start=$E000, size=$2000, type=ro, file=%O, fill=yes, fillval=$FF;
    CHR:    start=$0000, size=$8000, type=ro, file=%O, fill=yes, fillval=$00;
}
SEGMENTS {
    HEADER:  load=HEADER, type=ro;
    XFER:    load=BANK0,  type=ro;
    PAD1:    load=BANK1,  type=ro, optional=yes;
    PAD2:    load=BANK2,  type=ro, optional=yes;
    CODE:    load=BANK3,  type=ro;
    RODATA:  load=BANK3,  type=ro;
    VECTORS: load=BANK3,  type=ro, start=$FFFA;
    CHR:     load=CHR,    type=ro;
}
