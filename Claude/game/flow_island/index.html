<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>流通の島 v0.4</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101725;color:#dde;font:13px/1.4 system-ui,sans-serif;overflow:hidden}
canvas{display:block;touch-action:none;position:fixed;inset:0}
.ov{position:fixed;z-index:5;background:#1b2434cc;backdrop-filter:blur(4px);border:1px solid #3a4a66;border-radius:8px}
#top{top:8px;left:8px;right:auto;padding:6px 12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 16px)}
#top b{color:#ffd97a}#top .warn{color:#ff8a7a}
#top button{background:#2c3a54;color:#dde;border:1px solid #4a5d7d;border-radius:5px;padding:2px 9px;cursor:pointer}
#top button.on{background:#5a7db0}
#bar{left:8px;top:110px;bottom:auto;transform:none;padding:6px;display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 190px);overflow-y:auto}
#bar button{border:1px solid #4a5d7d;border-radius:6px;padding:6px 8px;cursor:pointer;color:#102;font-weight:600;font-size:12px;min-width:52px}
#bar button.on{outline:3px solid #ffe98a}
#bar button.infra{background:#2c3a54;color:#dde}
#factor{left:50%;transform:translateX(-50%);bottom:10px;padding:5px 14px;font-size:12px;color:#ffe9b0;border-color:#8a7440;max-width:94vw;white-space:normal;line-height:1.35}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:6;pointer-events:none;text-align:center}
#toast div{background:#243450ee;border:1px solid #5a7db0;border-radius:6px;padding:4px 14px;margin:3px;font-size:13px;animation:fade 4s forwards}
@keyframes fade{0%{opacity:0}8%{opacity:1}80%{opacity:1}100%{opacity:0}}
.panel .ph{background:#2c3a54;padding:4px 8px;font-size:11px;color:#9fb8d8;cursor:move;border-radius:8px 8px 0 0;user-select:none}
.panel .px{float:right;cursor:pointer;color:#ffd97a;padding:0 4px}
#pbtns button{background:#2c3a54;color:#dde;border:1px solid #4a5d7d;border-radius:5px;padding:3px 8px;cursor:pointer;font-size:11px}
#dbtn{top:8px;right:8px;padding:6px 10px;cursor:pointer;z-index:6}
#log{font-size:11px;color:#aab}#log div{border-bottom:1px solid #2a3550;padding:1px 0}
.bar{height:8px;background:#2a3550;border-radius:4px;overflow:hidden;width:110px;display:inline-block;vertical-align:middle}
.bar>div{height:100%;background:linear-gradient(90deg,#e0b050,#e05050)}
#popup{position:fixed;z-index:7;display:none;max-width:230px;padding:8px 10px;font-size:12px}
#popup #pclose{position:absolute;top:2px;right:7px;cursor:pointer;color:#ffd97a;font-size:15px;padding:2px 6px}
#overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;flex-direction:column;font-size:22px;z-index:9}
small{color:#8899b0}
@media(max-width:760px){
 #top{gap:6px;padding:4px 8px;font-size:11px}
 #bar{left:0;right:0;top:auto;bottom:0;transform:none;flex-direction:row;overflow-x:auto;overflow-y:hidden;max-height:none;border-radius:0;padding:6px 4px;-webkit-overflow-scrolling:touch}
 #bar button{flex:0 0 auto;min-width:58px;padding:8px 6px}
 #factor{bottom:60px;font-size:11px;padding:4px 8px}
 #drawer{width:86vw;max-height:60vh}
}
</style></head><body>
<canvas id="cv"></canvas>
<div id="top" class="ov"></div>
<div id="toast"></div>
<div id="factor" class="ov">「ようこそ、支配人。まだ誰もいない島です」</div>
<div id="bar" class="ov"></div>
<div id="pbtns" class="ov" style="top:8px;right:8px;padding:4px 6px;z-index:6">
 <button data-p="p_stock">蔵</button><button data-p="p_price">価格</button><button data-p="p_log">出来事</button></div>
<div id="p_stock" class="ov panel" style="top:46px;right:8px;width:150px;display:none"><div class="ph">島の蔵<span class="px">✕</span></div><div id="stock" style="font-size:10px;display:grid;grid-template-columns:1fr 1fr;gap:0 6px;padding:4px 8px"></div></div>
<div id="p_price" class="ov panel" style="top:46px;right:166px;width:150px;display:none"><div class="ph">市場価格<span class="px">✕</span></div><div id="prices" style="font-size:10px;display:grid;grid-template-columns:1fr 1fr;gap:0 6px;padding:4px 8px"></div></div>
<div id="p_log" class="ov panel" style="top:46px;right:8px;width:250px;display:none"><div class="ph">出来事<span class="px">✕</span></div><div id="log" style="font-size:11px;color:#aab;max-height:40vh;overflow-y:auto;padding:4px 8px"></div><div style="padding:4px 8px;border-top:1px solid #2a3550"><small>ドラッグ=地図移動・ピンチ/ホイール=ズーム・職を選んで地面タップ=区画。スペース=一時停止</small></div></div>
<div id="popup" class="ov"><span id="pclose">✕</span><div id="pbody"></div></div>
 <h2>市場価格</h2><div id="prices"></div>
 <h2>出来事</h2><div id="log"></div>
 <h2>操作</h2><small>ドラッグ=地図移動・ピンチ/ホイール=ズーム・スペース=一時停止。職を選んで地面をタップ=入植(渡航費60)。道具を選び直すと解除。</small>
</div>
<div id="overlay"><div>★ 本国より最終通告 ★</div><div style="font-size:14px;margin:8px">債務が信用限度を超えました。配給は止まり、島は静かに衰えていきます…</div><button onclick="location.reload()" style="font-size:16px;padding:8px 20px">リプレイ</button></div>
<script>
addEventListener('error',e=>{const f=document.getElementById('factor');
  if(f)f.textContent='⚠ エラー: '+e.message+' @'+(e.filename||'').split('/').pop()+':'+e.lineno;});
addEventListener('unhandledrejection',e=>{const f=document.getElementById('factor');
  if(f)f.textContent='⚠ エラー: '+(e.reason&&e.reason.message||e.reason);});
</script>
<script type="module">
import{World,P,JOBS,GOODS,LADDER,JOBCLS} from './engine.js?v=129300';
const MW=48,MH=40,TW=40,TH=20;
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
let ox=0,oy=60,Z=1,panX=0,panY=0;
function fit(){cv.width=innerWidth;cv.height=innerHeight;ox=cv.width/2;}
fit();addEventListener('resize',fit);
if(cv.width<760)Z=0.55;
panY=cv.height/2-(60+(MW+MH)/2*10)*Z;
const toWorld=(px,py)=>[(px-panX)/Z,(py-panY)/Z];
const iso=(x,y)=>[ox+(x-y)*TW/2,oy+(x+y)*TH/2];
const unIso=(px,py)=>{const[wx,wy]=toWorld(px,py);const a=(wx-ox)/(TW/2),b=(wy-oy)/(TH/2);return[Math.round((a+b)/2),Math.round((b-a)/2)];};
const terr=[];for(let y=0;y<MH;y++){terr.push([]);for(let x=0;x<MW;x++){
  let t='grass';
  if(y>MH-4||(y>MH-7&&x>18&&x<32))t='water';else if(y>MH-8&&y<=MH-4)t='sand';
  if(x<16&&y<16&&((x*7+y*13)%5<3))t='forest';
  if(x>38&&y<10)t='rock';terr[y].push(t);}}
const TC={grass:['#4d7a3f','#446f38'],sand:['#c9b57a','#bfa96e'],water:['#2b5d8a','#27547d'],forest:['#3a5f31','#33562b'],rock:['#7a7a72','#6e6e66']};
const w=new World(11);w.market={x:25,y:MH-8};w.port={x:25,y:MH-5};w.setTerrain(terr);
const JCOL={fisher:'#4fa3d0',fisher2:'#2f7ba8',veg:'#7ac35e',wheat:'#d8b84a',shepherd:'#c9a0d0',rapeseed:'#e8e34a',woodshop:'#b07840',charburner:'#8a8a8a',quarryman:'#9aa0a8',saltworks:'#dfe4ea'};
const JNAME={fisher:'漁師',fisher2:'対岸漁',veg:'菜園',wheat:'麦畑',shepherd:'牧夫',rapeseed:'菜種',woodshop:'木工',charburner:'炭焼',quarryman:'採石',saltworks:'塩'};
let tool=null,speed=1,tick=0,sel=null;
const M=x=>Math.round(x*10);  // 表示通貨=デナリ(内部×10)
const FRAMES=[0,4,1,0.5]; // 速度→1tickの間隔(フレーム)。1×=15tick/s≒0.5日/秒
// --- 上バー ---
const top=document.getElementById('top');
function topbar(){const d=w.day,m=Math.floor(Math.max(0,d-1)/30)+1,mm=(m-1)%12+1;
  const se=mm>=10?'❄冬':mm<=3?'🌸春':mm<=6?'☀夏':'🍂秋';
  const debt=Math.max(0,-w.treasury),lim=w.limit();
  top.innerHTML=`<span>${Math.floor((m-1)/12)+1}年目 ${mm}月 ${se}</span>`+
   `<span>金庫 <b class="${w.treasury<0?'warn':''}">${M(w.treasury)}</b></span>`+
   `<span class="bar" title="債務/限度"><div style="width:${Math.min(100,debt/lim*100)}%"></div></span>`+
   `<span>人口 <b>${w.pop()}</b></span><span>支援${w.bailouts}/3</span>`+
   [['⏸',0],['▶',1],['▶▶',2],['▶▶▶',3]].map(([l,s])=>`<button data-s="${s}" class="${speed===s?'on':''}">${l}</button>`).join('');
  top.querySelectorAll('button').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;topbar();});}
// --- 下バー(建設) ---
const bar=document.getElementById('bar');
for(const j of JOBS){const b=document.createElement('button');b.textContent=JNAME[j];b.style.background=JCOL[j];
  b.onclick=()=>{tool=tool===j?null:j;paint();};b.dataset.t=j;bar.appendChild(b);}
for(const[id,label]of[['road','道'],['pave','石畳P'],['ship','海運']]){
  const b=document.createElement('button');b.textContent=label;b.className='infra';
  b.onclick=()=>{if(id==='ship'){if(w.investShipping())b.disabled=true;}
    else if(id==='pave'){if(w.investPaving())b.disabled=true;}
    else{tool=tool==='road'?null:'road';paint();}};
  b.dataset.t=id;bar.appendChild(b);}
function paint(){bar.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===tool));}
// --- 引き出し ---
// 可動パネル
document.querySelectorAll('#pbtns button').forEach(b=>b.onclick=()=>{
  const p=document.getElementById(b.dataset.p);p.style.display=p.style.display==='none'?'block':'none';});
document.querySelectorAll('.panel').forEach(p=>{
  const ph=p.querySelector('.ph');
  ph.querySelector('.px').onclick=e=>{e.stopPropagation();p.style.display='none';};
  let dr=null;
  const st=e=>{const t=e.touches?e.touches[0]:e;dr={x:t.clientX,y:t.clientY,l:p.offsetLeft,t2:p.offsetTop};e.preventDefault();};
  const mv=e=>{if(!dr)return;const t=e.touches?e.touches[0]:e;
    p.style.left=(dr.l+t.clientX-dr.x)+'px';p.style.top=(dr.t2+t.clientY-dr.y)+'px';p.style.right='auto';e.preventDefault();};
  ph.addEventListener('mousedown',st);addEventListener('mousemove',mv);addEventListener('mouseup',()=>dr=null);
  ph.addEventListener('touchstart',st,{passive:false});addEventListener('touchmove',mv,{passive:false});addEventListener('touchend',()=>dr=null);});
// --- トースト(重要イベント) ---
let lastEv=0;
function toasts(){const box=document.getElementById('toast');
  for(let i=lastEv;i<w.events.length;i++){const[dd,msg]=w.events[i];
    if(/★|▲Lv|分家|施肥/.test(msg)){const el=document.createElement('div');el.textContent=msg;
      box.appendChild(el);setTimeout(()=>el.remove(),4200);}}
  lastEv=w.events.length;}
// --- 入力(パン/ズーム/タップ) ---
let drag=false,downP=null,moved=false,pinch0=null;
function down(p){drag=true;moved=false;downP=p;if(tool==='road')act(p);}
function move(p){if(!drag)return;
  if(tool==='road'){act(p);return;}
  const dx=p.offsetX-downP.offsetX,dy=p.offsetY-downP.offsetY;
  if(Math.abs(dx)+Math.abs(dy)>8)moved=true;
  if(moved){panX+=dx;panY+=dy;downP=p;}}
function up(p){if(drag&&!moved&&tool!=='road')act(p);drag=false;pinch0=null;}
cv.onmousedown=e=>down({offsetX:e.offsetX,offsetY:e.offsetY});
cv.onmousemove=e=>move({offsetX:e.offsetX,offsetY:e.offsetY});
cv.onmouseup=e=>up({offsetX:e.offsetX,offsetY:e.offsetY});
cv.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.12:0.89;
  const nz=Math.min(2.5,Math.max(0.35,Z*f));
  panX=e.offsetX-(e.offsetX-panX)*nz/Z;panY=e.offsetY-(e.offsetY-panY)*nz/Z;Z=nz;},{passive:false});
function tp(e,i=0){const r=cv.getBoundingClientRect();const t=e.touches[i]||e.changedTouches[0];
  return{offsetX:t.clientX-r.left,offsetY:t.clientY-r.top};}
cv.addEventListener('touchstart',e=>{e.preventDefault();
  if(e.touches.length===2){const a=tp(e,0),b=tp(e,1);pinch0={d:Math.hypot(a.offsetX-b.offsetX,a.offsetY-b.offsetY),z:Z};drag=false;}
  else down(tp(e));},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();
  if(e.touches.length===2&&pinch0){const a=tp(e,0),b=tp(e,1);
    const d=Math.hypot(a.offsetX-b.offsetX,a.offsetY-b.offsetY);
    const cxp=(a.offsetX+b.offsetX)/2,cyp=(a.offsetY+b.offsetY)/2;
    const nz=Math.min(2.5,Math.max(0.35,pinch0.z*d/pinch0.d));
    panX=cxp-(cxp-panX)*nz/Z;panY=cyp-(cyp-panY)*nz/Z;Z=nz;}
  else move(tp(e));},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();up(tp(e));},{passive:false});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();speed=speed===0?1:0;topbar();}
  if(e.key>='1'&&e.key<='3'){speed=+e.key;topbar();}});
function act(p){const[x,y]=unIso(p.offsetX,p.offsetY);
  if(!tool){
    if(Math.hypot(w.market.x-x,w.market.y-y)<2){sel='MARKET';info();placePopup();return;}
    let best=null,bd=9;for(const h of w.hhs){const dd=Math.hypot(h.x-x,h.y-y);if(dd<bd){bd=dd;best=h;}}
    sel=bd<2?best:null;info();placePopup();return;}
  if(x<0||y<0||x>=MW||y>=MH||terr[y][x]==='water')return;
  if(tool==='road'){const k=x+','+y;if(!w.roadTiles.has(k)){w.roadTiles.add(k);w.treasury-=5;w.mainlandOut+=5;w.updRoads();}}
  else if(JOBS.includes(tool)){w.addZone(tool,x,y);}}
// --- 描画 ---
function draw(){cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);cx.setTransform(Z,0,0,Z,panX,panY);
  const d=w.day,mm=(Math.floor(Math.max(0,d-1)/30))%12+1,wint=mm>=10;
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const[px,py]=iso(x,y);let c=TC[terr[y][x]][(x+y)%2];
    if(wint&&terr[y][x]!=='water')c=shade(c,30);
    diamond(px,py,c);
    if(w.roadTiles.has(x+','+y))diamond(px,py,w.paved?'#a9a49b':'#8a795a',0.62);
    else if((w.traffic||{})[x+','+y]>400)diamond(px,py,'#6f7a4a',0.5);  // 獣道(踏み分け道)
    const t=terr[y][x];
    if(t==='forest'&&(x*13+y*7)%3===0){cx.fillStyle='#2c4a26';
      cx.beginPath();cx.moveTo(px,py-14);cx.lineTo(px+5,py-4);cx.lineTo(px-5,py-4);cx.closePath();cx.fill();
      cx.fillStyle='#5a4630';cx.fillRect(px-1,py-4,2,3);}
    if(t==='rock'&&(x*11+y*5)%4===0){cx.fillStyle='#8d8d85';cx.beginPath();cx.ellipse(px,py-3,5,3,0,0,7);cx.fill();}
    if(t==='water'&&(x+y+((tick/25)|0))%7===0){cx.fillStyle='#4a7fae';cx.fillRect(px-6,py-1,12,1);}}
  // 港(桟橋)
  {const[px2,py2]=iso(w.port.x,w.port.y);cx.fillStyle='#6a4f33';cx.fillRect(px2-14,py2-4,28,8);
   cx.fillStyle='#fff';cx.font='9px sans-serif';cx.textAlign='center';cx.fillText('港',px2,py2+16);}
  // 区画(未入居=点線ゴースト)
  for(const z of w.zones){if(z.filled)continue;const[px2,py2]=iso(z.x,z.y);
    cx.strokeStyle=JCOL[z.job]||'#999';cx.setLineDash([3,3]);cx.strokeRect(px2-7,py2-16,14,14);cx.setLineDash([]);
    cx.fillStyle='#ffffff88';cx.font='8px sans-serif';cx.textAlign='center';cx.fillText(JNAME[z.job],px2,py2-18);}
  for(const r of (w.ruins||[])){const[rx,ry]=iso(r.x,r.y);
    cx.fillStyle='#3a3d42';cx.fillRect(rx-5,ry-10,10,8);
    cx.strokeStyle='#222';cx.strokeRect(rx-5,ry-10,10,8);}
  const[mx,my]=iso(w.market.x,w.market.y);
  cx.fillStyle='#e8d9a0';cx.fillRect(mx-16,my-26,32,22);
  // 市場の荷の山(いま市に居る世帯の売り物+御蔵)
  {const GC={fish:'#4fa3d0',veg:'#7ac35e',wheat:'#d8b84a',pres:'#c08a50',pick:'#9ac86a',tools:'#b07840',salt:'#eef',char:'#555',meat:'#d08a9a',meal:'#9a8a5a',stone:'#999',oil:'#ee6'};
   const piles={};
   for(const g in GC){const a=w.stalls[g]||[];const q=a.reduce((s,x)=>s+x.qty,0);if(q>1)piles[g]=q;}
   piles.wheat=(piles.wheat||0)+(w.granary.wheat||0);
   let i=0;
   for(const g in piles){if(piles[g]<3)continue;
     const px2=mx-24+(i%4)*16,py2=my+6+Math.floor(i/4)*10;
     const hgt=Math.min(10,2+Math.log2(1+piles[g]));
     cx.fillStyle=GC[g];cx.fillRect(px2,py2-hgt,10,hgt);
     cx.strokeStyle='#0008';cx.strokeRect(px2,py2-hgt,10,hgt);
     cx.fillStyle='#fff';cx.font='7px sans-serif';cx.textAlign='center';
     cx.fillText(Math.round(piles[g]),px2+5,py2+7);i++;}}
  cx.fillStyle='#7a4a2a';cx.fillRect(mx-18,my-30,36,6);
  cx.fillStyle='#fff';cx.font='10px sans-serif';cx.textAlign='center';cx.fillText('市場/港',mx,my+14);
  for(const h of [...w.hhs].sort((a,b)=>(a.x+a.y)-(b.x+b.y))){
    const[px,py]=iso(Math.round(h.x),Math.round(h.y));
    if(h===sel){cx.strokeStyle='#ffe98a';cx.lineWidth=2;cx.strokeRect(px-12,py-22,24,24);cx.lineWidth=1;}
    if(h.state==='building'){cx.strokeStyle='#c9b57a';cx.strokeRect(px-6,py-14,12,12);
      cx.fillStyle='#c9b57a55';cx.fillRect(px-6,py-14,12,12);
      cx.fillStyle='#ffd97a';cx.font='8px sans-serif';cx.textAlign='center';cx.fillText('普請'+h.buildDays,px,py-17);}
    else if(h.state!=='arriving'){cx.fillStyle=JCOL[h.job]||'#999';
      const s=10+h.lv*1.5;cx.fillRect(px-s/2,py-s-4,s,s);
      cx.strokeStyle='#0008';cx.strokeRect(px-s/2,py-s-4,s,s);
      if(w.goDay&&h.hunger>0){cx.fillStyle='#0007';cx.fillRect(px-s/2,py-s-4,s,s);}
      // Lvバッジ(マップ上に常時表示)
      cx.fillStyle='#1b2434dd';cx.beginPath();cx.arc(px+s/2+2,py-s-2,5.5,0,7);cx.fill();
      cx.strokeStyle=h.lv>0?'#ffd97a':'#556';cx.stroke();
      cx.fillStyle=h.lv>0?'#ffd97a':'#99a';cx.font='bold 7px sans-serif';cx.textAlign='center';
      cx.fillText(h.lv,px+s/2+2,py-s+0.5);cx.textAlign='left';}
    // 人: 実際の位置(通勤・移民の到着が見える)
    if(h.state!=='home'&&h.state!=='building'){
      const GC={fish:'#4fa3d0',veg:'#7ac35e',wheat:'#d8b84a',pres:'#c08a50',pick:'#9ac86a',tools:'#b07840',salt:'#eef',char:'#555',meat:'#d08a9a',meal:'#9a8a5a',stone:'#999',oil:'#ee6'};
      let bg=null,bq=3;for(const g in GC)if(h.pantry[g]>bq){bq=h.pantry[g];bg=g;}
      // 隊列: 1人1荷(荷=4食分)。運ぶ量に応じた人数が列をなす
      let porters=1;
      if(h.state==='toMarket'||h.state==='toHome')
        porters=Math.max(1,Math.min(h.members.length,Math.ceil(bq/4)||1));
      const tx=h.state==='toHome'||h.state==='arriving'?h.x:w.market.x;
      const ty=h.state==='toHome'||h.state==='arriving'?h.y:w.market.y;
      let dx=tx-h.px,dy=ty-h.py;const dl=Math.hypot(dx,dy)||1;dx/=dl;dy/=dl;
      for(let i=0;i<porters;i++){
        const[ax,ay]=iso(h.px-dx*0.45*i,h.py-dy*0.45*i);
        cx.fillStyle='#f5e9d0';cx.beginPath();cx.arc(ax,ay-3,2.2,0,7);cx.fill();
        cx.strokeStyle='#0006';cx.stroke();
        if(bg&&(h.state==='toMarket'||h.state==='toHome')){
          cx.fillStyle=GC[bg];cx.fillRect(ax-2.2,ay-8.5,4.4,3.6);cx.strokeStyle='#0008';cx.strokeRect(ax-2.2,ay-8.5,4.4,3.6);}}}}
  cx.textAlign='left';}
function diamond(px,py,c,k=1){cx.fillStyle=c;cx.beginPath();
  cx.moveTo(px,py-TH/2*k);cx.lineTo(px+TW/2*k,py);cx.lineTo(px,py+TH/2*k);cx.lineTo(px-TW/2*k,py);cx.closePath();cx.fill();}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);
  return`rgb(${Math.min(255,(n>>16)+amt)},${Math.min(255,((n>>8)&255)+amt)},${Math.min(255,(n&255)+amt)})`;}
// --- 情報/価格/ログ ---
const popup=document.getElementById('popup');
document.getElementById('pclose').onclick=()=>{sel=null;popup.style.display='none';};
function placePopup(){if(!sel){popup.style.display='none';return;}
  const tx=sel==='MARKET'?w.market.x:sel.x,ty=sel==='MARKET'?w.market.y:sel.y;
  const[ix,iy]=iso(Math.round(tx),Math.round(ty));
  let sx=ix*Z+panX+14,sy=iy*Z+panY-30;
  sx=Math.max(4,Math.min(innerWidth-240,sx));sy=Math.max(44,Math.min(innerHeight-140,sy));
  popup.style.left=sx+'px';popup.style.top=sy+'px';popup.style.display='block';}
const NMG={fish:'魚',veg:'菜',wheat:'麦',pres:'保存',pick:'漬物',tools:'道具',salt:'塩',char:'炭',meat:'肉',meal:'粕',stone:'石',oil:'油'};
const REQN={food1:'食料',grain:'穀物(パン)',tools:'道具の常用',salt:'塩の常用',char:'炭(暖)の常用',food2:'食料2種',food3:'食料3種',saltchar:'塩と炭',iron:'鉄',cloth:'布'};
function marketInfo(el){
  let html='<b>市場の屋台</b> <small>(品目計)</small><br>';
  let any=false;
  for(const g of GOODS){const st=w.stalls[g];
    if(!st.length){html+=`<small style=color:#556>${NMG[g]} —</small><br>`;continue;}
    const q=st.reduce((s,x)=>s+x.qty,0);
    const lo=Math.min(...st.map(s=>s.price)),hi=Math.max(...st.map(s=>s.price));
    html+=`<small>${NMG[g]} <b>${Math.round(q)}</b>荷 @${M(lo)}${hi-lo>0.05?'〜'+M(hi):''} <span style=color:#8899b0>(${st.length}軒)</span></small><br>`;}
  html+=`<small>輸入棚: 麦@${M(P.IMP.wheat)} 道具@${M(P.IMP.tools)} 塩@${M(P.IMP.salt)}</small><br>`;
  html+=`<small>買付台: 保存@${M(P.EXP.pres)} 道具@${M(P.EXP.tools)}${P.EXP.stone?' 石@'+M(P.EXP.stone):''}${P.EXP.oil?' 油@'+M(P.EXP.oil):''}</small><br>`;
  html+=`<small>御蔵: 麦${Math.round(w.granary.wheat||0)} 保存${Math.round(w.granary.pres||0)} 塩${Math.round(w.granary.salt||0)} 炭${Math.round(w.granary.char||0)}</small>`;
  el.innerHTML=html;}
function info(){const el=document.getElementById('pbody');
  if(!sel){popup.style.display='none';return;}
  if(sel==='MARKET'){marketInfo(el);return;}
  const h=sel,NM={fish:'魚',veg:'菜',wheat:'麦',pres:'保存',pick:'漬物',tools:'道具',salt:'塩',char:'炭',meat:'肉',meal:'粕',stone:'石',oil:'油'};
  const REQN={food1:'食料',grain:'穀物(パン)',tools:'道具の常用',salt:'塩の常用',char:'炭(暖)の常用',food2:'食料2種',food3:'食料3種',saltchar:'塩と炭',iron:'鉄',cloth:'布'};
  const pv=g=>h.pantry[g]>0.5?`${NM[g]}${Math.round(h.pantry[g])}`:null;
  const ST={home:'在宅・生産中',toMarket:'市場へ(荷を運搬中)',atMarket:'市で商い中',toHome:'帰宅中',building:'普請中',arriving:'入植の道中'};
  const hasStall=Object.keys(w.stalls).some(g=>w.stalls[g].some(s=>s.hh===h));
  const mm=(Math.floor(Math.max(0,w.day-1)/30))%12+1;
  let why='';
  if(h.job==='saltworks'&&h.pantry.char<0.5)why='⚠ 燃料切れ(炭がない)——塩を作れない';
  else if(h.job==='fisher'&&h.pantry.salt<0.5)why='⚠ 塩切れ——魚を保存できない';
  else if(h.job==='veg'&&!(mm>=3&&mm<=10))why='(冬季は畑が休み。漬物の蓄えで暮らす)';
  else if(h.purse<0.5)why='⚠ 財布が空——買い物ができない';
  const reqs=LADDER[JOBCLS[h.job]]||[];let lvHtml='';
  if(h.lv<reqs.length){const nxt=reqs[h.lv];const sat=h.satLast||{};
    const need=Math.round(45*(h.lv+1));
    lvHtml=`<b>次Lv${h.lv+1}</b>: ${REQN[nxt]||nxt} ${sat[nxt]?'<span style=color:#8f8>✓充足中</span>':'<b style=color:#ff8a7a>✗不足</b>'} <small>(進捗${Math.round(h.up)}/${need}日)</small><br>`;
    const lower=reqs.slice(0,h.lv).map(r=>`${REQN[r]||r}${(h.satLast||{})[r]?'✓':'<b style=color:#ff8a7a>✗</b>'}`).join(' ');
    if(lower)lvHtml+=`<small>維持: ${lower}</small><br>`;}
  const inc=M(h.incomeLog.reduce((a,b)=>a+b,0));
  el.innerHTML=`<b>${h.sur}家</b>(${JNAME[h.job]}) Lv${h.lv} ${h.road?'(道あり)':'(道なし)'}<br>
   <small>${ST[h.state]||h.state}${hasStall?'・店番を市場に出している':''}</small><br>
   ${why?`<small style=color:#ffb08a>${why}</small><br>`:''}${lvHtml}財布 ${M(h.purse)} <small>(30日収入${inc})</small> / 移動${Math.round(w.travel(h)*100)}%<br>
   <small>在庫: ${GOODS.map(pv).filter(Boolean).join(' ')||'なし'}</small>`;}
function panel(){const NM={fish:'魚',wheat:'麦',veg:'菜',meat:'肉',tools:'道具',salt:'塩',char:'炭',pres:'保存',pick:'漬物',meal:'粕',stone:'石',oil:'油'};
  const tot={};for(const g in NM)tot[g]=w.hhs.reduce((s,h)=>s+h.pantry[g],0)+(w.granary[g]||0)+((w.stalls[g]||[]).reduce((s,x)=>s+x.qty,0));
  document.getElementById('stock').innerHTML=Object.keys(NM).map(g=>`<span>${NM[g]} <b>${Math.round(tot[g])}</b></span>`).join('')+`<span>金計 <b>${M(w.hhs.reduce((s,h)=>s+h.purse,0))}</b></span>`;
  const fp=g=>{const a=w.prices[g];return a&&a.length?M(a[a.length-1][1]):'-';};
  document.getElementById('prices').innerHTML=Object.keys(NM).map(g=>`<span>${NM[g]} <b>${fp(g)}</b></span>`).join('');
  document.getElementById('log').innerHTML=w.events.slice(-14).reverse().map(([dd,m2])=>`<div>D${dd} ${m2}</div>`).join('');}
// --- 秘書 ---
let saidWinter=false,saidTight=false,saidFree=false,stage=0;
function factor(){const el=document.getElementById('factor');const say=t=>el.textContent='「'+t+'」';
  const m=Math.floor(Math.max(0,w.day-1)/30)+1,mm=(m-1)%12+1;
  const debt=Math.max(0,-w.treasury),ratio=debt/w.limit();
  if(w.goDay){say('…本国は、もう待ってくれないそうです。それでも島の朝は来ます');return;}
  const n=j=>w.hhs.filter(h=>h.job===j).length+w.zones.filter(z=>!z.filled&&z.job===j).length;
  if(stage===0){if(n('fisher')<2){say('まず浜の近くに漁師の区画を二つ。次の船が家族を連れてきます');return;}stage=1;}
  if(stage===1){if(n('veg')+n('wheat')<2){say('次に菜園と麦畑を。畑は市場に近いほど良く働きます');return;}stage=2;}
  if(stage===2){if(n('woodshop')<1){say('木工所を森の際に。道具がなければ文化は育ちません');return;}stage=3;}
  if(stage===3){if(n('charburner')<1||n('saltworks')<1){say('炭焼きと塩小屋を。塩がなければ冬の蓄えが作れません');return;}stage=4;}
  if(mm===9&&!saidWinter){saidWinter=true;say('間もなく冬です。右上📊の「島の蔵」で麦と保存食の量をご確認を');return;}
  if(mm===3)saidWinter=false;
  if(ratio>0.55&&!saidTight){saidTight=true;say('債務が限度の半分を超えました。入植を控え、様子を見る頃合いかと');return;}
  if(ratio<0.4&&saidTight){saidTight=false;say('財政に息がつけました。再び前へ');return;}
  if(w.doleRate<Math.max(1,w.hhs.length*9)*0.05&&!saidFree&&m>12){saidFree=true;say('配給がほとんど要らなくなりました。島が自分の足で立ち始めています');return;}}
setInterval(factor,2500);
// --- ループ ---
function frame(){try{tick++;
  const fp=FRAMES[speed];
  if(fp){const n=fp<1?Math.round(1/fp):(tick%fp===0?1:0);for(let i=0;i<n;i++){try{w.tickOnce();}catch(err){console.error(err);speed=0;break;}}}
  draw();placePopup();
  if(tick%20===0){topbar();panel();toasts();if(sel)info();
    if(w.goDay&&document.getElementById('overlay').style.display!=='flex')
      document.getElementById('overlay').style.display='flex';}
  }catch(err){document.getElementById('factor').textContent='⚠ '+err.message;}
  requestAnimationFrame(frame);}
topbar();paint();frame();
</script></body></html>
