<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>graze_log v05.4 — graze 機構削除 + focus shot 軸導入 (graze 非依存 core 軸プロトタイプ)</title>
<style>
  html,body{margin:0;background:#05050f;color:#cfd4e4;font-family:system-ui,sans-serif;
            display:flex;flex-direction:column;align-items:center;min-height:100vh}
  canvas{background:#07091a;box-shadow:0 0 40px #1b2040;display:block;margin-top:12px}
  h1{font-size:14px;margin:8px 0 0;letter-spacing:.1em;color:#9fb1d8}
  p{font-size:11px;opacity:.55;margin:4px 0 0}
  #seedinfo{font-size:10px;opacity:.4;margin-top:4px}
</style>
</head>
<body>
<h1>FOCUS</h1>
<p>← → ↑ ↓ / WASD MOVE &middot; SHIFT or Z FOCUS &middot; SPACE START / BOMB / RETRY &middot; M MUTE</p>
<canvas id="c" width="420" height="620"></canvas>
<p id="seedinfo"></p>
<script>
const W=420,H=620;
const RETRY_UNLOCK_FRAMES=240;
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const seedinfo=document.getElementById('seedinfo');
const keys={};
let muted=false;

// === SEED (v04) — ?seed=N で再現実行可 ===
const SEED=(function(){
  const u=new URLSearchParams(location.search).get('seed');
  if(u){const n=parseInt(u,10);if(!isNaN(n))return n>>>0;}
  return (Date.now()&0xFFFFFFFF)>>>0;
})();
function mulberry32(s){
  s=s>>>0;
  return function(){
    s=(s+0x6D2B79F5)>>>0;
    let t=s;
    t=Math.imul(t^(t>>>15),t|1);
    t^=t+Math.imul(t^(t>>>7),t|61);
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
seedinfo.textContent=`seed=${SEED}  (?seed=N to reproduce)`;

// === v05 beta B-1: SEED 保存 infra ===
function pushSeedToLocal(seed){
  try{
    const raw=localStorage.getItem('grazelog_recent_seeds')||'[]';
    const arr=JSON.parse(raw);
    arr.unshift({seed:seed,t:Date.now()});
    while(arr.length>10)arr.pop();
    localStorage.setItem('grazelog_recent_seeds',JSON.stringify(arr));
  }catch(e){}
}

// === GAUGE THRESHOLDS — region-based (M-24 区切りを変えろ) ===
const G_MAX=208;
const G_LV2=35;
const G_LV3=99;

// === HIT RADIUS (graze 機構削除に伴い R_GRAZE は撤廃) ===
const R_HIT=8;

// === KILL REWARD ===
const KILL_SMALL_GAUGE=2;
const KILL_MED_GAUGE=4;

// === v05.4 ADDITION: FOCUS SHOT (graze 機構の代替経路 = 能動操作 → 報酬ループ) ===
// 設計: Nao_u 5/20 09:35 ts=1779237349「Graze はマニアしか喜ばない変則要素」発言を受け、
// graze 経由の gauge 加速 / 軌道予測線 / active def を撤去し、Boghog 101「focus shot mechanic =
// 速い wide shot と遅い focus shot の選択肢が報酬ループを作る」を core 軸として導入。
// SHIFT or Z hold で focus 状態: (i) 自機速度 0.5x (リスクを取って近づく余地)、
// (ii) 弾発射 x-spread 縮小 (狙撃感、wide vs focus の選択肢)、
// (iii) gauge 加速 (kill 以外の能動報酬経路、graze が担っていた役割を継承)、
// (iv) 自機色変化 (青→白) で focus 状態を視覚化。
// 削除手順 (v05.4→v05.3): FOCUS_* 定数、state.focus、update 内 focus 分岐、
// spawnPlayerBullets の spread 縮小、draw 内自機色変化、HUD の FOCUS 表示を消す。
const FOCUS_SPEED_MULT=0.5;
const FOCUS_SPREAD_MULT=0.4;
const FOCUS_GAUGE_PER_FRAME=0.15;

// === v04→v05 軌跡 (graze 由来だったが、本 v05.4 では「全弾常時軌跡」という readability 軸として独立) ===
// 設計: 旧 v05 は ebullet.grazedT を常時 max クランプして「実質常時軌跡」を実現していた。
// v05.4 では graze 概念ごと削除し、軌跡を draw() で全弾無条件に描画する設計に整理 (フラグ不要)。
const TRAIL_LEN=70;
const TRAIL_ALPHA=0.22;

// === v05.1 MOD: 弾速 ±10% evolve (straight 弾の medium のみ) ===
const EVOLVE_SLOW=0.9;
const EVOLVE_FAST=1.1;
const EVOLVE_FIRED_TH=3;

// === v05.3 MOD: 敵 type 別弾パターン (3 type 差別化 — graze 削除後も維持) ===
// straight 60% / spread 25% / aimed 15%。type 別に弾挙動と cooldown が分岐。
// graze 軸とは独立した「視覚アフォーダンス → 反応 type」軸として v05.4 でも維持。
const TYPE_RNG_STRAIGHT=0.60;
const TYPE_RNG_SPREAD=0.85;
const SPREAD_ANGLE=Math.PI/12;
const SPREAD_SPEED=2.0;
const AIMED_SPEED=2.8;

const state={
  mode:'title',
  t:0,
  player:{x:W/2,y:H-80,r:5,iframe:0},
  bullets:[],
  ebullets:[],
  enemies:[],
  particles:[],
  rings:[],
  popups:[],
  gauge:0,
  score:0,
  hiscore:(function(){try{return parseInt(localStorage.getItem('grazelog_hi')||'0',10);}catch(e){return 0;}})(),
  bombCount:0,
  killCount:0,
  spawnT:0,
  wave:0,
  unlockT:0,
  bombFlash:0,
  hitFlash:0,
  shotCooldown:0,
  introMedSpawned:false,
  stars:[],
  rng:mulberry32(SEED),
  // v05.4 additions
  focus:false,
  focusFrames:0, // self_judgment 用: focus 累積フレーム数
};

function initStars(){
  state.stars.length=0;
  for(let i=0;i<60;i++)state.stars.push({x:state.rng()*W,y:state.rng()*H,layer:0});
  for(let i=0;i<35;i++)state.stars.push({x:state.rng()*W,y:state.rng()*H,layer:1});
  for(let i=0;i<18;i++)state.stars.push({x:state.rng()*W,y:state.rng()*H,layer:2});
}
initStars();

function gaugeLevel(g){
  if(g>=G_LV3)return 3;
  if(g>=G_LV2)return 2;
  return 1;
}
function gaugeReady(){return state.gauge>=G_MAX;}

function addGauge(d){
  state.gauge=Math.max(0,Math.min(G_MAX,state.gauge+d));
}

function shotCount(){
  const lv=gaugeLevel(state.gauge);
  return lv;
}
function shotCooldownF(){
  const lv=gaugeLevel(state.gauge);
  return lv===3?6:lv===2?7:8;
}

function spawnPlayerBullets(){
  const n=shotCount();
  const px=state.player.x,py=state.player.y-8;
  // v05.4: focus 中は x-spread を FOCUS_SPREAD_MULT 倍で収束 (wide vs focus の選択肢)
  const sm=state.focus?FOCUS_SPREAD_MULT:1.0;
  if(n===1){
    state.bullets.push({x:px,y:py,vx:0,vy:-9});
  }else if(n===2){
    state.bullets.push({x:px-5*sm,y:py,vx:0,vy:-9});
    state.bullets.push({x:px+5*sm,y:py,vx:0,vy:-9});
  }else{
    state.bullets.push({x:px,y:py,vx:0,vy:-9});
    state.bullets.push({x:px-7*sm,y:py+2,vx:-1.5*sm,vy:-9});
    state.bullets.push({x:px+7*sm,y:py+2,vx:1.5*sm,vy:-9});
  }
}

function spawnEnemy(type,x,phase){
  if(type==='small'){
    state.enemies.push({type,x,y:-12,vx:0,vy:1.6,r:9,hp:1,t:0,fireT:9999,phase:phase||0,firedCount:0,enemyType:'straight'});
  }else{
    const r=state.rng();
    let enemyType;
    if(r<TYPE_RNG_STRAIGHT)enemyType='straight';
    else if(r<TYPE_RNG_SPREAD)enemyType='spread';
    else enemyType='aimed';
    let initFireT;
    if(enemyType==='straight')initFireT=60+Math.floor(state.rng()*40);
    else if(enemyType==='spread')initFireT=90+Math.floor(state.rng()*50);
    else initFireT=40+Math.floor(state.rng()*30);
    state.enemies.push({type,x,y:-16,vx:0,vy:0.9,r:13,hp:3,t:0,fireT:initFireT,phase:phase||0,firedCount:0,enemyType});
  }
}

function startGame(){
  state.mode='play';
  pushSeedToLocal(SEED);
  state.t=0;
  state.player.x=W/2;state.player.y=H-80;state.player.iframe=0;
  state.bullets.length=0;
  state.ebullets.length=0;
  state.enemies.length=0;
  state.particles.length=0;
  state.rings.length=0;
  state.popups.length=0;
  state.gauge=0;
  state.score=0;
  state.bombCount=0;
  state.killCount=0;
  state.spawnT=0;
  state.wave=0;
  state.bombFlash=0;
  state.hitFlash=0;
  state.shotCooldown=0;
  state.introMedSpawned=false;
  // v05.4 reset
  state.focus=false;
  state.focusFrames=0;
}

function gameOver(){
  state.mode='over';
  console.log('grazelog v05.4 seed:',SEED,'score:',state.score,'wave:',state.wave,'focusFrames:',state.focusFrames);
  state.unlockT=RETRY_UNLOCK_FRAMES;
  if(state.score>state.hiscore){
    state.hiscore=state.score;
    try{localStorage.setItem('grazelog_hi',String(state.hiscore));}catch(e){}
  }
  for(let i=0;i<140;i++){
    const a=state.rng()*Math.PI*2,sp=2+state.rng()*9;
    const c=['#ffd870','#ff6080','#80c0ff'][i%3];
    state.particles.push({x:state.player.x,y:state.player.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:80+state.rng()*30,c,r:1.5+state.rng()*1.5});
  }
}

function fireBomb(){
  if(!gaugeReady())return;
  state.bombCount++;
  for(const b of state.ebullets){
    state.score+=20;
    state.particles.push({x:b.x,y:b.y,vx:0,vy:0,life:14,c:'#ffd870',r:3});
  }
  state.ebullets.length=0;
  for(const e of state.enemies){
    e.hp=Math.max(1,Math.ceil(e.hp/2));
  }
  // v05.2 FIX: BOMB 後 Lv3 維持 (パワーダウン回避)
  state.gauge=G_LV3;
  state.bombFlash=24;
  for(let i=0;i<3;i++){
    state.rings.push({x:state.player.x,y:state.player.y,t:i*4,life:30,c:'#ffd870',r0:20,r1:Math.min(W,H)*0.7});
  }
}

// === 敵配置 rhyme (spawnWave wave 1-4 関数化 + wave>=5 70% 過去 wave 再使用) ===
function spawnWave1(){
  spawnEnemy('small',W*0.30);
  spawnEnemy('small',W*0.50);
  spawnEnemy('small',W*0.70);
  setTimeout(()=>{
    if(state.mode==='play'){
      spawnEnemy('medium',W*0.5);
      state.introMedSpawned=true;
    }
  },1200);
}
function spawnWave2(){
  spawnEnemy('small',W*0.2);
  spawnEnemy('small',W*0.4);
  spawnEnemy('small',W*0.6);
  spawnEnemy('small',W*0.8);
  spawnEnemy('medium',W*0.3);
  spawnEnemy('medium',W*0.7);
}
function spawnWave3(){
  for(let i=0;i<6;i++)spawnEnemy('small',W*0.15+i*W*0.14);
  spawnEnemy('medium',W*0.5);
}
function spawnWave4(){
  spawnEnemy('medium',W*0.25);
  spawnEnemy('medium',W*0.5);
  spawnEnemy('medium',W*0.75);
  for(let i=0;i<4;i++)spawnEnemy('small',W*0.2+i*W*0.2);
}
function spawnWaveRandom(w){
  const pop=4+Math.min(w-4,6);
  for(let i=0;i<pop;i++){
    if(state.rng()<0.6)spawnEnemy('small',60+state.rng()*(W-120));
    else spawnEnemy('medium',60+state.rng()*(W-120));
  }
}
const WAVE_FUNCS=[spawnWave1,spawnWave2,spawnWave3,spawnWave4];
function spawnWave(){
  state.wave++;
  const w=state.wave;
  if(w===1){spawnWave1();return;}
  if(w===2){spawnWave2();return;}
  if(w===3){spawnWave3();return;}
  if(w===4){spawnWave4();return;}
  if(state.rng()<0.7){
    const idx=Math.floor(state.rng()*WAVE_FUNCS.length);
    WAVE_FUNCS[idx]();
  }else{
    spawnWaveRandom(w);
  }
}

function update(){
  state.t++;
  for(const s of state.stars){
    s.y+=[0.4,0.8,1.6][s.layer];
    if(s.y>H){s.y=-2;s.x=state.rng()*W;}
  }
  if(state.mode!=='play'){
    if(state.unlockT>0)state.unlockT--;
    updateEffects();
    return;
  }
  const left=keys['arrowleft']||keys['a'];
  const right=keys['arrowright']||keys['d'];
  const up=keys['arrowup']||keys['w'];
  const down=keys['arrowdown']||keys['s'];
  // v05.4: FOCUS state (SHIFT or Z hold)
  state.focus=!!(keys['shift']||keys['z']);
  const moveMult=state.focus?FOCUS_SPEED_MULT:1.0;
  let dx=0,dy=0;
  if(left)dx-=1;if(right)dx+=1;if(up)dy-=1;if(down)dy+=1;
  if(dx&&dy){dx*=0.707;dy*=0.707;}
  state.player.x+=dx*4.2*moveMult;
  state.player.y+=dy*4.2*moveMult;
  state.player.x=Math.max(8,Math.min(W-8,state.player.x));
  state.player.y=Math.max(20,Math.min(H-12,state.player.y));
  if(state.player.iframe>0)state.player.iframe--;
  // v05.4: focus 中は gauge を加算 (kill 以外の能動報酬経路)
  if(state.focus){
    state.focusFrames++;
    addGauge(FOCUS_GAUGE_PER_FRAME);
  }

  if(state.shotCooldown>0)state.shotCooldown--;
  else{
    spawnPlayerBullets();
    state.shotCooldown=shotCooldownF();
  }

  for(const b of state.bullets){
    b.x+=b.vx;b.y+=b.vy;
  }
  state.bullets=state.bullets.filter(b=>b.y>-12&&b.x>-12&&b.x<W+12);

  state.spawnT--;
  if(state.spawnT<=0&&state.enemies.length<3){
    spawnWave();
    state.spawnT=160-Math.min(state.wave*8,80);
  }

  for(const e of state.enemies){
    e.t++;
    if(e.type==='small'){
      e.y+=e.vy;
    }else{
      e.y+=e.vy;
      e.x+=Math.sin(e.t*0.04+e.phase)*1.4;
      e.fireT--;
      if(e.fireT<=0&&e.y>0&&e.y<H*0.55){
        e.firedCount++;
        if(e.enemyType==='straight'){
          const sp=2.4*(e.firedCount>EVOLVE_FIRED_TH?EVOLVE_FAST:EVOLVE_SLOW);
          state.ebullets.push({x:e.x,y:e.y,vx:0,vy:sp,kind:'straight'});
          e.fireT=70+Math.floor(state.rng()*40);
        }else if(e.enemyType==='spread'){
          for(let s=-1;s<=1;s++){
            const a=Math.PI/2+s*SPREAD_ANGLE;
            state.ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*SPREAD_SPEED,vy:Math.sin(a)*SPREAD_SPEED,kind:'spread'});
          }
          e.fireT=100+Math.floor(state.rng()*50);
        }else{
          const dx=state.player.x-e.x,dy=state.player.y-e.y;
          const d=Math.hypot(dx,dy)||1;
          state.ebullets.push({x:e.x,y:e.y,vx:dx/d*AIMED_SPEED,vy:dy/d*AIMED_SPEED,kind:'aimed'});
          e.fireT=50+Math.floor(state.rng()*30);
        }
      }
    }
  }
  for(const b of state.bullets){
    for(const e of state.enemies){
      if(e.hp<=0)continue;
      const dx=b.x-e.x,dy=b.y-e.y;
      if(dx*dx+dy*dy<(e.r+3)*(e.r+3)){
        e.hp--;
        b.y=-99;
        for(let i=0;i<3;i++){
          const a=state.rng()*Math.PI*2,sp=1+state.rng()*1.5;
          state.particles.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:8,c:'#5a6478',r:1.5});
        }
        if(e.hp<=0){
          state.killCount++;
          if(e.type==='small'){
            state.score+=10;
            addGauge(KILL_SMALL_GAUGE);
            for(let i=0;i<5;i++){
              const a=state.rng()*Math.PI*2,sp=1.5+state.rng()*1.5;
              state.particles.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:14,c:'#7a8498',r:1.6});
            }
          }else{
            state.score+=40;
            addGauge(KILL_MED_GAUGE);
            for(let i=0;i<10;i++){
              const a=state.rng()*Math.PI*2,sp=1.5+state.rng()*2.5;
              state.particles.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:16,c:'#8a94a8',r:1.8});
            }
          }
        }
        break;
      }
    }
  }
  state.bullets=state.bullets.filter(b=>b.y>-12);
  state.enemies=state.enemies.filter(e=>e.hp>0&&e.y<H+30);

  for(const b of state.ebullets){
    b.x+=b.vx;b.y+=b.vy;
    // v05.4: graze 判定は撤廃。hit 判定のみ。
    const dx=b.x-state.player.x,dy=b.y-state.player.y;
    const d2=dx*dx+dy*dy;
    if(d2<R_HIT*R_HIT){
      if(state.player.iframe<=0){
        onHit();
        b.y=H+99;
      }
    }
  }
  state.ebullets=state.ebullets.filter(b=>b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);

  if(state.player.iframe<=0){
    for(const e of state.enemies){
      const dx=state.player.x-e.x,dy=state.player.y-e.y;
      if(dx*dx+dy*dy<(e.r+state.player.r)*(e.r+state.player.r)){
        onHit();
        break;
      }
    }
  }

  // v05.4: SPACE は BOMB のみ (graze 経由の DEF 経路撤廃)
  if(keys['space_press']){
    keys['space_press']=false;
    if(gaugeReady())fireBomb();
  }

  updateEffects();
}

function updateEffects(){
  for(const p of state.particles){p.x+=p.vx;p.y+=p.vy;p.vx*=0.96;p.vy*=0.96;p.life--;}
  state.particles=state.particles.filter(p=>p.life>0);
  for(const r of state.rings){r.t++;}
  state.rings=state.rings.filter(r=>r.t<r.life);
  for(const p of state.popups){p.life--;p.y-=0.6;}
  state.popups=state.popups.filter(p=>p.life>0);
  if(state.bombFlash>0)state.bombFlash--;
  if(state.hitFlash>0)state.hitFlash--;
}

function onHit(){
  const lv=gaugeLevel(state.gauge);
  state.player.iframe=24;
  state.hitFlash=4;
  if(lv===3){
    state.gauge=G_LV2;
    spawnHitParticles('#ffd870');
  }else if(lv===2){
    state.gauge=0;
    spawnHitParticles('#ff8a8a');
  }else{
    gameOver();
    return;
  }
}

function spawnHitParticles(c){
  for(let i=0;i<10;i++){
    const a=state.rng()*Math.PI*2,sp=1+state.rng()*2;
    state.particles.push({x:state.player.x,y:state.player.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:18,c,r:1.5});
  }
}

// === DRAW ===
function draw(){
  ctx.fillStyle='#07091a';
  ctx.fillRect(0,0,W,H);
  for(const s of state.stars){
    const op=[0.35,0.55,0.85][s.layer];
    const r=[0.7,1.0,1.4][s.layer];
    ctx.fillStyle=`rgba(180,200,255,${op})`;
    ctx.fillRect(s.x-r/2,s.y-r/2,r,r);
  }
  ctx.fillStyle='#9fb1d8';
  for(const b of state.bullets){
    ctx.fillRect(b.x-1.5,b.y-5,3,8);
  }
  for(const e of state.enemies){
    if(e.type==='small'){
      ctx.fillStyle='#ff5060';
      ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
    }else{
      const outer=e.enemyType==='spread'?'#ff60c0':e.enemyType==='aimed'?'#60a8ff':'#ffa030';
      const inner=e.enemyType==='spread'?'#ffc0e8':e.enemyType==='aimed'?'#c0e0ff':'#fff080';
      ctx.fillStyle=outer;
      ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=inner;
      ctx.beginPath();ctx.arc(e.x,e.y,e.r-5,0,Math.PI*2);ctx.fill();
    }
  }
  for(const b of state.ebullets){
    // v05.4: 全弾常時軌跡 (graze フラグ撤廃、無条件描画 = readability 軸)
    const sp=Math.hypot(b.vx,b.vy)||1;
    const fx=b.x+b.vx/sp*TRAIL_LEN;
    const fy=b.y+b.vy/sp*TRAIL_LEN;
    ctx.strokeStyle=`rgba(255,216,112,${TRAIL_ALPHA})`;
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(fx,fy);ctx.stroke();
    // 弾本体 — kind 別の色 (敵 type 視覚アフォーダンス)
    const baseColor=b.kind==='spread'?'#ff80e0':b.kind==='aimed'?'#90c0ff':'#ff90a0';
    ctx.fillStyle=baseColor;
    ctx.beginPath();ctx.arc(b.x,b.y,3,0,Math.PI*2);ctx.fill();
  }
  for(const r of state.rings){
    const k=r.t/r.life;
    const cur=r.r0+(r.r1-r.r0)*k;
    ctx.strokeStyle=r.c;
    ctx.globalAlpha=Math.max(0,1-k);
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(r.x,r.y,cur,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
  }
  for(const p of state.particles){
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life/20));
    ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r||1.5,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  if(state.mode==='play'){
    const flicker=state.player.iframe>0&&(state.t%4<2);
    if(!flicker){
      const lv=gaugeLevel(state.gauge);
      // v05.4: focus 中は自機色を白に変化 (青系→白で focus 状態を視覚化)
      let pc;
      if(state.focus){
        pc='#ffffff';
      }else{
        pc=lv===3?'#ffd870':lv===2?'#80d0ff':'#9fe0ff';
      }
      ctx.fillStyle=pc;
      ctx.beginPath();
      ctx.moveTo(state.player.x,state.player.y-8);
      ctx.lineTo(state.player.x-7,state.player.y+6);
      ctx.lineTo(state.player.x+7,state.player.y+6);
      ctx.closePath();ctx.fill();
      if(gaugeReady()){
        const pulse=0.5+0.5*Math.sin(state.t*0.2);
        ctx.strokeStyle=`rgba(255,216,112,${0.5+pulse*0.5})`;
        ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(state.player.x,state.player.y,14,0,Math.PI*2);ctx.stroke();
      }
      // v05.4: focus 中は自機周りに小さい白リング (hit box 認知補助 + focus 視覚化)
      if(state.focus){
        const pulse=0.5+0.5*Math.sin(state.t*0.2);
        ctx.strokeStyle=`rgba(255,255,255,${0.5+pulse*0.4})`;
        ctx.lineWidth=1.2;
        ctx.beginPath();ctx.arc(state.player.x,state.player.y,R_HIT,0,Math.PI*2);ctx.stroke();
      }
    }
  }
  for(const p of state.popups){
    ctx.globalAlpha=Math.max(0,p.life/30);
    ctx.fillStyle=p.c;
    ctx.font='bold 11px system-ui';
    ctx.textAlign='center';
    ctx.fillText(p.text,p.x,p.y);
  }
  ctx.globalAlpha=1;
  ctx.textAlign='left';

  if(state.hitFlash>0){
    ctx.fillStyle=`rgba(255,40,80,${state.hitFlash/4*0.4})`;
    ctx.fillRect(0,0,W,H);
  }
  if(state.bombFlash>0){
    ctx.fillStyle=`rgba(255,216,112,${state.bombFlash/24*0.35})`;
    ctx.fillRect(0,0,W,H);
  }

  drawHUD();
  if(state.mode==='title')drawTitle();
  if(state.mode==='over')drawOver();
}

function drawHUD(){
  const gx=10,gy=H-14,gw=W-20,gh=8;
  ctx.fillStyle='#1a1f30';
  ctx.fillRect(gx,gy,gw,gh);
  const px2=gx+gw*(G_LV2/G_MAX);
  const px3=gx+gw*(G_LV3/G_MAX);
  const cur=state.gauge/G_MAX;
  const filled=gw*cur;
  if(state.gauge>0){
    if(state.gauge<=G_LV2){
      ctx.fillStyle='#4a7fc0';
      ctx.fillRect(gx,gy,filled,gh);
    }else if(state.gauge<=G_LV3){
      ctx.fillStyle='#4a7fc0';
      ctx.fillRect(gx,gy,gw*(G_LV2/G_MAX),gh);
      ctx.fillStyle='#60c0ff';
      ctx.fillRect(gx+gw*(G_LV2/G_MAX),gy,filled-gw*(G_LV2/G_MAX),gh);
    }else{
      ctx.fillStyle='#4a7fc0';
      ctx.fillRect(gx,gy,gw*(G_LV2/G_MAX),gh);
      ctx.fillStyle='#60c0ff';
      ctx.fillRect(gx+gw*(G_LV2/G_MAX),gy,gw*((G_LV3-G_LV2)/G_MAX),gh);
      ctx.fillStyle=gaugeReady()?'#ffd870':'#ffa040';
      ctx.fillRect(gx+gw*(G_LV3/G_MAX),gy,filled-gw*(G_LV3/G_MAX),gh);
    }
  }
  ctx.fillStyle='#0a0c1a';
  ctx.fillRect(px2-1,gy,2,gh);
  ctx.fillRect(px3-1,gy,2,gh);
  ctx.strokeStyle='#404858';
  ctx.lineWidth=1;
  ctx.strokeRect(gx+0.5,gy+0.5,gw-1,gh-1);

  ctx.fillStyle='#cfd4e4';
  ctx.font='bold 11px system-ui';
  ctx.textAlign='left';
  ctx.fillText(`SCORE ${state.score}`,10,16);
  ctx.fillText(`HI ${state.hiscore}`,W-90,16);
  ctx.font='10px system-ui';
  ctx.fillStyle='#9fb1d8';
  // v05.4: GRAZE/STREAK/DEF 表示を削除し、FOCUS 状態と累積フレームを表示
  const focusLabel=state.focus?'[FOCUS]':'      ';
  ctx.fillText(`LV${gaugeLevel(state.gauge)}  KILL ${state.killCount}  ${focusLabel}  F:${state.focusFrames}`,10,30);
  if(gaugeReady()){
    ctx.fillStyle='#ffd870';
    ctx.font='bold 11px system-ui';
    ctx.fillText('SPACE [B]OMB',W-104,30);
  }else{
    ctx.fillStyle='#506080';
    ctx.font='10px system-ui';
    ctx.fillText('SPACE [-]',W-72,30);
  }
}

function drawTitle(){
  ctx.fillStyle='rgba(7,9,26,0.7)';
  ctx.fillRect(0,H/2-110,W,260);
  ctx.textAlign='center';
  ctx.fillStyle='#ffd870';
  ctx.font='bold 28px system-ui';
  ctx.fillText('FOCUS',W/2,H/2-50);
  ctx.fillStyle='#9fb1d8';
  ctx.font='11px system-ui';
  ctx.fillText('graze_log v05.4 — graze 機構撤廃 / focus shot 軸導入',W/2,H/2-28);
  ctx.fillStyle='#cfd4e4';
  ctx.font='12px system-ui';
  ctx.fillText('SHIFT or Z HOLD → 速度 0.5x / 弾収束 / ゲージ加速',W/2,H/2);
  ctx.fillText('KILL or FOCUS → GAUGE → LV1→LV2→LV3 → BOMB',W/2,H/2+18);
  ctx.font='11px system-ui';
  ctx.fillStyle='#9fb1d8';
  ctx.fillText('← → ↑ ↓ / WASD  MOVE',W/2,H/2+42);
  ctx.fillText('SHIFT or Z  FOCUS (hold)',W/2,H/2+58);
  ctx.fillText('SPACE  START / BOMB / RETRY',W/2,H/2+74);
  ctx.fillText('M  MUTE',W/2,H/2+90);
  ctx.fillStyle='#ffd870';
  ctx.font='bold 13px system-ui';
  if((state.t/30|0)%2===0)ctx.fillText('PRESS SPACE',W/2,H/2+122);
  ctx.textAlign='left';
}

function drawOver(){
  ctx.fillStyle='rgba(7,9,26,0.7)';
  ctx.fillRect(0,H/2-100,W,220);
  ctx.textAlign='center';
  ctx.fillStyle='#ff80a0';
  ctx.font='bold 26px system-ui';
  ctx.fillText('GAME OVER',W/2,H/2-40);
  ctx.fillStyle='#cfd4e4';
  ctx.font='13px system-ui';
  ctx.fillText(`SCORE  ${state.score}`,W/2,H/2-10);
  ctx.fillText(`KILL   ${state.killCount}`,W/2,H/2+12);
  ctx.fillText(`BOMB   ${state.bombCount}`,W/2,H/2+30);
  ctx.fillText(`FOCUS  ${state.focusFrames} f`,W/2,H/2+48);
  if(state.score===state.hiscore&&state.score>0){
    ctx.fillStyle='#ffd870';
    ctx.font='bold 12px system-ui';
    ctx.fillText('NEW RECORD',W/2,H/2+72);
  }
  if(state.unlockT<=0){
    ctx.fillStyle='#ffd870';
    ctx.font='bold 13px system-ui';
    if((state.t/30|0)%2===0)ctx.fillText('PRESS SPACE TO RETRY',W/2,H/2+100);
  }else{
    ctx.fillStyle='#506080';
    ctx.font='10px system-ui';
    ctx.fillText('...',W/2,H/2+100);
  }
  ctx.textAlign='left';
}

// === INPUT ===
window.addEventListener('keydown',e=>{
  if(e.repeat)return;
  const k=e.key.toLowerCase();
  if(k==='m'){muted=!muted;return;}
  if(k===' '||k==='spacebar')e.preventDefault();
  keys[k]=true;
  if(k==='shift')keys['shift']=true;
  if(k===' '){
    keys['space_press']=true;
    if(state.mode==='title'){startGame();}
    else if(state.mode==='over'&&state.unlockT<=0){startGame();}
  }
  if(k.startsWith('arrow'))keys[k]=true;
});
window.addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  keys[k]=false;
  if(k==='shift')keys['shift']=false;
});

// === LOOP ===
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
