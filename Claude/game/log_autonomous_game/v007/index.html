<!doctype html>

<title>v007 — mini-metroidvania (1部屋探検家ごっこ)</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0d12; color: #cbd3e1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-top: 18px; }

<canvas id="stage" width="800" height="450"></canvas>
<div class="note">矢印 / WASD で移動、↑ / W / Z でジャンプ。シアンのオーブを取るとダブルジャンプ獲得。<br>高い壁を越えて隣の部屋のドア (黄色) に触れたらクリア。Space でリトライ。</div>
