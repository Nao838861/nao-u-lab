<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>mimicry_log v02 — 間合い選択ごっこ (focus shot + token burst + large 敵 + wave10 ミニボス)</title>
<style>
  html,body{margin:0;background:#05050f;color:#cfd4e4;font-family:system-ui,sans-serif;
            display:flex;flex-direction:column;align-items:center;min-height:100vh}
  canvas{background:#07091a;box-shadow:0 0 40px #1b2040;display:block;margin-top:12px}
  h1{font-size:14px;margin:8px 0 0;letter-spacing:.1em;color:#9fb1d8}
  p{font-size:11px;opacity:.55;margin:4px 0 0}
  #seedinfo{font-size:10px;opacity:.4;margin-top:4px}
</style>
</head>
<body>
<h1>MIMICRY v02 — 間合い選択ごっこ</h1>
<p>← → ↑ ↓ / WASD MOVE &middot; SHIFT FOCUS &middot; Z FOCUS BURST &middot; SPACE START / BOMB(B) / DEF(D) / RETRY &middot; M MUTE</p>
<canvas id="c" width="420" height="620"></canvas>
<p id="seedinfo"></p>
<script>
const W=420,H=620;
const RETRY_UNLOCK_FRAMES=240;
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const seedinfo=document.getElementById('seedinfo');
const keys={};
let muted=false;

// === SEED ===
const SEED=(function(){
  const u=new URLSearchParams(location.search).get('seed');
  if(u){const n=parseInt(u,10);if(!isNaN(n))return n>>>0;}
  return (Date.now()&0xFFFFFFFF)>>>0;
})();
function mulberry32(s){
  s=s>>>0;
  return function(){
    s=(s+0x6D2B79F5)>>>0;
    let t=s;
    t=Math.imul(t^(t>>>15),t|1);
    t^=t+Math.imul(t^(t>>>7),t|61);
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
seedinfo.textContent=`seed=${SEED}  (?seed=N to reproduce)`;

function pushSeedToLocal(seed){
  try{
    const raw=localStorage.getItem('mimicry_log_v02_recent_seeds')||'[]';
    const arr=JSON.parse(raw);
    arr.unshift({seed:seed,t:Date.now()});
    while(arr.length>10)arr.pop();
    localStorage.setItem('mimicry_log_v02_recent_seeds',JSON.stringify(arr));
  }catch(e){}
}

// === GAUGE THRESHOLDS ===
const G_MAX=208;
const G_LV2=35;
const G_LV3=99;

// === GRAZE / HIT RADII (normal mode) ===
const R_GRAZE=22;
const R_HIT=8;

// === FOCUS MODE MULT (v02 案A 通過条件1) ===
// 移動 0.5x / 弾 spread 1/3 / DPS 1.3x / hit 0.5x / graze 1.5x
const FOCUS_MOVE=0.5;
const FOCUS_SPREAD=1/3;
const FOCUS_DPS=1.3;       // shotCooldown を 1/DPS 倍
const FOCUS_HIT=0.5;       // R_HIT に乗算
const FOCUS_GRAZE=1.5;     // R_GRAZE に乗算
const FOCUS_PARTICLE=0.7;  // 撃破粒子 0.7x 減衰 (通過条件2)

// === FOCUS BURST MULT (v02 案A 通過条件3) ===
// 1 秒間 (60 frames): DPS 2.0x / 移動 0.4x / hit 0.3x
const BURST_FRAMES=60;
const BURST_DPS=2.0;
const BURST_MOVE=0.4;
const BURST_HIT=0.3;
const FOCUS_TOKEN_TH=3;
const TOKEN_SMALL=1;
const TOKEN_MED=3;
const TOKEN_LARGE=9;

// === GRAZE REWARD ===
const GRAZE_GAUGE=6;
const GRAZE_SCORE=5;

// === KILL REWARD ===
const KILL_SMALL_GAUGE=4;
const KILL_MED_GAUGE=8;
const KILL_LARGE_GAUGE=18;

const GRAZE_STREAK_TH=5;
const ACTIVE_DEF_FRAMES=60;
const ACTIVE_DEF_RADIUS=80;

const GRAZE_TRAIL_FRAMES=90;
const GRAZE_TRAIL_LEN=70;

const EVOLVE_SLOW=0.9;
const EVOLVE_FAST=1.1;
const EVOLVE_FIRED_TH=3;

const SHAKE_SMALL=3;
const SHAKE_MED=7;
const SHAKE_LARGE=14;
const SHAKE_BOMB=14;
const SHAKE_HIT=10;
const SHAKE_DECAY=0.85;

const state={
  mode:'title',
  t:0,
  player:{x:W/2,y:H-80,r:5,iframe:0},
  bullets:[],
  ebullets:[],
  enemies:[],
  particles:[],
  rings:[],
  popups:[],
  gauge:0,
  score:0,
  hiscore:(function(){try{return parseInt(localStorage.getItem('mimicrylog_v02_hi')||'0',10);}catch(e){return 0;}})(),
  grazeCount:0,
  bombCount:0,
  killCount:0,
  spawnT:0,
  wave:0,
  unlockT:0,
  bombFlash:0,
  hitFlash:0,
  shotCooldown:0,
  introMedSpawned:false,
  stars:[],
  rng:mulberry32(SEED),
  grazeStreak:0,
  activeDefT:0,
  activeDefCount:0,
  shakeT:0,
  shakeMag:0,
  // v02: focus mode
  focus:false,
  focusTokens:0,
  burstT:0,
  burstCount:0,
  // v02: wave 10 miniboss
  miniBossActive:false,
  miniBossPhaseT:0,
  miniBossPhase:0,  // 0=縦長, 1=拡散
  bossClear:false,
};

function initStars(){
  state.stars.length=0;
  for(let i=0;i<60;i++)state.stars.push({x:state.rng()*W,y:state.rng()*H,layer:0});
  for(let i=0;i<35;i++)state.stars.push({x:state.rng()*W,y:state.rng()*H,layer:1});
  for(let i=0;i<18;i++)state.stars.push({x:state.rng()*W,y:state.rng()*H,layer:2});
}
initStars();

function gaugeLevel(g){
  if(g>=G_LV3)return 3;
  if(g>=G_LV2)return 2;
  return 1;
}
function gaugeReady(){return state.gauge>=G_MAX;}

function spaceContext(){
  if(gaugeReady())return 'B';
  if(state.grazeStreak>=GRAZE_STREAK_TH)return 'D';
  return '-';
}

function addGauge(d){
  state.gauge=Math.max(0,Math.min(G_MAX,state.gauge+d));
}

function triggerShake(mag){
  if(mag>state.shakeMag)state.shakeMag=mag;
  state.shakeT=12;
}

// v02: 現時点での効果値 (focus / burst を考慮)
function curHitR(){
  if(state.burstT>0)return R_HIT*BURST_HIT;
  if(state.focus)return R_HIT*FOCUS_HIT;
  return R_HIT;
}
function curGrazeR(){
  if(state.focus)return R_GRAZE*FOCUS_GRAZE;
  return R_GRAZE;
}
function curMoveK(){
  if(state.burstT>0)return BURST_MOVE;
  if(state.focus)return FOCUS_MOVE;
  return 1;
}

function shotCount(){
  return gaugeLevel(state.gauge);
}
function shotCooldownF(){
  const lv=gaugeLevel(state.gauge);
  let base=lv===3?6:lv===2?7:8;
  if(state.burstT>0)base=Math.max(2,Math.round(base/BURST_DPS));
  else if(state.focus)base=Math.max(3,Math.round(base/FOCUS_DPS));
  return base;
}

function spawnPlayerBullets(){
  const n=shotCount();
  const px=state.player.x,py=state.player.y-8;
  // focus 中は spread を 1/3 に縮める (= 弾の横ずれ量を縮小)
  const spreadK=state.focus?FOCUS_SPREAD:1.0;
  if(n===1){
    state.bullets.push({x:px,y:py,vx:0,vy:-9});
  }else if(n===2){
    const dx=5*spreadK;
    state.bullets.push({x:px-dx,y:py,vx:0,vy:-9});
    state.bullets.push({x:px+dx,y:py,vx:0,vy:-9});
  }else{
    const dx=7*spreadK;
    const vx=1.5*spreadK;
    state.bullets.push({x:px,y:py,vx:0,vy:-9});
    state.bullets.push({x:px-dx,y:py+2,vx:-vx,vy:-9});
    state.bullets.push({x:px+dx,y:py+2,vx:vx,vy:-9});
  }
}

function spawnEnemy(type,x,phase){
  if(type==='small'){
    state.enemies.push({type,x,y:-12,vx:0,vy:1.6,r:9,hp:1,t:0,fireT:9999,phase:phase||0,firedCount:0});
  }else if(type==='medium'){
    state.enemies.push({type,x,y:-16,vx:0,vy:0.9,r:13,hp:3,t:0,fireT:60+Math.floor(state.rng()*40),phase:phase||0,firedCount:0});
  }else if(type==='large'){
    // v02 通過条件4: large HP9、撃破時 BOMB 級フィードバック
    state.enemies.push({type,x,y:-22,vx:0,vy:0.6,r:20,hp:9,t:0,fireT:50+Math.floor(state.rng()*30),phase:phase||0,firedCount:0,bossPath:0});
  }
}

function startGame(){
  state.mode='play';
  pushSeedToLocal(SEED);
  state.t=0;
  state.player.x=W/2;state.player.y=H-80;state.player.iframe=0;
  state.bullets.length=0;
  state.ebullets.length=0;
  state.enemies.length=0;
  state.particles.length=0;
  state.rings.length=0;
  state.popups.length=0;
  state.gauge=0;
  state.score=0;
  state.grazeCount=0;
  state.bombCount=0;
  state.killCount=0;
  state.spawnT=0;
  state.wave=0;
  state.bombFlash=0;
  state.hitFlash=0;
  state.shotCooldown=0;
  state.introMedSpawned=false;
  state.grazeStreak=0;
  state.activeDefT=0;
  state.activeDefCount=0;
  state.shakeT=0;
  state.shakeMag=0;
  state.focus=false;
  state.focusTokens=0;
  state.burstT=0;
  state.burstCount=0;
  state.miniBossActive=false;
  state.miniBossPhaseT=0;
  state.miniBossPhase=0;
  state.bossClear=false;
}

function gameOver(){
  state.mode='over';
  console.log('mimicry_log v02 seed:',SEED,'score:',state.score,'wave:',state.wave,'burst:',state.burstCount);
  state.unlockT=RETRY_UNLOCK_FRAMES;
  if(state.score>state.hiscore){
    state.hiscore=state.score;
    try{localStorage.setItem('mimicrylog_v02_hi',String(state.hiscore));}catch(e){}
  }
  for(let i=0;i<140;i++){
    const a=state.rng()*Math.PI*2,sp=2+state.rng()*9;
    const c=['#ffd870','#ff6080','#80c0ff'][i%3];
    state.particles.push({x:state.player.x,y:state.player.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:80+state.rng()*30,c,r:1.5+state.rng()*1.5});
  }
}

function fireBomb(){
  if(!gaugeReady())return;
  state.bombCount++;
  for(const b of state.ebullets){
    state.score+=20;
    state.particles.push({x:b.x,y:b.y,vx:0,vy:0,life:14,c:'#ffd870',r:3});
  }
  state.ebullets.length=0;
  for(const e of state.enemies){
    e.hp=Math.max(1,Math.ceil(e.hp/2));
  }
  state.gauge=G_LV3;
  state.bombFlash=24;
  triggerShake(SHAKE_BOMB);
  for(let i=0;i<3;i++){
    state.rings.push({x:state.player.x,y:state.player.y,t:i*4,life:30,c:'#ffd870',r0:20,r1:Math.min(W,H)*0.7});
  }
}

function triggerActiveDef(){
  if(state.grazeStreak<GRAZE_STREAK_TH)return;
  state.activeDefCount++;
  state.grazeStreak=0;
  state.activeDefT=ACTIVE_DEF_FRAMES;
  state.player.iframe=Math.max(state.player.iframe,ACTIVE_DEF_FRAMES);
  const r2=ACTIVE_DEF_RADIUS*ACTIVE_DEF_RADIUS;
  let cleared=0;
  for(const b of state.ebullets){
    const dx=b.x-state.player.x,dy=b.y-state.player.y;
    if(dx*dx+dy*dy<r2){
      state.score+=10;
      cleared++;
      state.particles.push({x:b.x,y:b.y,vx:0,vy:0,life:12,c:'#80ffd0',r:2.5});
      b.y=H+999;
    }
  }
  state.ebullets=state.ebullets.filter(b=>b.y<H+100);
  state.rings.push({x:state.player.x,y:state.player.y,t:0,life:ACTIVE_DEF_FRAMES,c:'#80ffd0',r0:R_GRAZE,r1:ACTIVE_DEF_RADIUS});
  state.popups.push({x:state.player.x,y:state.player.y-20,text:`DEF x${cleared}`,life:30,c:'#80ffd0'});
}

// v02 通過条件3: focus burst 発動 (Z キー、focus_token>=3 必要)
function triggerFocusBurst(){
  if(state.focusTokens<FOCUS_TOKEN_TH)return;
  if(state.burstT>0)return;
  state.focusTokens-=FOCUS_TOKEN_TH;
  state.burstT=BURST_FRAMES;
  state.burstCount++;
  // 演出: 自機リング 2 重 + 弾 trail 強化準備 + popup
  state.rings.push({x:state.player.x,y:state.player.y,t:0,life:BURST_FRAMES,c:'#80c0ff',r0:14,r1:34});
  state.rings.push({x:state.player.x,y:state.player.y,t:0,life:BURST_FRAMES,c:'#a0d8ff',r0:18,r1:46});
  state.popups.push({x:state.player.x,y:state.player.y-30,text:'FOCUS BURST',life:36,c:'#80c0ff'});
}

function spawnWave1(){
  // wave 1-3: normal 推奨のみ (focus 機構の存在を player に気づかせる前段) — small 主体
  spawnEnemy('small',W*0.30);
  spawnEnemy('small',W*0.50);
  spawnEnemy('small',W*0.70);
  setTimeout(()=>{
    if(state.mode==='play'){
      spawnEnemy('medium',W*0.5);
      state.introMedSpawned=true;
    }
  },1200);
}
function spawnWave2(){
  spawnEnemy('small',W*0.2);
  spawnEnemy('small',W*0.4);
  spawnEnemy('small',W*0.6);
  spawnEnemy('small',W*0.8);
  spawnEnemy('medium',W*0.3);
  spawnEnemy('medium',W*0.7);
}
function spawnWave3(){
  for(let i=0;i<6;i++)spawnEnemy('small',W*0.15+i*W*0.14);
  spawnEnemy('medium',W*0.5);
}
// v02 通過条件4 + brainstorm L6: wave 4 = focus tutorial (敵が縦長配置)
function spawnWave4(){
  // 縦に並んだ medium 3 体 = focus で撃ち抜けと教える配置
  spawnEnemy('medium',W*0.5);
  setTimeout(()=>{ if(state.mode==='play')spawnEnemy('medium',W*0.5); },800);
  setTimeout(()=>{ if(state.mode==='play')spawnEnemy('medium',W*0.5); },1600);
  spawnEnemy('small',W*0.2);
  spawnEnemy('small',W*0.8);
}
function spawnWaveRandom(w){
  const pop=4+Math.min(w-4,6);
  // v02: wave>=5 で large 5%, wave>=8 で large 15%
  const largeP=(w>=8)?0.15:(w>=5)?0.05:0;
  for(let i=0;i<pop;i++){
    const r=state.rng();
    if(r<largeP){
      spawnEnemy('large',80+state.rng()*(W-160));
    }else if(r<0.6+largeP*0.5){
      spawnEnemy('small',60+state.rng()*(W-120));
    }else{
      spawnEnemy('medium',60+state.rng()*(W-120));
    }
  }
}
// v02 通過条件4: wave 10 mini boss = large 3体同時 + path 切替
function spawnWave10MiniBoss(){
  spawnEnemy('large',W*0.25);
  spawnEnemy('large',W*0.50);
  spawnEnemy('large',W*0.75);
  state.miniBossActive=true;
  state.miniBossPhase=0;
  state.miniBossPhaseT=120;  // 2 秒毎切替
  state.popups.push({x:W/2,y:H/2-40,text:'WAVE 10 MINIBOSS',life:60,c:'#ffd060'});
}
const WAVE_FUNCS=[spawnWave1,spawnWave2,spawnWave3,spawnWave4];
function spawnWave(){
  state.wave++;
  const w=state.wave;
  // wave 10 boss clear 後の最初の wave 突入を可視化 (dead flag 救済)
  if(state.bossClear){
    state.bossClear=false;
    state.popups.push({x:W/2,y:H/2-40,text:`WAVE ${w} AFTER-BOSS`,life:60,c:'#80ffd0'});
  }
  if(w===1){spawnWave1();return;}
  if(w===2){spawnWave2();return;}
  if(w===3){spawnWave3();return;}
  if(w===4){spawnWave4();return;}
  if(w===10){spawnWave10MiniBoss();return;}
  if(state.rng()<0.7){
    const idx=Math.floor(state.rng()*WAVE_FUNCS.length);
    WAVE_FUNCS[idx]();
    // wave>=5 では large mix 抽選を追加で一回回す
    if(w>=5){
      const largeP=(w>=8)?0.15:0.05;
      if(state.rng()<largeP)spawnEnemy('large',80+state.rng()*(W-160));
    }
  }else{
    spawnWaveRandom(w);
  }
}

function spawnKillBurst(e,kind){
  const cx=e.x, cy=e.y;
  const focusK=state.focus?FOCUS_PARTICLE:1.0;  // v02 通過条件2: focus 中粒子 0.7x 減衰
  const baseN = kind==='small' ? 14 : kind==='medium' ? 28 : 56;
  const N = Math.max(4,Math.round(baseN*focusK));
  const col = kind==='small' ? '#ffb070' : kind==='medium' ? '#ffd060' : '#fff0a0';
  for(let i=0;i<N;i++){
    const a=state.rng()*Math.PI*2;
    const sp=1.5+state.rng()*(kind==='small'?3.0:kind==='medium'?4.5:6.0);
    state.particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:18+state.rng()*14,c:col,r:1.4+state.rng()*1.4});
  }
  const NinnerBase = kind==='small' ? 6 : kind==='medium' ? 14 : 28;
  const Ninner = Math.max(2,Math.round(NinnerBase*focusK));
  for(let i=0;i<Ninner;i++){
    const a=state.rng()*Math.PI*2;
    const sp=0.5+state.rng()*1.6;
    state.particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:24+state.rng()*16,c:'#a09090',r:1.0+state.rng()*1.0});
  }
  // ring
  const rExt = kind==='small'?28 : kind==='medium'?48 : 80;
  state.rings.push({x:cx,y:cy,t:0,life:kind==='small'?12:kind==='medium'?18:28,c:col,r0:e.r,r1:e.r+rExt});
  // large: 大リング 2 重 (BOMB 同等)
  if(kind==='large'){
    state.rings.push({x:cx,y:cy,t:0,life:34,c:'#ffd870',r0:e.r+10,r1:e.r+rExt+30});
  }
}

function update(){
  state.t++;
  for(const s of state.stars){
    s.y+=[0.4,0.8,1.6][s.layer];
    if(s.y>H){s.y=-2;s.x=state.rng()*W;}
  }
  if(state.mode!=='play'){
    if(state.unlockT>0)state.unlockT--;
    updateEffects();
    return;
  }

  // v02: focus / burst の入力反映
  state.focus = !!keys['shift'];
  if(keys['z_press']){
    keys['z_press']=false;
    triggerFocusBurst();
  }
  if(state.burstT>0)state.burstT--;

  const left=keys['arrowleft']||keys['a'];
  const right=keys['arrowright']||keys['d'];
  const up=keys['arrowup']||keys['w'];
  const down=keys['arrowdown']||keys['s'];
  let dx=0,dy=0;
  if(left)dx-=1;if(right)dx+=1;if(up)dy-=1;if(down)dy+=1;
  if(dx&&dy){dx*=0.707;dy*=0.707;}
  const moveK=curMoveK();
  state.player.x+=dx*4.2*moveK;
  state.player.y+=dy*4.2*moveK;
  state.player.x=Math.max(8,Math.min(W-8,state.player.x));
  state.player.y=Math.max(20,Math.min(H-12,state.player.y));
  if(state.player.iframe>0)state.player.iframe--;
  if(state.activeDefT>0)state.activeDefT--;

  if(state.shotCooldown>0)state.shotCooldown--;
  else{
    spawnPlayerBullets();
    state.shotCooldown=shotCooldownF();
  }

  for(const b of state.bullets){
    b.x+=b.vx;b.y+=b.vy;
  }
  state.bullets=state.bullets.filter(b=>b.y>-12&&b.x>-12&&b.x<W+12);

  state.spawnT--;
  if(state.spawnT<=0&&state.enemies.length<3 && !state.miniBossActive){
    spawnWave();
    state.spawnT=160-Math.min(state.wave*8,80);
  }

  // v02: miniboss phase 切替 (2 秒毎)
  if(state.miniBossActive){
    state.miniBossPhaseT--;
    if(state.miniBossPhaseT<=0){
      state.miniBossPhase=1-state.miniBossPhase;
      state.miniBossPhaseT=120;
      state.popups.push({x:W/2,y:60,text:state.miniBossPhase===0?'PATH: NARROW':'PATH: SPREAD',life:30,c:state.miniBossPhase===0?'#80c0ff':'#ffa040'});
    }
    // 全 large が撃破された (= enemies に large が無い) なら boss clear
    const largeAlive=state.enemies.some(e=>e.type==='large');
    if(!largeAlive){
      state.miniBossActive=false;
      state.bossClear=true;
      state.popups.push({x:W/2,y:H/2-40,text:'BOSS CLEAR',life:90,c:'#ffd870'});
    }
  }

  for(const e of state.enemies){
    e.t++;
    if(e.type==='small'){
      e.y+=e.vy;
    }else if(e.type==='medium'){
      e.y+=e.vy;
      e.x+=Math.sin(e.t*0.04+e.phase)*1.4;
      e.fireT--;
      if(e.fireT<=0&&e.y>0&&e.y<H*0.55){
        const dx=state.player.x-e.x,dy=state.player.y-e.y;
        const d=Math.hypot(dx,dy)||1;
        e.firedCount++;
        const sp=2.4*(e.firedCount>EVOLVE_FIRED_TH?EVOLVE_FAST:EVOLVE_SLOW);
        state.ebullets.push({x:e.x,y:e.y,vx:dx/d*sp,vy:dy/d*sp,grazed:false,grazedT:GRAZE_TRAIL_FRAMES});
        e.fireT=70+Math.floor(state.rng()*40);
      }
    }else if(e.type==='large'){
      // large: 縦長停止 (画面上 1/3 で停止して撃ち下ろし)
      if(e.y<H*0.22){e.y+=e.vy;}
      else{e.y+=e.vy*0.2;e.x+=Math.sin(e.t*0.025+e.phase)*0.8;}
      e.fireT--;
      if(e.fireT<=0&&e.y>0&&e.y<H*0.55){
        e.firedCount++;
        const sp=2.0*(e.firedCount>EVOLVE_FIRED_TH?EVOLVE_FAST:EVOLVE_SLOW);
        // miniboss なら phase で path 切替: 0=narrow (focus 推奨), 1=spread (normal 推奨)
        const narrow = state.miniBossActive ? (state.miniBossPhase===0) : (state.rng()<0.5);
        if(narrow){
          // 縦長 path = 自機方向 + 微小オフセット 3 発
          const dx=state.player.x-e.x,dy=state.player.y-e.y;
          const d=Math.hypot(dx,dy)||1;
          for(let k=-1;k<=1;k++){
            const off=k*0.06;
            const ux=dx/d, uy=dy/d;
            const cx=ux*Math.cos(off)-uy*Math.sin(off);
            const cy=ux*Math.sin(off)+uy*Math.cos(off);
            state.ebullets.push({x:e.x,y:e.y,vx:cx*sp,vy:cy*sp,grazed:false,grazedT:GRAZE_TRAIL_FRAMES});
          }
        }else{
          // 拡散 path = 5 発放射
          for(let k=0;k<5;k++){
            const a=(Math.PI*0.5)+(k-2)*0.32;
            state.ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,grazed:false,grazedT:GRAZE_TRAIL_FRAMES});
          }
        }
        e.fireT=60+Math.floor(state.rng()*30);
      }
    }
  }
  for(const b of state.bullets){
    for(const e of state.enemies){
      if(e.hp<=0)continue;
      const dx=b.x-e.x,dy=b.y-e.y;
      if(dx*dx+dy*dy<(e.r+3)*(e.r+3)){
        e.hp--;
        b.y=-99;
        for(let i=0;i<3;i++){
          const a=state.rng()*Math.PI*2,sp=1+state.rng()*1.5;
          state.particles.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:8,c:'#5a6478',r:1.5});
        }
        if(e.hp<=0){
          state.killCount++;
          if(e.type==='small'){
            state.score+=10;
            addGauge(KILL_SMALL_GAUGE);
            spawnKillBurst(e,'small');
            triggerShake(SHAKE_SMALL);
            if(state.focus)state.focusTokens+=TOKEN_SMALL;
          }else if(e.type==='medium'){
            state.score+=40;
            addGauge(KILL_MED_GAUGE);
            spawnKillBurst(e,'medium');
            triggerShake(SHAKE_MED);
            if(state.focus)state.focusTokens+=TOKEN_MED;
          }else{
            state.score+=120;
            addGauge(KILL_LARGE_GAUGE);
            spawnKillBurst(e,'large');
            triggerShake(SHAKE_LARGE);
            if(state.focus)state.focusTokens+=TOKEN_LARGE;
          }
        }
        break;
      }
    }
  }
  state.bullets=state.bullets.filter(b=>b.y>-12);
  state.enemies=state.enemies.filter(e=>e.hp>0&&e.y<H+30);

  for(const b of state.ebullets){
    b.x+=b.vx;b.y+=b.vy;
    b.grazedT=GRAZE_TRAIL_FRAMES;
    const dx=b.x-state.player.x,dy=b.y-state.player.y;
    const d2=dx*dx+dy*dy;
    const hR=curHitR();
    const gR=curGrazeR();
    if(d2<hR*hR){
      if(state.player.iframe<=0){
        onHit();
        b.y=H+99;
      }
    }else if(!b.grazed&&d2<gR*gR){
      b.grazed=true;
      b.grazedT=GRAZE_TRAIL_FRAMES;
      onGraze(b.x,b.y);
    }
  }
  state.ebullets=state.ebullets.filter(b=>b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);

  if(state.player.iframe<=0){
    for(const e of state.enemies){
      const dx=state.player.x-e.x,dy=state.player.y-e.y;
      if(dx*dx+dy*dy<(e.r+state.player.r)*(e.r+state.player.r)){
        onHit();
        break;
      }
    }
  }

  if(keys['space_press']){
    keys['space_press']=false;
    if(gaugeReady()){
      fireBomb();
    }else if(state.grazeStreak>=GRAZE_STREAK_TH){
      triggerActiveDef();
    }
  }

  updateEffects();
}

function updateEffects(){
  for(const p of state.particles){p.x+=p.vx;p.y+=p.vy;p.vx*=0.96;p.vy*=0.96;p.life--;}
  state.particles=state.particles.filter(p=>p.life>0);
  for(const r of state.rings){r.t++;}
  state.rings=state.rings.filter(r=>r.t<r.life);
  for(const p of state.popups){p.life--;p.y-=0.6;}
  state.popups=state.popups.filter(p=>p.life>0);
  if(state.bombFlash>0)state.bombFlash--;
  if(state.hitFlash>0)state.hitFlash--;
  if(state.shakeT>0){
    state.shakeT--;
    state.shakeMag*=SHAKE_DECAY;
    if(state.shakeMag<0.2){state.shakeMag=0;state.shakeT=0;}
  }
}

function onGraze(bx,by){
  state.grazeCount++;
  state.grazeStreak++;
  addGauge(GRAZE_GAUGE);
  state.score+=GRAZE_SCORE*gaugeLevel(state.gauge);
  state.rings.push({x:state.player.x,y:state.player.y,t:0,life:18,c:'#ffd870',r0:curGrazeR()-2,r1:curGrazeR()+18});
  state.popups.push({x:bx+(state.rng()-0.5)*8,y:by-6,text:'+'+GRAZE_GAUGE,life:30,c:'#ffd870'});
  if(state.grazeStreak===GRAZE_STREAK_TH){
    state.popups.push({x:state.player.x,y:state.player.y-30,text:'DEF READY',life:40,c:'#80ffd0'});
  }
}

function onHit(){
  const lv=gaugeLevel(state.gauge);
  state.player.iframe=24;
  state.hitFlash=4;
  triggerShake(SHAKE_HIT);
  if(lv===3){
    state.gauge=G_LV2;
    spawnHitParticles('#ffd870');
  }else if(lv===2){
    state.gauge=0;
    spawnHitParticles('#ff8a8a');
  }else{
    gameOver();
    return;
  }
}

function spawnHitParticles(c){
  for(let i=0;i<10;i++){
    const a=state.rng()*Math.PI*2,sp=1+state.rng()*2;
    state.particles.push({x:state.player.x,y:state.player.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:18,c,r:1.5});
  }
}

function draw(){
  let sx=0, sy=0;
  if(state.shakeMag>0){
    sx=(state.rng()-0.5)*2*state.shakeMag;
    sy=(state.rng()-0.5)*2*state.shakeMag;
  }
  ctx.save();
  ctx.translate(sx,sy);

  ctx.fillStyle='#07091a';
  ctx.fillRect(-10,-10,W+20,H+20);
  for(const s of state.stars){
    const op=[0.35,0.55,0.85][s.layer];
    const r=[0.7,1.0,1.4][s.layer];
    ctx.fillStyle=`rgba(180,200,255,${op})`;
    ctx.fillRect(s.x-r/2,s.y-r/2,r,r);
  }
  ctx.fillStyle='#9fb1d8';
  for(const b of state.bullets){
    ctx.fillRect(b.x-1.5,b.y-5,3,8);
  }
  for(const e of state.enemies){
    if(e.type==='small'){
      ctx.fillStyle='#ff5060';
      ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
    }else if(e.type==='medium'){
      ctx.fillStyle='#ffa030';
      ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff080';
      ctx.beginPath();ctx.arc(e.x,e.y,e.r-5,0,Math.PI*2);ctx.fill();
    }else{
      // large
      ctx.fillStyle='#d04030';
      ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffa030';
      ctx.beginPath();ctx.arc(e.x,e.y,e.r-6,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff0a0';
      ctx.beginPath();ctx.arc(e.x,e.y,e.r-13,0,Math.PI*2);ctx.fill();
      // HP gauge
      const hpw=(e.hp/9)*(e.r*2-4);
      ctx.fillStyle='#1a1f30';
      ctx.fillRect(e.x-e.r+2,e.y-e.r-6,e.r*2-4,3);
      ctx.fillStyle='#ff8a40';
      ctx.fillRect(e.x-e.r+2,e.y-e.r-6,hpw,3);
    }
  }
  for(const b of state.ebullets){
    if(b.grazedT>0){
      const fade=b.grazedT/GRAZE_TRAIL_FRAMES;
      const sp=Math.hypot(b.vx,b.vy)||1;
      const fx=b.x+b.vx/sp*GRAZE_TRAIL_LEN;
      const fy=b.y+b.vy/sp*GRAZE_TRAIL_LEN;
      ctx.strokeStyle=`rgba(255,216,112,${0.22*fade})`;
      ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(fx,fy);ctx.stroke();
    }
    const dx=b.x-state.player.x,dy=b.y-state.player.y;
    const d2=dx*dx+dy*dy;
    const gR=curGrazeR();
    const inGrazeRing=!b.grazed&&d2<gR*gR;
    ctx.fillStyle=inGrazeRing?'#ffd870':b.grazed?'#a08040':'#ff90a0';
    ctx.beginPath();ctx.arc(b.x,b.y,3,0,Math.PI*2);ctx.fill();
  }
  for(const r of state.rings){
    const k=r.t/r.life;
    const cur=r.r0+(r.r1-r.r0)*k;
    ctx.strokeStyle=r.c;
    ctx.globalAlpha=Math.max(0,1-k);
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(r.x,r.y,cur,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=1;
  }
  for(const p of state.particles){
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life/20));
    ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r||1.5,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  if(state.mode==='play'){
    const flicker=state.player.iframe>0&&(state.t%4<2);
    if(!flicker){
      const lv=gaugeLevel(state.gauge);
      ctx.fillStyle=lv===3?'#ffd870':lv===2?'#80d0ff':'#9fe0ff';
      ctx.beginPath();
      ctx.moveTo(state.player.x,state.player.y-8);
      ctx.lineTo(state.player.x-7,state.player.y+6);
      ctx.lineTo(state.player.x+7,state.player.y+6);
      ctx.closePath();ctx.fill();
      if(gaugeReady()){
        const pulse=0.5+0.5*Math.sin(state.t*0.2);
        ctx.strokeStyle=`rgba(255,216,112,${0.5+pulse*0.5})`;
        ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(state.player.x,state.player.y,14,0,Math.PI*2);ctx.stroke();
      }
      // graze ring
      ctx.strokeStyle=`rgba(255,216,112,${state.focus?0.18:0.10})`;
      ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(state.player.x,state.player.y,curGrazeR(),0,Math.PI*2);ctx.stroke();
      // v02 通過条件2: focus 中 自機リング表示 (focus mode 切替視覚シグナル)
      if(state.focus){
        const pulse=0.6+0.4*Math.sin(state.t*0.18);
        ctx.strokeStyle=`rgba(128,192,255,${0.45+pulse*0.4})`;
        ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(state.player.x,state.player.y,12,0,Math.PI*2);ctx.stroke();
        // 内側 hit dot 可視化 (focus mode の核 = hit 半径縮小を伝える)
        ctx.fillStyle='rgba(160,216,255,0.85)';
        ctx.beginPath();ctx.arc(state.player.x,state.player.y,curHitR(),0,Math.PI*2);ctx.fill();
      }
      // burst 中: 自機リング 2 重 + trail
      if(state.burstT>0){
        const k=state.burstT/BURST_FRAMES;
        ctx.strokeStyle=`rgba(128,192,255,${0.55+0.45*Math.sin(state.t*0.4)})`;
        ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(state.player.x,state.player.y,12+k*4,0,Math.PI*2);ctx.stroke();
        ctx.strokeStyle=`rgba(200,224,255,${0.35+0.35*Math.sin(state.t*0.3)})`;
        ctx.lineWidth=1.5;
        ctx.beginPath();ctx.arc(state.player.x,state.player.y,20+k*6,0,Math.PI*2);ctx.stroke();
      }
      if(state.activeDefT>0){
        const ad=state.activeDefT/ACTIVE_DEF_FRAMES;
        ctx.strokeStyle=`rgba(128,255,208,${0.35+0.45*ad})`;
        ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(state.player.x,state.player.y,17,0,Math.PI*2);ctx.stroke();
      }
      if(state.grazeStreak>=GRAZE_STREAK_TH&&state.activeDefT<=0){
        const pulse=0.4+0.6*Math.abs(Math.sin(state.t*0.15));
        ctx.strokeStyle=`rgba(128,255,208,${pulse*0.7})`;
        ctx.lineWidth=1.5;
        ctx.beginPath();ctx.arc(state.player.x,state.player.y,11,0,Math.PI*2);ctx.stroke();
      }
    }
  }
  for(const p of state.popups){
    ctx.globalAlpha=Math.max(0,p.life/30);
    ctx.fillStyle=p.c;
    ctx.font='bold 11px system-ui';
    ctx.textAlign='center';
    ctx.fillText(p.text,p.x,p.y);
  }
  ctx.globalAlpha=1;
  ctx.textAlign='left';

  if(state.hitFlash>0){
    ctx.fillStyle=`rgba(255,40,80,${state.hitFlash/4*0.4})`;
    ctx.fillRect(0,0,W,H);
  }
  if(state.bombFlash>0){
    ctx.fillStyle=`rgba(255,216,112,${state.bombFlash/24*0.35})`;
    ctx.fillRect(0,0,W,H);
  }

  // v02 通過条件2: focus 中 画面外周 vignette (focus mode 切替視覚シグナル)
  if(state.mode==='play' && state.focus){
    const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.25,W/2,H/2,Math.max(W,H)*0.62);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(1,'rgba(0,16,40,0.55)');
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);
  }

  ctx.restore();

  drawHUD();
  if(state.mode==='title')drawTitle();
  if(state.mode==='over')drawOver();
}

function drawHUD(){
  const gx=10,gy=H-14,gw=W-20,gh=8;
  ctx.fillStyle='#1a1f30';
  ctx.fillRect(gx,gy,gw,gh);
  const px2=gx+gw*(G_LV2/G_MAX);
  const px3=gx+gw*(G_LV3/G_MAX);
  const cur=state.gauge/G_MAX;
  const filled=gw*cur;
  if(state.gauge>0){
    if(state.gauge<=G_LV2){
      ctx.fillStyle='#4a7fc0';
      ctx.fillRect(gx,gy,filled,gh);
    }else if(state.gauge<=G_LV3){
      ctx.fillStyle='#4a7fc0';
      ctx.fillRect(gx,gy,gw*(G_LV2/G_MAX),gh);
      ctx.fillStyle='#60c0ff';
      ctx.fillRect(gx+gw*(G_LV2/G_MAX),gy,filled-gw*(G_LV2/G_MAX),gh);
    }else{
      ctx.fillStyle='#4a7fc0';
      ctx.fillRect(gx,gy,gw*(G_LV2/G_MAX),gh);
      ctx.fillStyle='#60c0ff';
      ctx.fillRect(gx+gw*(G_LV2/G_MAX),gy,gw*((G_LV3-G_LV2)/G_MAX),gh);
      ctx.fillStyle=gaugeReady()?'#ffd870':'#ffa040';
      ctx.fillRect(gx+gw*(G_LV3/G_MAX),gy,filled-gw*(G_LV3/G_MAX),gh);
    }
  }
  ctx.fillStyle='#0a0c1a';
  ctx.fillRect(px2-1,gy,2,gh);
  ctx.fillRect(px3-1,gy,2,gh);
  ctx.strokeStyle='#404858';
  ctx.lineWidth=1;
  ctx.strokeRect(gx+0.5,gy+0.5,gw-1,gh-1);

  ctx.fillStyle='#cfd4e4';
  ctx.font='bold 11px system-ui';
  ctx.textAlign='left';
  ctx.fillText(`SCORE ${state.score}`,10,16);
  ctx.fillText(`HI ${state.hiscore}`,W-90,16);
  ctx.font='10px system-ui';
  ctx.fillStyle='#9fb1d8';
  ctx.fillText(`LV${gaugeLevel(state.gauge)}  KILL ${state.killCount}  GRAZE ${state.grazeCount}  STREAK ${state.grazeStreak}/${GRAZE_STREAK_TH}  DEF ${state.activeDefCount}  W${state.wave}`,10,30);

  // v02: focus / token / burst HUD
  const tokenReady=state.focusTokens>=FOCUS_TOKEN_TH;
  ctx.fillStyle=state.focus?'#80c0ff':'#506080';
  ctx.font='bold 10px system-ui';
  ctx.fillText(state.focus?'FOCUS':'(SHIFT FOCUS)',10,44);
  ctx.fillStyle=tokenReady?'#a0d8ff':'#7080a0';
  ctx.fillText(`TOKEN ${state.focusTokens}/${FOCUS_TOKEN_TH}`,80,44);
  if(state.burstT>0){
    ctx.fillStyle='#80c0ff';
    ctx.fillText(`BURST ${state.burstT}f x${state.burstCount}`,170,44);
  }else if(tokenReady){
    ctx.fillStyle='#a0d8ff';
    ctx.fillText('Z = BURST',170,44);
  }else{
    ctx.fillStyle='#506080';
    ctx.fillText('Z (need TOKEN 3)',170,44);
  }

  const ctx2=spaceContext();
  if(ctx2==='B'){
    ctx.fillStyle='#ffd870';
    ctx.font='bold 11px system-ui';
    ctx.fillText('SPACE [B]OMB',W-104,30);
  }else if(ctx2==='D'){
    ctx.fillStyle='#80ffd0';
    ctx.font='bold 11px system-ui';
    ctx.fillText('SPACE [D]EF',W-90,30);
  }else{
    ctx.fillStyle='#506080';
    ctx.font='10px system-ui';
    ctx.fillText('SPACE [-]',W-72,30);
  }
}

  ctx.fillStyle='#80c0ff';

  ctx.fillText('MIMICRY v02',W/2,H/2-80);
  ctx.fillStyle='#9fb1d8';
  ctx.font='11px system-ui';
  ctx.fillText("間合い選択ごっこ (focus shot 追加)",W/2,H/2-58);
  ctx.fillStyle='#cfd4e4';
  ctx.font='12px system-ui';
  ctx.fillText('SHIFT = 精密に撃つ (遅く・狭く・強く・小)',W/2,H/2-30);
  ctx.fillText('= 弾の間合いを毎秒選び替えるごっこ',W/2,H/2-12);
  ctx.font='11px system-ui';
  ctx.fillStyle='#9fb1d8';
  ctx.fillText('SHIFT 中の撃破で TOKEN 蓄積 (small+1/med+3/large+9)',W/2,H/2+10);
  ctx.fillText('TOKEN 3 で Z = FOCUS BURST (1秒 DPS2.0/移動0.4/hit0.3)',W/2,H/2+28);
  ctx.fillStyle='#506080';
  ctx.font='10px system-ui';
  ctx.fillText('WASD/矢印 MOVE  SPACE BOMB/DEF/start/retry  M MUTE',W/2,H/2+50);
  ctx.fillStyle='#ffd870';
  ctx.font='bold 13px system-ui';
  if((state.t/30|0)%2===0)ctx.fillText('PRESS SPACE',W/2,H/2+90);
  ctx.textAlign='left';
}

function drawOver(){
  ctx.fillStyle='rgba(7,9,26,0.7)';
  ctx.fillRect(0,H/2-100,W,240);
  ctx.textAlign='center';
  ctx.fillStyle='#ff80a0';
  ctx.font='bold 26px system-ui';
  ctx.fillText('GAME OVER',W/2,H/2-50);
  ctx.fillStyle='#cfd4e4';
  ctx.font='13px system-ui';
  ctx.fillText(`SCORE  ${state.score}`,W/2,H/2-20);
  ctx.fillText(`KILL   ${state.killCount}`,W/2,H/2-2);
  ctx.fillText(`GRAZE  ${state.grazeCount}`,W/2,H/2+16);
  ctx.fillText(`BOMB   ${state.bombCount}`,W/2,H/2+34);
  ctx.fillText(`BURST  ${state.burstCount}`,W/2,H/2+52);
  ctx.fillText(`WAVE   ${state.wave}`,W/2,H/2+70);
  if(state.score===state.hiscore&&state.score>0){
    ctx.fillStyle='#ffd870';
    ctx.font='bold 12px system-ui';
    ctx.fillText('NEW RECORD',W/2,H/2+94);
  }
  if(state.unlockT<=0){
    ctx.fillStyle='#ffd870';
    ctx.font='bold 13px system-ui';
    if((state.t/30|0)%2===0)ctx.fillText('PRESS SPACE TO RETRY',W/2,H/2+120);
  }else{
    ctx.fillStyle='#506080';
    ctx.font='10px system-ui';
    ctx.fillText('...',W/2,H/2+120);
  }
  ctx.textAlign='left';
}

window.addEventListener('keydown',e=>{
  if(e.repeat)return;
  const k=e.key.toLowerCase();
  if(k==='m'){muted=!muted;return;}
  if(k===' '||k==='spacebar')e.preventDefault();
  // shift / z は preventDefault 不要 (ブラウザショートカット干渉が少ない)
  keys[k]=true;
  if(k==='shift')keys['shift']=true;
  if(k==='z')keys['z_press']=true;
  if(k===' '){
    keys['space_press']=true;
    if(state.mode==='title'){startGame();}
    else if(state.mode==='over'&&state.unlockT<=0){startGame();}
  }
  if(k.startsWith('arrow'))keys[k]=true;
});
window.addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  keys[k]=false;
  if(k==='shift')keys['shift']=false;
});

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
