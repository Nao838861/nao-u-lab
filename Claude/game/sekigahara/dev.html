<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>関ヶ原 1600</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="view"></div>
<div id="labels"></div>

<header id="title">
  <h1>関ヶ原 <small>慶長5年9月15日（1600年10月21日）</small></h1>
</header>

<aside id="panel">
  <button id="zukanBtn" class="zk-open">武将図鑑 <small>顔・能力・逸話</small></button>
  <section>
    <h3>視点</h3>
    <div class="btns">
      <button data-view="overview">全景</button>
      <button data-view="east">東軍の背後から</button>
      <button data-view="south">南から</button>
      <button data-view="top">真上</button>
      <button data-view="ishida">笹尾山（三成）</button>
      <button data-view="matsuo">松尾山（小早川）</button>
      <button data-view="ieyasu">桃配山（家康）</button>
      <button data-view="nangu">南宮山（毛利）</button>
      <button data-view="road">街道と刈田</button>
    </div>
    <p class="camera-help">WASDで前後左右に移動。ドラッグで地図を移動、Shift＋ドラッグで回転・傾斜。ホイールでズーム、地面をダブルクリックでその地点に接近。</p>
  </section>
  <section>
    <label>1体あたりの人数
      <select id="ratio"><option value="1">1人（全員）</option><option value="4">4人</option><option value="10">10人</option></select>
    </label>
    <label>兵の大きさ <span id="scaleV">1.6倍</span>
      <input id="scale" type="range" min="1" max="4" step="0.2" value="1.6">
    </label>
    <label>天候
      <select id="fog"><option value="auto" selected>史実どおり（朝霧が晴れる）</option><option value="clear">晴れ</option><option value="haze">薄霞</option><option value="mist">霧</option></select>
    </label>
    <label class="chk"><input id="autoCam" type="checkbox" checked> 出来事でカメラが動く</label>
    <label class="chk"><input id="slowEv" type="checkbox" checked> 出来事で再生を遅くする</label>
    <label>名札
      <select id="labelsSel"><option value="all">すべて</option><option value="major">主要のみ</option><option value="none">なし</option></select>
    </label>
  </section>
  <section>
    <h3>異説・もしも</h3>
    <div id="ifs"></div>
    <button id="ifRun">この条件で最初から</button>
  </section>
  <section class="stats"><div id="count"></div><div id="trees"></div><div id="fps"></div></section>
  <section class="legend">
    <span class="lg"><i class="sd W">西</i>西軍</span><span class="lg"><i class="sd E">東</i>東軍</span><span class="lg"><i class="sd E turn">東</i>寝返り</span>
  </section>
</aside>

<article id="info" hidden></article>
<aside id="officer-preview" role="tooltip" hidden></aside>
<article id="card" hidden></article>
<article id="summary" hidden></article>
<ol id="log"></ol>
<div id="start"><button id="startBtn">▶ 合戦を見る</button><br><button id="zukanStart" class="zk-open">先に武将図鑑を見る</button><p>午前7時30分から。出来事ごとに解説が出ます（スペースキーで一時停止）</p></div>
<nav id="timeline">
  <button id="playBtn">▶</button>
  <div class="tm"><b id="clock">7:30</b><small id="koku">辰の刻</small></div>
  <div class="track"><div id="marks"></div><input id="seek" type="range" step="60"></div>
  <select id="speed"><option value="15">ゆっくり</option><option value="60" selected>標準（1秒=1分）</option><option value="180">速い</option><option value="480">とても速い</option></select>
</nav>

<footer id="credit">地形：国土地理院 標高タイル（DEM10B）を加工 ／ 布陣・兵数・推移：通説に基づく簡易モデル ／ 武将名にカーソルで能力、クリックで解説 ／ 右上の「武将図鑑」で全武将の逸話</footer>

<script src="data/dem.js"></script>
<script src="data/ground.js"></script>
<script src="data/ground_detail.js"></script>
<script src="data/card_relief.js"></script>
<script src="data/geo.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
