<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="view"></div>
<div id="labels"></div>

<header id="title">
  <h1>関ヶ原 <small>慶長5年9月15日（1600年10月21日）</small></h1>
</header>

<aside id="panel">
  <section>
    <h3>視点</h3>
    <div class="btns">
      <button data-view="overview">全景</button>
      <button data-view="east">東軍の背後から</button>
      <button data-view="south">南から</button>
      <button data-view="top">真上</button>
      <button data-view="ishida">笹尾山（三成）</button>
      <button data-view="matsuo">松尾山（小早川）</button>
      <button data-view="ieyasu">桃配山（家康）</button>
      <button data-view="nangu">南宮山（毛利）</button>
    </div>
  </section>
  <section>
    <label>1体あたりの人数
      <select id="ratio"><option value="1">1人（全員）</option><option value="4">4人</option><option value="10">10人</option></select>
    </label>
    <label>兵の大きさ <span id="scaleV">1.6倍</span>
      <input id="scale" type="range" min="1" max="4" step="0.2" value="1.6">
    </label>
    <label>天候
      <select id="fog"><option value="auto" selected>史実どおり（朝霧が晴れる）</option><option value="clear">晴れ</option><option value="haze">薄霞</option><option value="mist">霧</option></select>
    </label>
    <label class="chk"><input id="autoCam" type="checkbox" checked> 出来事でカメラが動く</label>
    <label class="chk"><input id="slowEv" type="checkbox" checked> 出来事で再生を遅くする</label>
    <label>名札
      <select id="labelsSel"><option value="all">すべて</option><option value="major">主要のみ</option><option value="none">なし</option></select>
    </label>
  </section>
  <section>
    <h3>もしも</h3>
    <div id="ifs"></div>
    <button id="ifRun">この条件で最初から</button>
  </section>
  <section class="stats"><div id="count"></div><div id="trees"></div><div id="fps"></div></section>
  <section class="legend">
    <span class="lg"><i class="sd W">西</i>西軍</span><span class="lg"><i class="sd E">東</i>東軍</span><span class="lg"><i class="sd E turn">東</i>寝返り</span>
  </section>
</aside>

<article id="info" hidden></article>
<article id="card" hidden></article>
<article id="summary" hidden></article>
<ol id="log"></ol>
<div id="start"><button id="startBtn">▶ 合戦を見る</button><p>午前7時30分から。出来事ごとに解説が出ます（スペースキーで一時停止）</p></div>
<nav id="timeline">
  <button id="playBtn">▶</button>
  <div class="tm"><b id="clock">7:30</b><small id="koku">辰の刻</small></div>
  <div class="track"><div id="marks"></div><input id="seek" type="range" step="60"></div>
  <select id="speed"><option value="15">ゆっくり</option><option value="60" selected>標準（1秒=1分）</option><option value="180">速い</option><option value="480">とても速い</option></select>
</nav>

// 部隊シミュレーション層（描画から独立。Node でもそのまま動く）
// 時刻は「0時からの秒」。1ステップ = SIM_DT 秒。決定論（乱数なし）。

const T_START = 7.5 * 3600;   // 7:30
const T_END = 17 * 3600;      // 17:00 日没
const SIM_DT = 2;
const K_FIRE = 0.0011;
let PATH_EXPOSE = 2;               // 戦闘力係数（人/秒/√人）

function hhmm(t) {
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60);
  return `${h}:${String(m).padStart(2, '0')}`;
}
function koku(t) {
  const h = t / 3600;
  if (h < 7) return '卯の刻'; if (h < 9) return '辰の刻'; if (h < 11) return '巳の刻';
  if (h < 13) return '午の刻'; if (h < 15) return '未の刻'; if (h < 17) return '申の刻'; return '酉の刻';
}

// units: units.js の定義, xz: (lon,lat)=>[x,z], params: 部隊ごとの能力, bounds: {hx, hz} 地図の半幅
function createSim(units, xz, params, bounds) {
  const S = { t: T_START, units: [], byId: {}, flags: {}, fired: new Set(), log: [], listeners: [], result: null, over: false, xz, bounds, contacts: [] };
  for (const d of units) {
    const p = params[d.id] || {};
    const [x, z] = xz(d.lon, d.lat);
    const u = {
      id: d.id, def: d, name: d.name, side: d.side, origSide: d.side,
      n: d.n, n0: d.n, killed: 0, morale: p.morale ?? 0.9, morale0: p.morale ?? 0.9, msens: p.msens ?? 1.6,
      q: p.q ?? 1, fort: p.fort ?? 1, x, z, hx: x, hz: z, face: d.face, homeFace: d.face,
      r: Math.min(190, Math.max(25, Math.sqrt(d.n) * 1.4)),
      order: { type: d.idle ? 'idle' : 'hold' }, status: d.hidden ? 'gone' : 'hold', hidden: !!d.hidden, contacts: [],
      moving: 0, fighting: 0, fire: 0, retreat: p.retreat ? xz(...p.retreat) : null, speed: p.speed ?? 0.9, noRout: !!p.noRout, homeR: p.homeR ?? 150,
    };
    S.units.push(u); S.byId[d.id] = u;
  }
  S.emit = (id, data = {}) => {
    if (S.fired.has(id)) return false;
    S.fired.add(id);
    const e = { id, t: S.t, ...data };
    S.log.push(e);
    for (const f of S.listeners) f(e);
    return true;
  };
  return S;
}

const alive = (u) => u.status !== 'gone';
const dist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
const isBroken = (u) => u.status === 'rout' || u.status === 'gone';

function setOrder(S, id, order) {
  const u = S.byId[id];
  if (!u || isBroken(u)) return;
  u.order = order;
  if (order.type === 'hold') { u.hx = u.x; u.hz = u.z; }
}

function hostile(a, b) {
  if (a.side !== b.side) return true;
  // 島津は陣を乱して逃げ込む味方にも鉄砲を向けた
  return (a.order.type === 'aloof' && b.status === 'rout') || (b.order.type === 'aloof' && a.status === 'rout');
}

function rout(S, u, why) {
  if (isBroken(u)) return;
  u.status = 'rout';
  let to = u.retreat;
  if (!to) to = u.side === 'E' ? S.xz(136.545, 35.370) : S.xz(136.432, 35.378);
  u.order = { type: 'flee', x: to[0], z: to[1] };
  u.speed = 1.5;
  S.emit('rout:' + u.id, { unit: u.id, why, by: u.contacts.filter((c) => c.side !== u.side).map((c) => c.name) });
  // 周囲の味方の動揺
  for (const f of S.units) {
    if (f === u || f.side !== u.side || isBroken(f)) continue;
    const d = dist(f, u);
    if (d < 1100) f.morale -= 0.1 * Math.min(1.5, Math.max(0.3, u.n0 / 5000)) * (1 - d / 1400);
  }
}

function nearestEnemy(S, u, maxD, filter) {
  let best = null, bd = maxD;
  for (const e of S.units) {
    if (!alive(e) || e.side === u.side || e.status === 'rout') continue;
    if (e.order.type === 'aloof' || e.order.type === 'idle') continue;
    if (filter && !filter(e)) continue;
    const d = dist(u, e);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

function moveToward(u, tx, tz, speed, dt, stopAt = 0) {
  const dx = tx - u.x, dz = tz - u.z, d = Math.hypot(dx, dz);
  if (d <= stopAt + 0.5) return true;
  const s = Math.min(speed * dt, d - stopAt);
  u.x += dx / d * s; u.z += dz / d * s;
  u.moveDir = Math.atan2(dx, -dz) * 180 / Math.PI; // 方位
  u.moved += s;
  return false;
}

function stepSim(S, brain) {
  const dt = SIM_DT;
  S.t += dt;
  brain(S);
  const U = S.units.filter(alive);
  for (const u of U) { u.contacts = []; u.moved = 0; u.fire = 0; }
  S.contacts = [];
  // 接触判定
  for (let i = 0; i < U.length; i++) for (let j = i + 1; j < U.length; j++) {
    const a = U[i], b = U[j];
    if (!hostile(a, b)) continue;
    if ((a.order.type === 'idle' && b.order.type === 'idle')) continue;
    const reach = a.r + b.r + ((a.order.type === 'aloof' || b.order.type === 'aloof') ? -10 : 25);
    if (dist(a, b) < reach) { a.contacts.push(b); b.contacts.push(a); S.contacts.push([a, b]); }
  }
  // 射撃・白兵（Lanchester 風、正面幅で頭打ちになるよう √n）
  const dmg = new Map();
  for (const a of U) {
    const targets = a.contacts.filter((b) => a.side !== b.side || a.order.type === 'aloof');
    a.fighting = targets.length ? 1 : 0;
    if (!targets.length) continue;
    let F = K_FIRE * a.q * (0.35 + 0.65 * Math.max(0, a.morale)) * Math.sqrt(a.n) * dt;
    if (a.status === 'rout') F *= 0.15;
    a.fire = F;
    const W = targets.reduce((s, b) => s + Math.sqrt(Math.max(0, b.n)), 0);
    if (W <= 0) continue;
    for (const b of targets) {
      let f = F * Math.sqrt(Math.max(0, b.n)) / W;
      // 側面・背後からの攻撃は効く
      const brg = Math.atan2(a.x - b.x, -(a.z - b.z)) * 180 / Math.PI;
      const off = Math.abs(((brg - b.face + 540) % 360) - 180);
      const flank = off > 110 ? 1.8 : off > 65 ? 1.35 : 1;
      f *= flank;
      if (flank > 1) b.flanked = (b.flanked || 0) + 1;
      if (b.status === 'rout') f *= 2.5;
      else if (b.order.type === 'path') f *= PATH_EXPOSE; // 敵中を駆け抜ける隊は四方から撃たれる
      else if (b.atHome) f /= b.fort;
      dmg.set(b, (dmg.get(b) || 0) + f);
    }
  }
  for (const [b, f] of dmg) {
    const real = Math.min(f, b.n);
    b.n -= real; b.killed += real;
    if (b.n < 1 && b.status !== 'gone') { b.n = 0; b.status = 'gone'; S.emit('gone:' + b.id, { unit: b.id }); }
    if (b.status !== 'rout') b.morale -= real / b.n0 * b.msens;
  }
  // 士気の回復・崩壊判定
  for (const u of U) {
    if (!u.fighting && u.status !== 'rout' && u.morale < u.morale0) u.morale = Math.min(u.morale0, u.morale + 0.00008 * dt);
    if (u.status !== 'rout' && !u.noRout && (u.morale < 0.18 || u.n < 0.22 * u.n0)) rout(S, u, u.n < 0.22 * u.n0 ? 'loss' : 'morale');
  }
  // 移動
  for (const u of U) {
    const o = u.order;
    if (o.type === 'attack') {
      let T = S.byId[o.target];
      if (!T || isBroken(T) || T.side === u.side) {
        T = (S.retarget && S.retarget(S, u)) || nearestEnemy(S, u, 1600);
        if (T) o.target = T.id; else { setOrder(S, u.id, { type: 'hold' }); }
      }
      // 捨て奸に接していれば、それを片づけるまで先へ進めない（足止め）
      if (T && !u.contacts.includes(T) && !u.contacts.some((c) => c.hidden && c.side !== u.side)) moveToward(u, T.x, T.z, u.speed, dt, u.r + T.r + 15);
    } else if (o.type === 'move') {
      if (moveToward(u, o.x, o.z, u.speed, dt)) setOrder(S, u.id, { type: 'hold' });
    } else if (o.type === 'path') {
      const wp = o.pts[o.i];
      if (!wp) { o.done = true; }
      else if (moveToward(u, wp[0], wp[1], o.speed || 1.3, dt)) o.i++;
    } else if (o.type === 'flee') {
      moveToward(u, o.x, o.z, u.speed, dt);
      const out = Math.abs(u.x) > S.bounds.hx - 20 || Math.abs(u.z) > S.bounds.hz - 20;
      if (out || Math.hypot(o.x - u.x, o.z - u.z) < 40 || u.n < 25) { u.status = 'gone'; S.emit('gone:' + u.id, { unit: u.id, fled: true }); }
    } else if (o.type === 'hold' || o.type === 'aloof' || o.type === 'idle') {
      if (!u.fighting) moveToward(u, u.hx, u.hz, 0.25, dt);
    }
    u.atHome = (o.type === 'hold' || o.type === 'aloof' || o.type === 'idle') && Math.hypot(u.x - u.def0x(), u.z - u.def0z()) < u.homeR;
  }
  // 押し合い（優勢な側へ戦線が動く）
  for (const [a, b] of S.contacts) {
    if (a.side === b.side || isBroken(a) || isBroken(b)) continue;
    if (a.order.type === 'path' || b.order.type === 'path') continue;
    if (a.order.type === 'aloof' || b.order.type === 'aloof') continue; // 島津は押し合いに加わらない
    const fa = a.fire, fb = b.fire;
    if (fa + fb <= 0) continue;
    const p = (fa - fb) / (fa + fb);
    const d = dist(a, b) || 1, ux = (b.x - a.x) / d, uz = (b.z - a.z) / d;
    const s = p * 0.3 * dt;
    for (const u of [a, b]) {
      u.x += ux * s; u.z += uz * s;
      if (u.order.type === 'hold') { // 持ち場から離れすぎない
        const hx = u.x - u.hx, hz = u.z - u.hz, hd = Math.hypot(hx, hz);
        if (hd > 350) { u.x = u.hx + hx / hd * 350; u.z = u.hz + hz / hd * 350; }
      }
    }
  }
  // 重なり回避
  for (let i = 0; i < U.length; i++) for (let j = i + 1; j < U.length; j++) {
    const a = U[i], b = U[j];
    if (a.status === 'gone' || b.status === 'gone') continue;
    if (a.order.type === 'path' || b.order.type === 'path' || a.status === 'rout' || b.status === 'rout') continue;
    const aloof = a.order.type === 'aloof' || b.order.type === 'aloof';
    const k = aloof ? 1.05 : a.side === b.side ? 0.8 : 0.75;
    const d = dist(a, b), min = (a.r + b.r) * k;
    if (d < min && d > 0.01) {
      const push = (min - d) * 0.06, ux = (b.x - a.x) / d, uz = (b.z - a.z) / d;
      // 島津の陣には近づけない（島津側は動かず、相手だけが避ける）
      const ma = b.order.type === 'aloof' ? 2 : a.order.type === 'aloof' ? 0 : 1, mb = a.order.type === 'aloof' ? 2 : b.order.type === 'aloof' ? 0 : 1;
      a.x -= ux * push * ma; a.z -= uz * push * ma; b.x += ux * push * mb; b.z += uz * push * mb;
    }
  }
  // 向き
  for (const u of U) {
    let want = u.homeFace;
    if (u.contacts.length) {
      const e = u.contacts.reduce((m, c) => (dist(u, c) < dist(u, m) ? c : m));
      want = Math.atan2(e.x - u.x, -(e.z - u.z)) * 180 / Math.PI;
    } else if (u.moved > 0.1 * dt && u.moveDir !== undefined) want = u.moveDir;
    let df = ((want - u.face + 540) % 360) - 180;
    u.face += df * Math.min(1, 0.03 * dt);
    u.moving = u.moved > 0.15 * dt ? 1 : 0;
  }
}

// 初期位置（持ち場判定用）
function prepare(S) {
  for (const u of S.units) { const x0 = u.x, z0 = u.z; u.def0x = () => x0; u.def0z = () => z0; }
  return S;
}

function sideTotals(S) {
  const r = { W: { n0: 0, killed: 0 }, E: { n0: 0, killed: 0 } };
  for (const u of S.units) { if (!u.hidden) r[u.origSide].n0 += u.n0; r[u.origSide].killed += u.killed; }
  return r;
}

// 敗走メッセージ（固有イベントのない部隊用）
function routText(S, e) {
  const u = S.byId[e.unit];
  const by = (e.by || []).slice(0, 4).join('・');
  const cause = e.why === 'loss' ? '兵の多くを失い' : e.why === 'collapse' ? '味方の総崩れに巻き込まれ' : '士気が持たずに';
  const dir = u.origSide === 'W' ? (u.retreat ? '後方の山へ' : '西へ') : '東へ';
  return { title: `${u.name}隊、崩れる`, tag: '戦況', focus: [u.id], slow: true, pause: true,
    body: `${by ? by + 'の攻撃を受けて、' : ''}${u.name}隊が${cause}崩れた。残る約${Math.round(u.n).toLocaleString()}人が${dir}退いていく（死傷 約${Math.round(u.killed).toLocaleString()}人）。` };
}

// ── 判断ルール ──
function makeBrain(opts = DEFAULT_OPTS) {
  const O = { ...DEFAULT_OPTS, ...opts };
  const rules = [];
  const at = (t, id, fn) => rules.push({ id, when: (S) => S.t >= t, fn });
  const when = (id, cond, fn) => rules.push({ id, when: cond, fn });
  const attack = (S, id, target) => setOrder(S, id, { type: 'attack', target });
  const U = (S, id) => S.byId[id];
  const broken = (S, ...ids) => ids.every((id) => isBroken(S.byId[id]));
  const near = (S, a, b, d) => Math.hypot(U(S, a).x - U(S, b).x, U(S, a).z - U(S, b).z) < d;

  at(H(7, 30), 'intro', (S) => S.emit('intro'));
  at(H(7, 36), 'fuwa', (S) => S.emit('fuwa'));
  at(H(7, 43), 'hidetada', (S) => S.emit('hidetada'));
  at(H(7, 50), 'otsu', (S) => S.emit('otsu'));
  at(H(7, 56), 'fog', (S) => S.emit('fog'));
  // 島津は最初から孤高
  at(H(7, 30), 'shimazu_stance', (S) => {
    if (O.shimazu === 'history') { setOrder(S, 'shimazu', { type: 'aloof' }); setOrder(S, 'toyohisa', { type: 'aloof' }); }
  });
  // 開戦
  at(H(8, 0), 'open', (S) => {
    if (O.open === 'history') { attack(S, 'ii', 'ukita'); attack(S, 'tadayoshi', 'ukita'); S.emit('nukegake'); }
    else { attack(S, 'fukushima', 'ukita'); S.emit('fukushima_first'); }
  });
  at(H(8, 6), 'fukushima', (S) => {
    attack(S, 'fukushima', 'ukita');
    if (O.open === 'history') S.emit('fukushima_clash');
    else { attack(S, 'ii', 'ukita'); attack(S, 'tadayoshi', 'ukita'); }
  });
  at(H(8, 12), 'ishida_attack', (S) => {
    attack(S, 'kuroda', 'sakon'); attack(S, 'takenaka', 'sakon'); attack(S, 'hosokawa', 'gamo');
    attack(S, 'kato', 'ishida'); attack(S, 'tanaka', 'ishida'); attack(S, 'kanamori', 'gamo');
    S.emit('ishida_attack');
  });
  at(H(8, 18), 'otani_front', (S) => {
    attack(S, 'todo', 'otani2'); attack(S, 'kyogoku', 'otani2'); attack(S, 'terazawa', 'ukita');
    attack(S, 'tsutsui', 'konishi'); attack(S, 'oda', 'konishi'); attack(S, 'furuta', 'konishi'); attack(S, 'ikoma', 'konishi');
    S.emit('otani_front');
  });

  at(H(10, 12), 'taiho', (S) => { S.flags.cannon = S.t; S.emit('taiho'); });
  at(H(10, 40), 'noroshi', (S) => { S.flags.noroshi = S.t; S.emit('noroshi'); });
  at(H(11, 0), 'mori', (S) => {

    else {
      for (const id of ['kikkawa', 'mori', 'ankokuji', 'natsuka', 'chosokabe']) setOrder(S, id, { type: 'hold' });

      attack(S, 'natsuka', 'asano'); attack(S, 'chosokabe', 'asano');

  });
  at(H(11, 30), 'ieyasu_move', (S) => {
    const [x, z] = S.xz(136.4760, 35.3668);
    setOrder(S, 'ieyasu', { type: 'move', x, z }); U(S, 'ieyasu').speed = 0.7; S.emit('ieyasu_move');
  });
  at(H(11, 37), 'mitsunari_visit', (S) => { if (O.shimazu === 'history') S.emit('mitsunari_visit'); });
  at(H(11, 48), 'tsume', (S) => { if (O.kobaya === 'history' || O.kobaya === 'neutral') S.emit('tsume'); });
  // 小早川
  const betray = (S) => {
    const k = U(S, 'kobayakawa'); k.side = 'E'; k.speed = 1.1;

  } else if (O.kobaya === 'early') {

  } else if (O.kobaya === 'west') {
    at(H(12, 0), 'kwest', (S) => { U(S, 'kobayakawa').q = 0.9; U(S, 'kobayakawa').speed = 1.1; attack(S, 'kobayakawa', 'todo'); S.emit('kobaya_west'); });
  }
  when('otani_push', (S) => S.flags.betrayT && S.t >= S.flags.betrayT + 900 && !isBroken(U(S, 'otani')), (S) => S.emit('otani_push'));
  // 脇坂ら4隊
  when('four', (S) => S.flags.betrayT && S.t >= S.flags.betrayT + 1500, (S) => {
    if (O.four === 'history') {

      attack(S, 'wakisaka', 'otani'); attack(S, 'kutsuki', 'otani'); attack(S, 'ogawa', 'hiratsuka'); attack(S, 'akaza', 'otani');

    } else {
      attack(S, 'wakisaka', 'kobayakawa'); attack(S, 'ogawa', 'kobayakawa'); attack(S, 'kutsuki', 'kobayakawa'); attack(S, 'akaza', 'kobayakawa');
      S.emit('four_loyal');
    }
  });
  // 西軍の崩壊の連鎖
  when('shimazu_shoot', (S) => O.shimazu === 'history' && S.t >= H(12, 0) && S.units.some((u) => u.side === 'W' && u.status === 'rout' && u.contacts.includes(U(S, 'shimazu'))),
    (S) => S.emit('shimazu_shoot'));
  when('shimazu_shoot_late', (S) => O.shimazu === 'history' && S.flags.breakoutReady && !S.fired.has('shimazu_shoot'), (S) => S.emit('shimazu_shoot'));
  // 島津の退き口
  when('breakout', (S) => O.shimazu === 'history' && broken(S, 'ishida', 'ukita', 'konishi') && !isBroken(U(S, 'shimazu')), (S) => {
    S.flags.breakoutReady = true;
  });
  when('breakout_go', (S) => S.flags.breakoutReady && S.fired.has('shimazu_shoot') && S.t >= (S.flags.breakoutAt ||= S.t + 300), (S) => {
    const P = (lo, la) => S.xz(lo, la);
    const route = [P(136.4668, 35.3672), P(136.4720, 35.3640), P(136.4752, 35.3608), P(136.4745, 35.3540), P(136.4770, 35.3478), P(136.4815, 35.3380), P(136.4850, 35.3300)];
    setOrder(S, 'shimazu', { type: 'path', pts: route.slice(), i: 0, speed: 1.35 });
    setOrder(S, 'toyohisa', { type: 'path', pts: route.slice(0, 5), i: 0, speed: 1.25 });
    S.flags.breakoutT = S.t;
    S.emit('breakout', { shimazuN: Math.round(U(S, 'shimazu').n) });
  });
  when('pursuit', (S) => S.flags.breakoutT && S.t >= S.flags.breakoutT + 420, (S) => {
    attack(S, 'ii', 'shimazu'); attack(S, 'tadayoshi', 'shimazu'); attack(S, 'honda', 'shimazu');
    for (const id of ['ii', 'tadayoshi', 'honda']) U(S, id).speed = 1.5;
  });
  when('sutegamari', (S) => S.fired.has('sute:sute1'), (S) => S.emit('sutegamari'));
  // 捨て奸: 退却中、数人ずつを道に残して死ぬまで足止めさせる（その兵は戻らない）
  rules.push({ id: 'sute_loop', repeat: true, when: (S) => S.flags.breakoutT && U(S, 'shimazu').order.type === 'path' && S.t >= (S.flags.suteNext ||= S.flags.breakoutT + 600), fn: (S) => {
    S.flags.suteNext = S.t + 300;
    const s = U(S, 'shimazu');
    const d = S.units.find((u) => u.hidden && u.status === 'gone' && !u.used);
    if (!d || s.n < 60) return;
    const k = Math.round(s.n * 0.12);
    s.n -= k;
    // 本隊の真後ろ（来た方向）に残し、追手の方を向かせる
    const back = (s.face + 180) % 360, rad = back * Math.PI / 180;
    Object.assign(d, { used: true, n: k, n0: k, killed: 0, status: 'hold', morale: 1, morale0: 1, q: 2.2, fort: 1.3, noRout: true, msens: 0.3,
      x: s.x + Math.sin(rad) * 60, z: s.z - Math.cos(rad) * 60, face: back, homeFace: back, r: 22 });
    d.hx = d.x; d.hz = d.z; d.order = { type: 'hold' };
    const x0 = d.x, z0 = d.z; d.def0x = () => x0; d.def0z = () => z0;
    S.emit('sute:' + d.id, { unit: d.id, n: k });
  } });
  when('ii_wound', (S) => S.flags.breakoutT && S.t >= S.flags.breakoutT + 1000 && (U(S, 'ii').fighting || S.t >= S.flags.breakoutT + 1600), (S) => {
    const ii = U(S, 'ii'), td = U(S, 'tadayoshi');

  when('toyohisa_stop', (S) => { const o = U(S, 'toyohisa').order; return o.type === 'path' && o.i >= o.pts.length; }, (S) => {

  });
  when('toyohisa_die', (S) => S.flags.breakoutT && (isBroken(U(S, 'toyohisa')) || S.t > S.flags.breakoutT + 3000), (S) => {

  when('chojuin', (S) => S.flags.breakoutT && near(S, 'shimazu', 'toyohisa', 3000) && U(S, 'shimazu').order.type === 'path' && U(S, 'shimazu').order.i >= 5, (S) => {

  when('shimazu_escape', (S) => { const o = U(S, 'shimazu').order; return o.type === 'path' && o.i >= o.pts.length; }, (S) => {

    const s = U(S, 'shimazu'); s.status = 'gone'; S.emit('shimazu_escape', { n: Math.round(s.n + (isBroken(U(S, 'toyohisa')) ? 0 : U(S, 'toyohisa').n)) });
  });
  // 勝敗
  when('east_win', (S) => !S.result && broken(S, 'ishida', 'ukita', 'konishi', 'otani') &&
    (O.kobaya !== 'west' || isBroken(U(S, 'kobayakawa'))), (S) => {
    S.result = { winner: 'E', t: S.t }; S.emit('east_win');
  });
  when('west_win', (S) => !S.result && (isBroken(U(S, 'ieyasu')) || eastFrontBroken(S)), (S) => {
    S.result = { winner: 'W', t: S.t }; S.emit('west_win');
    for (const u of S.units) if (u.side === 'E' && !isBroken(u) && u.id !== 'ieyasu') rout(S, u, 'collapse');
  });
  when('nangu_withdraw', (S) => S.result && S.result.winner === 'E' && S.t >= S.result.t + 1500, (S) => {
    for (const id of ['mori', 'kikkawa', 'ankokuji', 'natsuka', 'chosokabe']) {
      const u = U(S, id); if (isBroken(u)) continue;
      const to = u.retreat; u.status = 'rout'; u.order = { type: 'flee', x: to[0], z: to[1] }; u.speed = 0.9;
    }
    S.emit('nangu_withdraw');
  });
  when('mop', (S) => S.result && S.result.winner === 'E', (S) => {
    // 残る西軍への掃討
    for (const u of S.units) if (u.side === 'E' && u.order.type === 'hold' && !['ieyasu', 'ikeda', 'asano', 'yamauchi', 'arima', 'ii', 'tadayoshi', 'honda'].includes(u.id)) {
      const e = S.units.find((w) => w.side === 'W' && !isBroken(w) && w.order.type !== 'aloof' && w.order.type !== 'idle' && w.order.type !== 'path' && Math.hypot(w.x - u.x, w.z - u.z) < 1500);
      if (e) setOrder(S, u.id, { type: 'attack', target: e.id });
    }
  });
  when('kubi', (S) => S.result && S.result.winner === 'E' && S.t >= Math.max(H(15, 0), S.result.t + 2400) && (S.fired.has('shimazu_escape') || O.shimazu !== 'history' || S.t > H(16, 0)), (S) => {
    S.emit('kubi'); S.flags.kubiT = S.t;
  });
  // その後（三成の最期まで）
  ['epi_capture', 'epi_gate', 'epi_kaki', 'epi_execution'].forEach((id, i) => {
    when(id, (S) => S.flags.kubiT && S.t >= S.flags.kubiT + 180 * (i + 1), (S) => { S.emit(id); if (id === 'epi_execution') S.flags.overAt = S.t + 120; });
  });
  when('over', (S) => S.flags.overAt && S.t >= S.flags.overAt, (S) => { S.over = true; });
  when('end_w', (S) => S.result && S.result.winner === 'W' && S.t >= S.result.t + 2400, (S) => { S.over = true; });
  when('draw', (S) => !S.result && S.t >= H(17, 0) - 4, (S) => { S.result = { winner: 'D', t: S.t }; S.emit('draw'); S.over = true; });

  // 蒲生郷舎は石田隊の前衛として最後まで踏みとどまり、本隊とともに崩れる
  when('gamo_merge', (S) => !isBroken(U(S, 'gamo')) && !isBroken(U(S, 'ishida')) && U(S, 'gamo').n < 0.4 * U(S, 'gamo').n0, (S) => {
    const g = U(S, 'gamo'), i = U(S, 'ishida');
    S.emit('gamo_merge', { n: Math.round(g.n) });
    i.n += g.n; i.morale = Math.min(i.morale0, i.morale + 0.05); g.n = 0; g.status = 'gone';
  });
  when('gamo_fall', (S) => isBroken(U(S, 'ishida')) && !isBroken(U(S, 'gamo')), (S) => { U(S, 'gamo').noRout = false; rout(S, U(S, 'gamo'), 'collapse'); });
  // 大谷隊の壊滅で西軍の南翼が開く
  when('flank', (S) => isBroken(U(S, 'otani')), (S) => { for (const id of ['ukita', 'konishi']) U(S, id).morale -= 0.15; });
  for (const [uid, ev] of Object.entries(ROUT_EVENTS)) when('re_' + uid, (S) => S.fired.has('rout:' + uid) || (S.byId[uid].status === 'gone'), (S) => S.emit(ev));
  const brain = (S) => {
    for (const r of rules) if ((r.repeat || !S.fired.has('rule:' + r.id)) && r.when(S)) { if (!r.repeat) S.fired.add('rule:' + r.id); r.fn(S); }
  };
  return brain;
}

function eastFrontBroken(S) {
  const ids = ['fukushima', 'ii', 'tadayoshi', 'kuroda', 'hosokawa', 'kato', 'tanaka', 'todo', 'kyogoku', 'terazawa', 'tsutsui', 'ikeda', 'asano'];
  let n0 = 0, b = 0;
  for (const id of ids) { const u = S.byId[id]; n0 += u.n0; if (isBroken(u)) b += u.n0; }
  return b / n0 > 0.6;
}

// 敗走イベントに固有カードを割り当てる
const ROUT_EVENTS = { otani: 'yoshitsugu', hiratsuka: 'hiratsuka_die', konishi: 'konishi_flee', ukita: 'ukita_flee', ishida: 'mitsunari_flee' };

// 退却後の標的選び（寝返り部隊は近い西軍を、東軍は島津・南宮山を避ける）
function retarget(S, u) {
  let best = null, bd = 2200;
  for (const e of S.units) {
    if (e.side === u.side || isBroken(e)) continue;
    if (e.order.type === 'aloof' || e.order.type === 'idle' || e.order.type === 'path') continue;
    const d = Math.hypot(e.x - u.x, e.z - u.z);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}


// 解説カードに添える地図（SVG）。座標は経緯度で書き、正距円筒で投影する。
// 広域図は海岸線を省いた略図（琵琶湖・伊勢湾のみ概形）。

function proj(b, w, h) {
  const k = Math.cos(((b.s + b.n) / 2) * Math.PI / 180);
  const sx = w / ((b.e - b.w) * k), sy = h / (b.n - b.s), s = Math.min(sx, sy);
  const ox = (w - (b.e - b.w) * k * s) / 2, oy = (h - (b.n - b.s) * s) / 2;
  return ([lon, lat]) => [ox + (lon - b.w) * k * s, oy + (b.n - lat) * s];
}
const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const path = (P, pts) => pts.map((p, i) => (i ? 'L' : 'M') + P(p).map((v) => v.toFixed(1)).join(' ')).join('');

function frame(w, h, body, note) {
  return `<svg class="cardmap" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
  ${body}
  <g transform="translate(${w - 34},26)"><path d="M0 -14L5 2L0 -2L-5 2z" fill="#3a3024"/><text y="14" text-anchor="middle" font-size="10" fill="#3a3024">北</text></g>
  ${note ? `<text x="8" y="${h - 7}" font-size="10" fill="#5a5040">${esc(note)}</text>` : ''}
</svg>`;
}
function dot(P, ll, label, o = {}) {
  const [x, y] = P(ll);
  const r = o.r || 4, dx = o.dx ?? 7, dy = o.dy ?? 4, anchor = o.anchor || 'start';
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${o.fill || '#2a2218'}" stroke="#fff" stroke-width="1.2"/>
  <text x="${x + dx}" y="${y + dy}" font-size="${o.size || 12}" text-anchor="${anchor}" fill="${o.color || '#1d1a16'}" font-weight="${o.bold ? 700 : 400}" paint-order="stroke" stroke="rgba(246,241,230,.85)" stroke-width="3">${esc(label)}</text>`;
}
function mtn(P, ll, label, o = {}) {
  const [x, y] = P(ll);
  return `<path d="M${x - 7} ${y + 5}L${x} ${y - 7}L${x + 7} ${y + 5}z" fill="#6b5a3a" stroke="#fff" stroke-width="1"/>
  <text x="${x + (o.dx ?? 9)}" y="${y + (o.dy ?? 4)}" font-size="${o.size || 11}" text-anchor="${o.anchor || 'start'}" fill="#2a2218" paint-order="stroke" stroke="rgba(246,241,230,.9)" stroke-width="3">${esc(label)}</text>`;
}
function route(P, pts, color, o = {}) {
  return `<path d="${path(P, pts)}" fill="none" stroke="${color}" stroke-width="${o.w || 3}" ${o.dash ? `stroke-dasharray="${o.dash}"` : ''} stroke-linecap="round" stroke-linejoin="round" ${o.arrow ? 'marker-end="url(#ar)"' : ''} opacity="${o.op || 1}"/>`;
}
function label(P, ll, text, o = {}) {
  const [x, y] = P(ll);
  return `<text x="${x}" y="${y}" font-size="${o.size || 11}" text-anchor="${o.anchor || 'middle'}" fill="${o.color || '#3a3024'}" font-style="${o.italic ? 'italic' : 'normal'}" font-weight="${o.bold ? 700 : 400}" paint-order="stroke" stroke="rgba(246,241,230,.85)" stroke-width="3">${esc(text)}</text>`;
}

const DEM = (() => {
  const bin = atob(window.DEM_B64);
  const u16 = new Uint16Array(DW * DH);
  for (let i = 0; i < u16.length; i++) u16[i] = bin.charCodeAt(i * 2) | (bin.charCodeAt(i * 2 + 1) << 8);
  const f = new Float32Array(u16.length);
  for (let i = 0; i < f.length; i++) f[i] = u16[i] / 10;
  return f;
})();
const CLON = (M.west + M.east) / 2, CLAT = (M.north + M.south) / 2;
function ll2xz(lon, lat) {
  return [(lon - CLON) / (M.east - M.west) * SX, (CLAT - lat) / (M.north - M.south) * SY];
}
function heightAt(x, z) {
  const u = Math.min(Math.max((x / SX + 0.5) * (DW - 1), 0), DW - 1.001);
  const v = Math.min(Math.max((z / SY + 0.5) * (DH - 1), 0), DH - 1.001);
  const i = Math.floor(u), j = Math.floor(v), fu = u - i, fv = v - j;
  const a = DEM[j * DW + i], b = DEM[j * DW + i + 1], c = DEM[(j + 1) * DW + i], d = DEM[(j + 1) * DW + i + 1];

}

uniform float uTime; uniform sampler2D uDem; uniform vec4 uDemInfo;
attribute float aRank;

#endif

gl_Position = projectionMatrix * mvPosition;

function unitMaterials(color) {

    uCenter: { value: new THREE.Vector2() }, uYaw: { value: 0 }, uSpread: { value: 1 }, uLost: { value: 0 }, uVis: { value: 1 }, uMove: { value: 0 },

      .replace('#include <project_vertex>', `
        vec2 pw = uCenter + rotY(transformed.xz * (1.0 + (uSpread - 1.0) * 0.8), uYaw);

}

// ───────────────── 部隊の隊形 ─────────────────
// 1つの「備」の構成（前から）: 鉄砲 → 弓 → 長柄（槍） → 騎馬 → 旗本 → 小荷駄
const BLOCKS = [
  { type: 'teppo', frac: 0.12, sx: 1.4, sz: 2.2, wf: 1.0 },
  { type: 'yumi', frac: 0.05, sx: 1.4, sz: 2.2, wf: 0.8 },
  { type: 'yari', frac: 0.45, sx: 1.15, sz: 1.7, wf: 0.9 },
  { type: 'kiba', frac: 0.10, sx: 2.6, sz: 3.6, wf: 0.75 },
  { type: 'yari', frac: 0.15, sx: 1.5, sz: 2.0, wf: 0.45, honjin: true },
  { type: 'nimotsu', frac: 0.13, sx: 1.9, sz: 2.5, wf: 0.55 },

const SONAE_MAX = 6500;
function rand(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

  let d = 0;
  for (const bl of BLOCKS) {
    const files = Math.max(1, Math.floor(F * bl.wf / (bl.sx * sp)));
    d += Math.ceil(per * bl.frac / (sp * sp) / files) * bl.sz * sp + 5 * sp;
  }
  return d;
}

const state = { ratio: 1, scale: 1.6, labels: 'all' };
const armyGroup = new THREE.Group();
scene.add(armyGroup);
let VIS = []; // 部隊ごとの描画データ

// 倒れた兵（遺体）のプール
const fallenGeo = (() => { const g = footman('none'); g.rotateX(-Math.PI / 2); g.translate(0, 0.18, 0); return g; })();
let corpses = null, corpseN = 0;
function resetCorpses() {
  if (corpses) { scene.remove(corpses); corpses.dispose(); }
  const max = Math.ceil(UNITS.reduce((s, u) => s + u.n, 0) / state.ratio * 0.45) + 200;
  corpses = new THREE.InstancedMesh(fallenGeo, MAT.body, max);
  corpses.count = 0; corpseN = 0; corpses.frustumCulled = false;
  corpses.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

}
const _d = new THREE.Object3D(), _c = new THREE.Color();
function addCorpse(x, z, yaw, color) {
  if (corpseN >= corpses.instanceMatrix.count) return;
  _d.position.set(x, heightAt(x, z), z);
  _d.rotation.set(0, yaw, 0);
  _d.scale.setScalar(state.scale);
  _d.updateMatrix();
  corpses.setMatrixAt(corpseN, _d.matrix);
  _c.copy(color).multiplyScalar(0.7);
  corpses.setColorAt(corpseN, _c);
  corpseN++;
  corpses.count = corpseN;
  corpses.instanceMatrix.needsUpdate = true;
  corpses.instanceColor.needsUpdate = true;
}

function buildArmies() {
  armyGroup.traverse((o) => { if (o.isInstancedMesh) o.dispose(); });
  armyGroup.clear();
  VIS = [];
  const jm = [];
  let total = 0, drawn = 0;
  const r = state.ratio, sp = Math.sqrt(r), S = state.scale;
  const dummy = new THREE.Object3D();
  for (const u of UNITS) {
    const rnd = rand(u.id.split('').reduce((a, c) => a * 31 + c.charCodeAt(0), 7));
    const [cx, cz] = ll2xz(u.lon, u.lat);
    const b = THREE.MathUtils.degToRad(u.face);
    const fx = Math.sin(b), fz = -Math.cos(b), rx = Math.cos(b), rz = Math.sin(b);
    const k = Math.ceil(u.n / SONAE_MAX);
    const per = u.n / k;
    const F = THREE.MathUtils.clamp(Math.sqrt(per) * 2.5, 28, 240);
    const lists = { yari: [], teppo: [], yumi: [], nimotsu: [], kiba: [], nob: [] };
    let honjinAt = null;
    const bb = [Infinity, -Infinity, Infinity, -Infinity];
    let depthAcc = 0;
    const sonaeDepth = estimateDepth(per, F, sp);
    for (let si = 0; si < k; si++) {
      const row = Math.floor(si / 2), inRow = Math.min(2, k - row * 2), col = si % 2;
      const ou = inRow === 1 ? 0 : (col === 0 ? -1 : 1) * (F / 2 + 18);
      let v = -row * (sonaeDepth + 45);
      const isMain = si === k - 1;
      for (const bl of BLOCKS) {
        if (bl.honjin && !isMain) continue;
        const frac = bl.honjin ? bl.frac : bl.frac + (isMain ? 0 : BLOCKS[4].frac / 5);
        const count = Math.max(bl.type === 'kiba' ? 1 : 0, Math.round(per * frac / r));
        if (!count) continue;
        const sx = bl.sx * sp, sz = bl.sz * sp;
        const files = Math.max(1, Math.floor(F * bl.wf / sx));
        const rows = Math.ceil(count / files);
        for (let q = 0; q < count; q++) {
          const fi = q % files, ri = Math.floor(q / files);
          const inThisRow = Math.min(files, count - ri * files);
          const lu = ou + (fi - (inThisRow - 1) / 2) * sx + (rnd() - 0.5) * sx * 0.45;
          const lv = v - ri * sz + (rnd() - 0.5) * sz * 0.35;
          lists[bl.type].push([lu, lv, (rnd() - 0.5) * 0.5]);
          if (lu < bb[0]) bb[0] = lu; if (lu > bb[1]) bb[1] = lu; if (lv < bb[2]) bb[2] = lv; if (lv > bb[3]) bb[3] = lv;
        }
        const nob = Math.round(per * frac / 60 / Math.max(1, sp * 0.7));
        for (let q = 0; q < nob; q++) lists.nob.push([ou + (rnd() - 0.5) * F * bl.wf, v - rnd() * rows * sz, (rnd() - 0.5) * 0.3]);
        if (bl.honjin) honjinAt = [ou, v - rows * sz / 2, F * bl.wf / 2 + 6, rows * sz / 2 + 6];
        v -= rows * sz + 5 * sp;
      }
      depthAcc = Math.max(depthAcc, -v);
    }
    const shift = depthAcc / 2;
    // 部隊ローカル座標（x=左右, z=前後, 前が+z）
    const L = (lu, lv) => [-lu, lv + shift];
    const front = bb[3], back = bb[2];
    const rankOf = (lv) => Math.min(0.999, 0.5 * rnd() + 0.5 * (1 - (lv - back) / Math.max(1, front - back)));
    const toWorld = (lu, lv) => { const lvv = lv + shift; const x = cx + rx * lu + fx * lvv, z = cz + rz * lu + fz * lvv; return [x, heightAt(x, z), z]; };
    const mats = unitMaterials(u.color);

      const col = new THREE.Color();
      list.forEach((p, i) => {

        dummy.scale.setScalar(sc);

    let n = 0;

      const rk = new Float32Array(lists[t].map((p) => rankOf(p[1])));
      rankLists[t] = rk;
      add(t, lists[t], rk, vary(armorCol, 0.35), S, false);
      lists[t].forEach((p, i) => { const [lx, lz] = L(p[0], p[1]); soldiers.push([lx, lz, rk[i], p[2]]); });
      n += lists[t].length;
    }
    const foot = [...lists.yari, ...lists.teppo, ...lists.yumi];
    const footRk = new Float32Array([...rankLists.yari, ...rankLists.teppo, ...rankLists.yumi]);
    add('footFlag', foot, footRk, vary(flagCol, 0.12), S, true);
    add('horseFlag', lists.kiba, rankLists.kiba, vary(flagCol, 0.12), S, true);
    const nobRk = new Float32Array(lists.nob.map((p) => rankOf(p[1])));
    add('nobPole', lists.nob, nobRk, (c) => c.set(1, 1, 1), 1 + (S - 1) * 0.5, false);
    add('nobFlag', lists.nob, nobRk, vary(flagCol, 0.08), 1 + (S - 1) * 0.5, true);
    if (!u.hidden) { total += u.n; drawn += n; }
    soldiers.sort((a, b) => a[2] - b[2]);
    // 本陣（大将と馬印）: 部隊とともに動く。陣幕は陣所に残る
    let anchorL = [0, 0];
    if (honjinAt) {
      const [hu, hv, hw, hd] = honjinAt;
      const corners = [[hu - hw, hv + hd], [hu + hw, hv + hd], [hu + hw, hv - hd], [hu - hw, hv - hd], [hu - hw, hv + hd]];
      for (let e = 0; e < 4; e++) {
        const [a0, b0] = corners[e], [a1, b1] = corners[e + 1];
        const len = Math.hypot(a1 - a0, b1 - b0), seg = Math.max(1, Math.ceil(len / 4));
        for (let s = 0; s < seg; s++) {
          if (e === 0 && Math.abs((s + 0.5) / seg - 0.5) < 0.12) continue;
          jm.push([toWorld(a0 + (a1 - a0) * s / seg, b0 + (b1 - b0) * s / seg), toWorld(a0 + (a1 - a0) * (s + 1) / seg, b0 + (b1 - b0) * (s + 1) / seg), flagCol]);
        }
      }
      anchorL = L(hu, hv);
      const ug = umaGeo(u);
      ug.setAttribute('aRank', new THREE.InstancedBufferAttribute(new Float32Array([2]), 1));
      const um = new THREE.InstancedMesh(ug, mats.body, 1);
      dummy.position.set(anchorL[0], 0, anchorL[1]); dummy.rotation.set(0, 0, 0); dummy.scale.setScalar(Math.max(1.4, S * 1.1)); dummy.updateMatrix();
      um.setMatrixAt(0, dummy.matrix); um.setColorAt(0, flagCol); um.frustumCulled = false;

    for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {

      P.push(lx, 0, lz);
    }
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const a = j * (N + 1) + i; I.push(a, a + N + 1, a + 1, a + 1, a + N + 1, a + N + 2); }
    const fg = new THREE.BufferGeometry();
    fg.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); fg.setIndex(I);
    const fm = new THREE.Mesh(fg, mats.foot);
    fm.frustumCulled = false; fm.renderOrder = 1;
    armyGroup.add(fm);
    if (!u.hidden) { total += 0; }
    VIS.push({ id: u.id, def: u, mats, soldiers, ptr: 0, armorCol, spread: 1, vis: u.hidden ? 0 : 1, anchorL, radius: Math.max(bb[1] - bb[0], bb[3] - bb[2]) / 2 });
  }
  // 陣幕
  const P = [], CC = [];
  const white = C('#e8e4da').convertSRGBToLinear();
  for (const [p0, p1, fc] of jm) {
    const lc = fc.clone().convertSRGBToLinear();
    for (const [y0, y1, cc] of [[0.15, 0.55, white], [0.55, 0.95, lc], [0.95, 1.6, white]]) {
      const q = [[p0[0], p0[1] + y0, p0[2]], [p1[0], p1[1] + y0, p1[2]], [p1[0], p1[1] + y1, p1[2]], [p0[0], p0[1] + y1, p0[2]]];
      for (const idx of [0, 1, 2, 0, 2, 3]) { P.push(...q[idx]); CC.push(cc.r, cc.g, cc.b); }
    }
  }
  const jg = new THREE.BufferGeometry();
  jg.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  jg.setAttribute('color', new THREE.Float32BufferAttribute(CC, 3));
  jg.computeVertexNormals();
  armyGroup.add(new THREE.Mesh(jg, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide })));
  document.getElementById('count').textContent = `兵 ${total.toLocaleString()} 人 → 描画 ${drawn.toLocaleString()} 体（1体 = ${r}人）`;
  resetCorpses();
  buildLabels();
}
function umaGeo(u) {
  const ps = [horseman(), part(new THREE.CylinderGeometry(0.08, 0.1, 9, 6), '#3b2a1a', 0, 1.2, 4.5, -1.5)];
  if (u.leaderMark === 'fan') ps.push(part(new THREE.CircleGeometry(1.9, 16, Math.PI * 0.15, Math.PI * 0.7), '#e8b828', 0, 1.2, 7.6, -1.5));
  else ps.push(part(new THREE.PlaneGeometry(1.4, 2.6), WHITE, 1, 1.95, 7.4, -1.5));
  return mergeGeometries(ps.map((g) => { if (g.attributes.uv) g.deleteAttribute('uv'); return g; }));
}

// 硝煙
const SMOKE_N = 6000;
const smoke = (() => {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(SMOKE_N * 3), 3));
  g.setAttribute('aBirth', new THREE.BufferAttribute(new Float32Array(SMOKE_N).fill(-1e9), 1));
  g.setAttribute('aSeed', new THREE.BufferAttribute(new Float32Array(SMOKE_N).map(() => Math.random()), 1));
  g.setAttribute('aBig', new THREE.BufferAttribute(new Float32Array(SMOKE_N), 1));
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const x = cv.getContext('2d'); const gr = x.createRadialGradient(32, 32, 2, 32, 32, 31);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uNow: { value: 0 }, uPx: { value: 800 }, uTex: { value: new THREE.CanvasTexture(cv) } },
    vertexShader: `attribute float aBirth; attribute float aSeed; attribute float aBig; uniform float uNow; uniform float uPx; varying float vA;
      void main() {
        float age = uNow - aBirth; float life = 160.0 + aBig * 300.0; float k = clamp(age / life, 0.0, 1.0);
        vec3 p = position + vec3(sin(aSeed * 40.0) * k * 25.0 + k * 30.0, k * (20.0 + aBig * 40.0), cos(aSeed * 31.0) * k * 25.0);
        vec4 mv = modelViewMatrix * vec4(p, 1.0); gl_Position = projectionMatrix * mv;
        gl_PointSize = min(512.0, (5.0 + (24.0 + aBig * 50.0) * sqrt(k)) * uPx / -mv.z);
        vA = (age < 0.0 || age > life) ? 0.0 : (1.0 - k) * min(1.0, age / 3.0) * (0.42 + aBig * 0.2);
      }`,
    fragmentShader: `uniform sampler2D uTex; varying float vA; void main() { float a = texture2D(uTex, gl_PointCoord).a * vA; if (a < 0.01) discard; gl_FragColor = vec4(vec3(0.86, 0.86, 0.84), a); }`,
  });
  const pts = new THREE.Points(g, m);
  pts.frustumCulled = false; pts.renderOrder = 2;
  scene.add(pts);
  return { g, m, i: 0 };
})();
function puff(x, z, t, big = 0) {

}
function clearSmoke() { smoke.g.attributes.aBirth.array.fill(-1e9); smoke.dirty = true; }


// ───────────────── 樹木と集落 ─────────────────
function buildTrees(img) {
  const cv = document.createElement('canvas');
  cv.width = img.width; cv.height = img.height;
  const ctx = cv.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const px = ctx.getImageData(0, 0, cv.width, cv.height).data;
  const rnd = rand(1600);
  const conifer = mergeGeometries([
    part(new THREE.ConeGeometry(2.6, 9, 6), '#ffffff', 1, 0, 6.5, 0),
    part(new THREE.CylinderGeometry(0.25, 0.3, 2.5, 4), '#4a3424', 0, 0, 1.25, 0),
  ]);
  const broad = mergeGeometries([
    part(new THREE.IcosahedronGeometry(3.4, 0), '#ffffff', 1, 0, 6.0, 0),
    part(new THREE.CylinderGeometry(0.3, 0.35, 3.5, 4), '#4a3424', 0, 0, 1.75, 0),
  ]);
  const CH = 6, chunks = {};
  const step = 13;
  for (let z = -SY / 2; z < SY / 2; z += step) {
    for (let x = -SX / 2; x < SX / 2; x += step) {
      const jx = x + rnd() * step, jz = z + rnd() * step;
      const ix = Math.floor((jx / SX + 0.5) * cv.width), iz = Math.floor((jz / SY + 0.5) * cv.height);
      const o = (iz * cv.width + ix) * 4;
      const R = px[o], G = px[o + 1], B = px[o + 2];
      const forest = G > R * 1.02 && G < 110 && (R + G + B) < 215;
      const lone = !forest && rnd() < 0.0012;
      if (!forest && !lone) continue;
      if (forest && rnd() < 0.25) continue;
      const kind = (forest && G > R * 1.15) || rnd() < 0.35 ? 'c' : 'b';
      const key = kind + Math.floor((jx / SX + 0.5) * CH) + '_' + Math.floor((jz / SY + 0.5) * CH);
      (chunks[key] ||= []).push([jx, jz, R, G, B]);
    }
  }
  const dummy = new THREE.Object3D(), col = new THREE.Color();
  let count = 0;
  for (const [key, list] of Object.entries(chunks)) {
    const mesh = new THREE.InstancedMesh(key[0] === 'c' ? conifer : broad, MAT.body, list.length);
    list.forEach(([x, z, R, G, B], i) => {
      dummy.position.set(x, heightAt(x, z) - 0.5, z);
      dummy.rotation.set(0, rnd() * 6.28, 0);
      const s = 0.7 + rnd() * 0.8;
      dummy.scale.set(s, s * (0.8 + rnd() * 0.5), s);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);
      col.setRGB(R / 255 * 0.9, G / 255 * 0.95, B / 255 * 0.85, THREE.SRGBColorSpace);
      mesh.setColorAt(i, col);
    });
    mesh.computeBoundingSphere();
    scene.add(mesh);
    count += list.length;
  }
  document.getElementById('trees').textContent = `樹木 ${count.toLocaleString()} 本`;
}

function buildVillages() {
  const G = window.GEO;
  const house = mergeGeometries([
    part(box(8, 2.6, 5.5), '#8a7a62', 0, 0, 1.3, 0),
    part(roofGeo(9.2, 3.2, 6.6), '#ffffff', 1, 0, 2.6, 0),
  ]);
  const roads = Object.fromEntries(G.roads.map((r) => [r.name, r.pts.map(([lo, la]) => ll2xz(lo, la))]));
  const rnd = rand(42);
  const items = [];
  for (const v of G.villages) {
    const [vx, vz] = ll2xz(v.lon, v.lat);
    for (let i = 0; i < v.n; i++) {
      let x, z, ang;
      if (v.along) {
        // 街道沿いに両側へ並べる
        const pts = roads[v.along];
        let best = 0, bd = Infinity;
        pts.forEach(([px, pz], k) => { const d = Math.hypot(px - vx, pz - vz); if (d < bd) { bd = d; best = k; } });
        const a = pts[Math.max(0, best - 1)], b = pts[Math.min(pts.length - 1, best + 1)];
        const dx = b[0] - a[0], dz = b[1] - a[1], L = Math.hypot(dx, dz);
        const t = (rnd() - 0.5) * 2 * v.r, side = rnd() < 0.5 ? -1 : 1, off = 12 + rnd() * 10;
        x = vx + dx / L * t - dz / L * off * side; z = vz + dz / L * t + dx / L * off * side;

function focusUnits(ids, minDist = 600) {

  let ext = 0; for (const u of us) ext = Math.max(ext, Math.hypot(u.x - cx, u.z - cz) + u.r);

// ───────────────── ループ ─────────────────
const clock = new THREE.Clock();
let frames = 0, fpsT = 0;
function loop() {
  const dt = Math.min(0.1, clock.getDelta());
  SHARED.uTime.value += dt;
  const running = play.playing && !waitingForNext && !SIM.over;
  if (running) {
    const now = performance.now();
    const sp = now < play.holdUntil ? 0 : now < play.slowUntil ? Math.min(play.speed, 12) : play.speed;
    $('timeline').classList.toggle('hold', now < play.holdUntil);
    play.gameT += dt * sp;
    let guard = 0;
    while (SIM.t < play.gameT && !SIM.over && guard++ < 400) simStep();
    if (SIM.over) { play.gameT = SIM.t; setPlaying(false); }
  }
  // 部隊の描画を更新（シム2秒刻みの間を補間）
  const a = THREE.MathUtils.clamp(1 - (SIM.t - play.gameT) / SIM_DT, 0, 1);
  for (const V of VIS) {
    const u = SIM.byId[V.id], U = V.mats.uni;
    const x = u.px + (u.x - u.px) * a, z = u.pz + (u.z - u.pz) * a;
    let df = ((u.face - u.pface + 540) % 360) - 180;
    const face = u.pface + df * a;
    U.uCenter.value.set(x, z);
    U.uYaw.value = Math.PI - face * Math.PI / 180;
    V.spread += ((u.status === 'rout' || u.status === 'gone' ? 2.6 : 1) - V.spread) * Math.min(1, dt * 0.8);
    U.uSpread.value = V.spread;
    U.uLost.value = Math.min(1, u.killed / u.n0);
    V.vis += ((u.status === 'gone' ? 0 : 1) - V.vis) * Math.min(1, dt * 0.7);
    U.uVis.value = V.vis;
    U.uMove.value = running && u.moving ? 1 : 0;
    const d = camera.position.distanceTo(tmp.set(x, heightAt(x, z), z));
    V.mats.foot.opacity = THREE.MathUtils.clamp((d - 700) / 2200, 0, 0.6) * V.vis * (u.status === 'rout' ? 0.5 : 1);
    V.mats.foot.visible = V.mats.foot.opacity > 0.01;
  }
  if (smoke.dirty) { smoke.g.attributes.position.needsUpdate = true; smoke.g.attributes.aBirth.needsUpdate = true; smoke.g.attributes.aBig.needsUpdate = true; smoke.dirty = false; }
  smoke.m.uniforms.uNow.value = play.gameT;
  smoke.m.uniforms.uPx.value = renderer.domElement.height / (2 * Math.tan(camera.fov * Math.PI / 360));
  updateEnvironment(play.gameT);
  if (fly) {
    fly.k = Math.min(1, fly.k + dt / fly.dur);
    const e = fly.k < 0.5 ? 2 * fly.k * fly.k : 1 - Math.pow(-2 * fly.k + 2, 2) / 2;
    camera.position.lerpVectors(fly.p0, fly.p1, e);
    controls.target.lerpVectors(fly.t0, fly.t1, e);
    if (fly.k >= 1) fly = null;
  }
  controls.update();
  const gh = heightAt(camera.position.x, camera.position.z) + 6;
  if (camera.position.y < gh) camera.position.y = gh;
  scene.userData.sky.position.copy(camera.position);
  renderer.render(scene, camera);
  updateLabels();
  $('clock').textContent = `${hhmm(play.gameT)}`;
  $('koku').textContent = koku(play.gameT);
  if (!$('seek').matches(':active')) $('seek').value = play.gameT;
  frames++; fpsT += dt;
  if (fpsT > 0.5) { $('fps').textContent = Math.round(frames / fpsT) + ' fps'; frames = 0; fpsT = 0; }
  requestAnimationFrame(loop);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ───────────────── 起動 ─────────────────
bindUI();
buildVillages();
newSim();
buildArmies();
buildMarkers();
{
  const [x, z] = ll2xz(136.4990, 35.3560), [lx, lz] = ll2xz(136.4630, 35.3640);
  camera.position.set(x, heightAt(x, z) + 2100, z);
  controls.target.set(lx, heightAt(lx, lz), lz);
  controls.update();
}
// 検証用 URL パラメータ: t=秒 or hh:mm, play=1, view=, cam=lon,lat,h,lookLon,lookLat, ratio=, sel=
{
  const q = new URLSearchParams(location.search);
  if (q.get('ratio')) { state.ratio = +q.get('ratio'); $('ratio').value = q.get('ratio'); buildArmies(); }
  if (q.get('if')) { for (const kv of q.get('if').split(',')) { const [k, v] = kv.split('='); play.opts[k] = v; } newSim(); buildMarkers(); }
  if (q.get('t')) { const [hh, mm] = q.get('t').split(':').map(Number); seek(hh * 3600 + (mm || 0) * 60); $('start').hidden = true; }
  const fin = () => { if (fly) { fly.k = 1; camera.position.copy(fly.p1); controls.target.copy(fly.t1); fly = null; controls.update(); } };
  if (q.get('view') && PRESETS[q.get('view')]) { PRESETS[q.get('view')](); fin(); }
  if (q.get('cam')) { presetFrom(...q.get('cam').split(',').map(Number)); fin(); }
  if (q.get('focus')) { focusUnits(q.get('focus').split(',')); fin(); }
  if (q.get('play')) { setPlaying(true); }
  if (q.get('speed')) { play.speed = +q.get('speed'); }
}
window.__ready = true;
window.__sim = () => SIM;
loop();
