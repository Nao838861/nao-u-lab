<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>graze_log v05.2_cdx_v25 - rebuilt enemy grammar</title>
<style>
html,body{margin:0;background:#05050f;color:#cfd4e4;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
canvas{background:#07091a;box-shadow:0 0 40px #1b2040;display:block;margin-top:12px}

<body>
<h1>GRAZE</h1>
<p>ARROWS / WASD MOVE &middot; SPACE START / BOMB(B) / ACTIVE DEF(D) / RETRY &middot; M MUTE</p>
<canvas id="c" width="420" height="620"></canvas>
<p id="seedinfo"></p>
<script>
const W=420,H=620;
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const seedinfo=document.getElementById('seedinfo');
const keys={};
const BOT_ENABLED=new URLSearchParams(location.search).get('bot')==='1';
const SEED=(function(){const u=new URLSearchParams(location.search).get('seed');const n=parseInt(u||'',10);return isNaN(n)?((Date.now()&0xffffffff)>>>0):(n>>>0);})();
function mulberry32(s){return function(){s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
seedinfo.textContent=`seed=${SEED}  (?seed=N to reproduce)`;

const G_MAX=208,G_LV2=35,G_LV3=99,R_GRAZE=22,R_HIT=8;
const GRAZE_STREAK_TH=8,ACTIVE_DEF_FRAMES=42,ACTIVE_DEF_RADIUS=62;
const BOMB_COOLDOWN_FRAMES=720,BOMB_BRAKE_FRAMES=120;
const BOSS_START_FRAME=4140,STAGE_TARGET_FRAME=5900,BOSS_HP=54,FINAL_BOMB_CUE_FRAMES=84,START_SHIELDS=4;
const CONTRACT_BONUS_BASE=120;

const STAGE_EVENTS=[
  {t:40,label:'galaga left lane',fn:()=>spawnLane('left',0)},
  {t:260,label:'switch right marker',fn:()=>spawnSwitchMarker('right')},
  {t:470,label:'galaga right lane',fn:()=>spawnLane('right',0)},
  {t:720,label:'1942 gap left',fn:()=>spawnGapSweep('left')},
  {t:990,label:'focus center pin',fn:()=>spawnCenterPin()},
  {t:1220,label:'left lane under fire',fn:()=>spawnLane('left',1)},
  {t:1540,label:'right lane under fire',fn:()=>spawnLane('right',1)},
  {t:1880,label:'midboss anchor',fn:()=>spawnAnchorCore()},
  {t:2140,label:'midboss right switch',fn:()=>spawnSwitchMarker('right')},
  {t:2400,label:'midboss left stream',fn:()=>spawnLane('left',2)},
  {t:2760,label:'restock left right',fn:()=>spawnRestockSweep()},
  {t:3180,label:'final relay switch',fn:()=>spawnFinalRelay()},
  {t:3560,label:'final gap right',fn:()=>spawnGapSweep('right')},
  {t:3900,label:'boss warning',fn:()=>spawnBossWarning()},
  {t:BOSS_START_FRAME,label:'boss',fn:()=>spawnBoss()},
];
const WAVE_INTENTS={
  'galaga left lane':'LANE_LEFT','switch right marker':'SWITCH_RIGHT','galaga right lane':'LANE_RIGHT',
  '1942 gap left':'GAP_LEFT','focus center pin':'FOCUS','left lane under fire':'LANE_LEFT','right lane under fire':'LANE_RIGHT',
  'midboss anchor':'MIDBOSS','midboss right switch':'SWITCH_RIGHT','midboss left stream':'LANE_LEFT',
  'restock left right':'RESTOCK','final relay switch':'SWITCH_RIGHT','final gap right':'GAP_RIGHT','boss warning':'RESTOCK','boss':'BOSS'
};
const EXPECTED_X={
  'galaga left lane':125,'switch right marker':294,'galaga right lane':294,'1942 gap left':112,'focus center pin':210,
  'left lane under fire':125,'right lane under fire':294,'midboss anchor':210,'midboss right switch':294,'midboss left stream':125,
  'restock left right':210,'final relay switch':294,'final gap right':310,'boss warning':210,'boss':210
};

const state={
  mode:'title',t:0,player:{x:W/2,y:H-80,r:5,iframe:0},bullets:[],ebullets:[],enemies:[],particles:[],rings:[],popups:[],
  gauge:0,score:0,hiscore:0,grazeCount:0,bombCount:0,shieldStock:START_SHIELDS,killCount:0,wave:0,eventIndex:0,
  phaseLabel:'title',phaseIntent:'TITLE',bombFlash:0,bombCooldownT:0,bombBrakeT:0,hitFlash:0,maxCueT:0,shotCooldown:0,
  rng:mulberry32(SEED),grazeStreak:0,activeDefT:0,activeDefCount:0,clearTime:null,stageFlags:{},phaseStats:null,
  contractScore:0,contractChain:0,contractBreaks:0,contractLog:[],lastGrade:'-'
};

function gaugeLevel(g){return g>=G_LV3?3:g>=G_LV2?2:1;}
function gaugeReady(){return state.gauge>=G_MAX;}
function bombReady(){return gaugeReady()&&state.bombCooldownT<=0;}
function addGauge(n){const before=state.gauge;state.gauge=Math.min(G_MAX,state.gauge+n);if(before<G_MAX&&state.gauge>=G_MAX)state.popups.push({x:state.player.x,y:state.player.y-34,text:'CORE CHARGED',life:54,c:'#ffd870'});}
function shotCount(){return gaugeLevel(state.gauge);}
function shotCooldownF(){return gaugeLevel(state.gauge)===3?6:gaugeLevel(state.gauge)===2?7:8;}
function waveIntent(label){return WAVE_INTENTS[label]||'READ';}
function newPhaseStats(){return{label:state.phaseLabel,intent:state.phaseIntent,startT:state.t,graze:0,kills:0,bombs:0,defs:0,hits:0,score0:state.score};}
function phaseContractTarget(intent){if(intent==='RESTOCK')return{graze:0,kills:1,bombsMax:0,defsMin:0,hitsMax:1};if(intent==='BOSS')return{graze:0,kills:1,bombsMax:1,defsMin:0,hitsMax:1};if(intent==='MIDBOSS')return{graze:1,kills:1,bombsMax:1,defsMin:0,hitsMax:2};return{graze:0,kills:1,bombsMax:0,defsMin:0,hitsMax:1};}
function finishPhaseContract(){const ps=state.phaseStats;if(!ps)return;const tg=phaseContractTarget(ps.intent);const ok=ps.graze>=tg.graze&&ps.kills>=tg.kills&&ps.bombs<=tg.bombsMax&&ps.defs>=tg.defsMin&&ps.hits<=tg.hitsMax;let bonus=0;if(ok){state.contractChain++;bonus=CONTRACT_BONUS_BASE+state.contractChain*35+Math.min(120,ps.graze*4);state.score+=bonus;state.contractScore+=bonus;}else{state.contractBreaks++;state.contractChain=0;}state.contractLog.push({label:ps.label,intent:ps.intent,ok,bonus,graze:ps.graze,kills:ps.kills,bombs:ps.bombs,defs:ps.defs,hits:ps.hits});}
function routeGrade(){if(state.contractBreaks===0&&state.contractScore>=1800)return'S';if(state.contractScore>=1200)return'A';if(state.contractScore>=700)return'B';if(state.contractScore>=300)return'C';return'D';}

function spawnPlayerBullets(){const n=shotCount(),px=state.player.x,py=state.player.y-8;state.bullets.push({x:px,y:py,vx:0,vy:-9});if(n>=2){state.bullets.push({x:px-6,y:py+2,vx:-0.7,vy:-9});state.bullets.push({x:px+6,y:py+2,vx:0.7,vy:-9});}if(n>=3){state.bullets.push({x:px-10,y:py+4,vx:-1.45,vy:-8.8});state.bullets.push({x:px+10,y:py+4,vx:1.45,vy:-8.8});}}
function spawnEnemy(type,x,opt){const e={type,x,y:(opt&&opt.y)||-20,t:0,r:9,hp:1,maxHp:1,fireT:9999,pattern:opt&&opt.pattern,side:opt&&opt.side,slot:opt&&opt.slot||0,laneX:opt&&opt.laneX||x,phase:opt&&opt.phase||0};if(type==='drone')Object.assign(e,{r:8,hp:1,maxHp:1,reward:(opt&&opt.reward)||3});if(type==='marker')Object.assign(e,{r:14,hp:6,maxHp:6,fireT:72,reward:(opt&&opt.reward)||14});if(type==='pin')Object.assign(e,{r:17,hp:8,maxHp:8,fireT:64,reward:(opt&&opt.reward)||10});if(type==='anchorCore')Object.assign(e,{r:34,hp:42,maxHp:42,fireT:76,reward:30});if(type==='bossPart')Object.assign(e,{r:14,hp:12,maxHp:12,fireT:120,offsetX:opt.offsetX,offsetY:opt.offsetY});state.enemies.push(e);return e;}
function markStageFlag(k){state.stageFlags[k]=true;}
function setTimeoutLike(fn,delay){state.stageFlags._deferred=state.stageFlags._deferred||[];state.stageFlags._deferred.push({t:state.t+delay,fn});}

function spawnLane(side,pressure){markStageFlag(side==='left'?'laneLeft':'laneRight');const laneX=side==='left'?125:295;const startX=side==='left'?-24:W+24;for(let i=0;i<9;i++)spawnEnemy('drone',startX,{pattern:'entryLane',side,laneX,slot:i,y:54-i*20});if(pressure)setTimeoutLike(()=>spawnSwitchMarker(side==='left'?'right':'left'),96);}
function spawnSwitchMarker(side){markStageFlag(side==='left'?'switchLeft':'switchRight');const x=side==='left'?112:308;spawnEnemy('marker',x,{pattern:'switchMarker',side,y:-28});}
function spawnGapSweep(gap){markStageFlag(gap==='left'?'gapLeft':'gapRight');const gapX=gap==='left'?112:310;for(let i=0;i<7;i++){const x=42+i*60;if(Math.abs(x-gapX)<55)continue;spawnEnemy('pin',x,{pattern:'gapPin',slot:i,y:-22-i*6});}}
function spawnCenterPin(){markStageFlag('centerPin');spawnEnemy('pin',W/2,{pattern:'centerPin',y:-28});}
function spawnAnchorCore(){markStageFlag('anchorCore');spawnEnemy('anchorCore',W/2,{pattern:'anchorCore',y:-54});}
function spawnRestockSweep(){markStageFlag('restockSweep');for(let i=0;i<6;i++)spawnEnemy('drone',-22,{pattern:'entryLane',side:'left',laneX:125,slot:i,y:60-i*18});setTimeoutLike(()=>{for(let i=0;i<6;i++)spawnEnemy('drone',W+22,{pattern:'entryLane',side:'right',laneX:295,slot:i,y:60-i*18});},92);}
function spawnFinalRelay(){markStageFlag('finalRelay');spawnLane('left',1);setTimeoutLike(()=>spawnSwitchMarker('right'),78);}
function spawnBossWarning(){state.ebullets.length=0;markStageFlag('bossWarning');for(let i=0;i<7;i++)spawnEnemy('drone',W/2,{pattern:'warningDrop',laneX:W*(0.18+0.64*(i/6)),slot:i,y:-20-i*10,reward:80});state.popups.push({x:W/2,y:90,text:'RESTOCK BEFORE BOSS',life:80,c:'#ffd870'});}
function spawnBoss(){if(state.enemies.some(e=>e.type==='boss'))return;markStageFlag('boss');state.ebullets.length=0;state.enemies.push({type:'boss',x:W/2,y:-64,t:0,r:44,hp:BOSS_HP,maxHp:BOSS_HP,fireT:110,bossPhase:'aimed',finalChargeT:0,finalCueFired:false});spawnEnemy('bossPart',W/2-58,{offsetX:-58,offsetY:18});spawnEnemy('bossPart',W/2+58,{offsetX:58,offsetY:18});}

function updateIntentEnemy(e){const t=e.t;if(e.pattern==='entryLane'){const enter=Math.min(1,t/128),sx=e.side==='left'?-26:W+26;const curve=Math.sin(enter*Math.PI)*72;e.x=sx+(e.laneX-sx)*enter+(e.side==='left'?curve:-curve);e.y=70+e.slot*22+t*0.72;if(t>170){e.y+=t-170;e.x+=e.side==='left'?0.55:-0.55;}return true;}if(e.pattern==='switchMarker'){if(t<105){e.y=-28+t*1.15;}else if(t<245){e.y=92+Math.sin((t-105)*0.03)*14;}else{e.y=92+(t-245)*1.25;e.x+=e.side==='left'?-0.6:0.6;}return true;}if(e.pattern==='gapPin'){e.y+=t<125?0.9:1.35;return true;}if(e.pattern==='centerPin'){if(t<100)e.y=-28+t*1.05;else e.y=78+Math.sin(t*0.028)*10;return true;}if(e.pattern==='anchorCore'){if(e.y<92)e.y+=0.55;else e.x=W/2+Math.sin(t*0.018)*48;return true;}if(e.pattern==='warningDrop'){e.x=e.laneX+Math.sin(t*0.03+e.slot)*12;e.y=-20+e.slot*20+t*1.15;return true;}return false;}
function fireEnemy(e){if(e.type==='marker'){aimedBullet(e,2.15);aimedBullet(e,2.05,-0.18);aimedBullet(e,2.05,0.18);e.fireT=112;}else if(e.type==='pin'){aimedBullet(e,2.05);e.fireT=92;}else if(e.type==='anchorCore'){wideSpread(e,5,1.75,Math.PI/2);aimedBullet(e,2.25);e.fireT=82;}else if(e.type==='bossPart'){aimedBullet(e,2.25);e.fireT=96;}else if(e.type==='boss'){const hp=e.hp/e.maxHp;if(hp>0.55){aimedBullet(e,2.05);e.fireT=112;}else if(hp>0.25){radialBurst(e,10,1.75,e.t*0.026);e.fireT=84;}else{if(!e.finalCueFired){e.finalCueFired=true;e.finalChargeT=FINAL_BOMB_CUE_FRAMES;state.popups.push({x:e.x,y:e.y+58,text:'CORE OPEN',life:72,c:'#ffd870'});radialBurst(e,16,1.45,e.t*0.03);e.fireT=FINAL_BOMB_CUE_FRAMES;return;}wideSpread(e,5,2.1,Math.PI/2);e.fireT=96;}}}
function wideSpread(e,n,sp,base){const spread=Math.PI*0.42;for(let i=0;i<n;i++){const a=base-spread/2+spread*(i/(n-1||1));state.ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,grazed:false,grazedT:90});}}
function aimedBullet(e,sp,off){const a=Math.atan2(state.player.y-e.y,state.player.x-e.x)+(off||0);state.ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,grazed:false,grazedT:90});}
function radialBurst(e,n,sp,rot){for(let i=0;i<n;i++){const a=rot+Math.PI*2*i/n;state.ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,grazed:false,grazedT:90});}}

function startGame(){
  Object.assign(state,{mode:'play',t:0,bullets:[],ebullets:[],enemies:[],particles:[],rings:[],popups:[],gauge:0,score:0,grazeCount:0,bombCount:0,shieldStock:START_SHIELDS,killCount:0,wave:0,eventIndex:0,phaseLabel:'opening',phaseIntent:'REST',bombFlash:0,bombCooldownT:0,bombBrakeT:0,hitFlash:0,maxCueT:0,shotCooldown:0,grazeStreak:0,activeDefT:0,activeDefCount:0,clearTime:null,stageFlags:{},phaseStats:null,contractScore:0,contractChain:0,contractBreaks:0,contractLog:[],lastGrade:'-'});
  state.player={x:W/2,y:H-80,r:5,iframe:60};
}
function fireBomb(){
  if(!bombReady())return;
  state.bombCount++;if(state.phaseStats)state.phaseStats.bombs++;
  state.gauge=G_LV3;state.bombCooldownT=BOMB_COOLDOWN_FRAMES;state.bombBrakeT=BOMB_BRAKE_FRAMES;state.bombFlash=18;
  state.ebullets.length=0;
  for(const e of state.enemies){if(e.type==='boss')e.hp=Math.max(1,e.hp-12);else if(e.type==='anchorCore')e.hp=Math.max(1,e.hp-6);else if(e.type==='bossPart')e.hp=Math.max(1,e.hp-4);else e.hp=0;}
  state.popups.push({x:state.player.x,y:state.player.y-30,text:'BOMB',life:42,c:'#ffd870'});
}
function triggerActiveDef(){
  if(state.grazeStreak<GRAZE_STREAK_TH||state.activeDefT>0)return;
  let cleared=0;state.ebullets=state.ebullets.filter(b=>{const dx=b.x-state.player.x,dy=b.y-state.player.y;if(dx*dx+dy*dy<ACTIVE_DEF_RADIUS*ACTIVE_DEF_RADIUS){cleared++;return false;}return true;});
  if(cleared>0){state.activeDefT=ACTIVE_DEF_FRAMES;state.activeDefCount++;if(state.phaseStats)state.phaseStats.defs++;addGauge(Math.min(14,cleared*2));state.popups.push({x:state.player.x,y:state.player.y-28,text:`DEF x${cleared}`,life:34,c:'#80ffd0'});}
  state.grazeStreak=0;
}
function processEvents(){
  const deferred=state.stageFlags._deferred||[];
  for(const item of deferred.filter(d=>state.t>=d.t))item.fn();
  state.stageFlags._deferred=deferred.filter(d=>state.t<d.t);
  while(state.eventIndex<STAGE_EVENTS.length&&state.t>=STAGE_EVENTS[state.eventIndex].t){
    finishPhaseContract();
    const ev=STAGE_EVENTS[state.eventIndex++];
    state.wave++;state.phaseLabel=ev.label;state.phaseIntent=waveIntent(ev.label);state.phaseStats=newPhaseStats();
    state.popups.push({x:W/2,y:48,text:`${state.phaseIntent} / ${ev.label}`,life:44,c:'#ffd870'});
    ev.fn();
  }
}
function updateBot(){
  if(!BOT_ENABLED||state.mode!=='play')return;
  const p=state.player;
  let tx=EXPECTED_X[state.phaseLabel]||W/2,ty=H-72;
  const boss=state.enemies.find(e=>e.type==='boss'||e.type==='anchorCore');
  if(boss&&state.ebullets.length>6){let best={x:tx,risk:1e9};for(let x=34;x<=386;x+=18){let risk=0;for(const b of state.ebullets){const dx=x-(b.x+b.vx*12),dy=ty-(b.y+b.vy*12);risk+=20000/Math.max(180,dx*dx+dy*dy);}if(risk<best.risk)best={x,risk};}tx=best.x;}
  const target=state.enemies.filter(e=>e.y<p.y-45).sort((a,b)=>rankEnemy(a)-rankEnemy(b)||Math.abs(a.x-p.x)-Math.abs(b.x-p.x))[0];
  if(target)tx=target.x;
  for(const b of state.ebullets){const dx=p.x-b.x,dy=p.y-b.y,d2=dx*dx+dy*dy;if(d2<150*150){const w=(150*150-d2)/(150*150);tx+=dx*w*4;ty+=dy*w*2.8;}}
  tx=Math.max(24,Math.min(W-24,tx));ty=Math.max(360,Math.min(H-18,ty));
  keys.arrowleft=tx<p.x-7;keys.arrowright=tx>p.x+7;keys.arrowup=ty<p.y-7;keys.arrowdown=ty>p.y+7;
  const finalBoss=state.enemies.find(e=>e.type==='boss');
  if(finalBoss&&finalBoss.finalCueFired&&bombReady())fireBomb();else if(state.grazeStreak>=GRAZE_STREAK_TH)triggerActiveDef();
}
function rankEnemy(e){return({boss:0,anchorCore:1,bossPart:2,marker:3,pin:4,drone:5}[e.type]??9);}
function update(){
  if(state.mode!=='play')return;
  updateBot();
  state.t++;processEvents();
  const left=keys.arrowleft||keys.a,right=keys.arrowright||keys.d,up=keys.arrowup||keys.w,down=keys.arrowdown||keys.s;
  let dx=0,dy=0;if(left)dx--;if(right)dx++;if(up)dy--;if(down)dy++;if(dx&&dy){dx*=0.707;dy*=0.707;}
  state.player.x=Math.max(8,Math.min(W-8,state.player.x+dx*4.2));state.player.y=Math.max(20,Math.min(H-12,state.player.y+dy*4.2));
  if(state.player.iframe>0)state.player.iframe--;if(state.bombCooldownT>0)state.bombCooldownT--;if(state.bombBrakeT>0)state.bombBrakeT--;if(state.activeDefT>0)state.activeDefT--;
  if(state.shotCooldown>0)state.shotCooldown--;else{spawnPlayerBullets();state.shotCooldown=shotCooldownF();}
  for(const b of state.bullets){b.x+=b.vx;b.y+=b.vy;}state.bullets=state.bullets.filter(b=>b.y>-20&&b.x>-20&&b.x<W+20);
  for(const e of state.enemies){e.t++;if(!updateIntentEnemy(e)){if(e.type==='boss'){if(e.y<72)e.y+=0.66;else e.x=W/2+Math.sin(e.t*0.018)*66;if(e.finalChargeT>0)e.finalChargeT--;}else if(e.type==='bossPart'){const boss=state.enemies.find(x=>x.type==='boss');if(boss){e.x=boss.x+(e.offsetX||0);e.y=boss.y+(e.offsetY||0);}else e.y+=1.2;}}e.fireT--;if(e.fireT<=0&&e.y>0&&e.y<H*0.72)fireEnemy(e);}
  for(const b of state.bullets){for(const e of state.enemies){if(e.hp<=0)continue;const x=b.x-e.x,y=b.y-e.y;if(x*x+y*y<(e.r+3)*(e.r+3)){e.hp--;b.y=-99;if(e.hp<=0)killEnemy(e);break;}}}state.bullets=state.bullets.filter(b=>b.y>-20);
  state.enemies=state.enemies.filter(e=>e.hp>0&&e.y<H+70);
  for(const b of state.ebullets){const brake=state.bombBrakeT>0?0.45:1;b.x+=b.vx*brake;b.y+=b.vy*brake;const x=b.x-state.player.x,y=b.y-state.player.y,d2=x*x+y*y;if(d2<R_HIT*R_HIT){if(state.player.iframe<=0){onHit();b.y=H+99;}}else if(!b.grazed&&d2<R_GRAZE*R_GRAZE){b.grazed=true;onGraze(b.x,b.y);}}
  state.ebullets=state.ebullets.filter(b=>b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
  for(const p of state.particles){p.x+=p.vx;p.y+=p.vy;p.life--;}state.particles=state.particles.filter(p=>p.life>0);
  for(const p of state.popups){p.y-=0.45;p.life--;}state.popups=state.popups.filter(p=>p.life>0);
  if(state.bombFlash>0)state.bombFlash--;if(state.hitFlash>0)state.hitFlash--;
  if(state.eventIndex>=STAGE_EVENTS.length&&!state.enemies.some(e=>e.type==='boss')&&state.t>BOSS_START_FRAME+80){state.mode='clear';state.clearTime=state.t;finishPhaseContract();state.lastGrade=routeGrade();state.hiscore=Math.max(state.hiscore,state.score);}
}
function killEnemy(e){state.killCount++;if(state.phaseStats)state.phaseStats.kills++;if(e.type==='drone'){state.score+=16;addGauge(e.reward||3);}else if(e.type==='marker'){state.score+=80;addGauge(e.reward||14);}else if(e.type==='pin'){state.score+=55;addGauge(e.reward||10);}else if(e.type==='anchorCore'){state.score+=440;addGauge(28);}else if(e.type==='boss'){state.score+=900;addGauge(20);}else state.score+=80;for(let i=0;i<10;i++){const a=state.rng()*Math.PI*2,sp=0.5+state.rng()*2;state.particles.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:16+state.rng()*18,c:e.type==='marker'?'#ffa030':'#8a94a8'});}}
function onGraze(x,y){state.grazeCount++;state.grazeStreak++;if(state.phaseStats)state.phaseStats.graze++;addGauge(6);state.score+=10;state.particles.push({x,y,vx:0,vy:-0.5,life:12,c:'#80ffd0'});}
function onHit(){if(state.shieldStock>0){state.shieldStock--;state.player.iframe=90;state.hitFlash=16;if(state.phaseStats)state.phaseStats.hits++;state.gauge=Math.max(0,state.gauge-G_LV2);return;}state.mode='over';state.player.iframe=999;}

function draw(){
  ctx.fillStyle='#07091a';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#182044';for(let i=0;i<70;i++){const x=(i*83+state.t*0.4)%W,y=(i*47+state.t*(0.8+i%3*0.5))%H;ctx.fillRect(x,y,1+i%2,1+i%2);}
  for(const e of state.enemies)drawEnemy(e);ctx.fillStyle='#7fe0ff';for(const b of state.bullets){ctx.fillRect(b.x-2,b.y-7,4,10);}
  ctx.fillStyle='#ff8068';for(const b of state.ebullets){ctx.beginPath();ctx.arc(b.x,b.y,3.4,0,Math.PI*2);ctx.fill();}
  for(const p of state.particles){ctx.globalAlpha=Math.max(0,p.life/24);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,2,2);ctx.globalAlpha=1;}
  if(state.mode!=='over'){ctx.fillStyle=state.player.iframe%6<3?'#80ffd0':'#d8fff0';ctx.beginPath();ctx.moveTo(state.player.x,state.player.y-8);ctx.lineTo(state.player.x-7,state.player.y+8);ctx.lineTo(state.player.x+7,state.player.y+8);ctx.closePath();ctx.fill();}
  if(state.bombFlash>0){ctx.fillStyle=`rgba(255,216,112,${state.bombFlash/18*0.28})`;ctx.fillRect(0,0,W,H);}
  if(state.hitFlash>0){ctx.fillStyle=`rgba(255,80,80,${state.hitFlash/16*0.25})`;ctx.fillRect(0,0,W,H);}
  ctx.fillStyle='#cfd4e4';ctx.font='11px system-ui';ctx.textAlign='left';ctx.fillText(`SCORE ${state.score}`,10,16);ctx.fillText(`G ${state.gauge}/${G_MAX}  SHIELD ${state.shieldStock}/${START_SHIELDS}  BOMB ${state.bombCount}`,10,31);ctx.fillText(`WAVE ${state.wave}/${STAGE_EVENTS.length} ${state.phaseIntent}`,10,46);ctx.fillText(`ROUTE ${state.contractScore}  CHAIN ${state.contractChain}  BREAK ${state.contractBreaks}`,10,61);
  for(const p of state.popups){ctx.globalAlpha=Math.max(0,p.life/44);ctx.fillStyle=p.c;ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);ctx.globalAlpha=1;}
  if(state.mode==='title'){ctx.textAlign='center';ctx.fillStyle='#e8ecff';ctx.font='bold 20px system-ui';ctx.fillText('GRAZE',W/2,H/2-56);ctx.font='11px system-ui';ctx.fillText('v05.2_cdx_v25 - rebuilt enemy grammar',W/2,H/2-28);ctx.fillText('SPACE TO START',W/2,H/2+18);}
  if(state.mode==='clear'||state.mode==='over'){ctx.textAlign='center';ctx.fillStyle=state.mode==='clear'?'#80ffd0':'#ff8a8a';ctx.font='bold 22px system-ui';ctx.fillText(state.mode==='clear'?'STAGE CLEAR':'GAME OVER',W/2,H/2-20);ctx.font='12px system-ui';ctx.fillText(`GRADE ${state.lastGrade||'-'}  SCORE ${state.score}`,W/2,H/2+8);}
}
function drawEnemy(e){if(e.type==='drone'){ctx.fillStyle='#ff5050';ctx.beginPath();ctx.moveTo(e.x,e.y-e.r);ctx.lineTo(e.x-e.r,e.y+e.r);ctx.lineTo(e.x+e.r,e.y+e.r);ctx.closePath();ctx.fill();}else if(e.type==='marker'){ctx.fillStyle='#ffa030';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff080';ctx.fillRect(e.x-5,e.y-3,10,6);}else if(e.type==='pin'){ctx.fillStyle='#c070ff';ctx.fillRect(e.x-e.r,e.y-e.r,e.r*2,e.r*2);ctx.fillStyle='#ffd870';ctx.fillRect(e.x-4,e.y-4,8,8);}else if(e.type==='anchorCore'){ctx.fillStyle='#8060ff';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#202438';ctx.fillRect(e.x-20,e.y-4,40,8);}else if(e.type==='boss'){ctx.fillStyle='#5060c0';ctx.fillRect(e.x-42,e.y-28,84,56);ctx.fillStyle='#ffd870';ctx.fillRect(e.x-18,e.y+2,36,10);}else if(e.type==='bossPart'){ctx.fillStyle='#ff9a60';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();}}
function loop(){if(state.mode==='play')update();draw();requestAnimationFrame(loop);}
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='ArrowLeft')keys.arrowleft=true;if(e.key==='ArrowRight')keys.arrowright=true;if(e.key==='ArrowUp')keys.arrowup=true;if(e.key==='ArrowDown')keys.arrowdown=true;if(e.code==='Space'){if(state.mode==='title'||state.mode==='over'||state.mode==='clear')startGame();else fireBomb();}if(e.key.toLowerCase()==='d')triggerActiveDef();});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key==='ArrowLeft')keys.arrowleft=false;if(e.key==='ArrowRight')keys.arrowright=false;if(e.key==='ArrowUp')keys.arrowup=false;if(e.key==='ArrowDown')keys.arrowdown=false;});
if(BOT_ENABLED)startGame();
loop();
</script>
</body>
</html>
