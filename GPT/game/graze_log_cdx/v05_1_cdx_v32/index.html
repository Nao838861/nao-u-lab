function mulberry32(s){return function(){s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}

function bez(p0,p1,p2,p3,t){const u=1-t;return{x:u*u*u*p0.x+3*u*u*t*p1.x+3*u*t*t*p2.x+t*t*t*p3.x,y:u*u*u*p0.y+3*u*u*t*p1.y+3*u*t*t*p2.y+t*t*t*p3.y}}

function startGame(){

  state.player={x:W/2,y:H-80,r:5,iframe:80};
}
function mark(k){state.stageFlags[k]=true}
function addGauge(n){const before=state.gauge;state.gauge=clamp(state.gauge+n,0,G_MAX);if(before<G_MAX&&state.gauge>=G_MAX)state.popups.push({x:state.player.x,y:state.player.y-32,text:'CORE CHARGED',life:44,c:'#ffd870'});}
function gaugeLevel(){return state.gauge>=G_LV3?3:state.gauge>=G_LV2?2:1}
function bombReady(){return state.gauge>=G_MAX&&state.bombCooldownT<=0}
function fireBomb(){if(!bombReady()||state.mode!=='play')return;state.bombCount++;state.gauge=G_LV3;state.bombCooldownT=BOMB_COOLDOWN_FRAMES;state.bombBrakeT=BOMB_BRAKE_FRAMES;state.bombFlash=18;for(const e of state.enemies){e.hp-=e.type==='boss'?20:e.type==='bossPart'?10:e.type==='midboss'?12:99;e.bombed=true;}state.ebullets=[];}
function triggerActiveDef(){if(state.mode!=='play'||state.grazeStreak<8)return;state.activeDefCount++;state.activeDefT=ACTIVE_DEF_FRAMES;state.player.iframe=Math.max(state.player.iframe,ACTIVE_DEF_FRAMES);state.grazeStreak=0;let n=0;state.ebullets=state.ebullets.filter(b=>{const dx=b.x-state.player.x,dy=b.y-state.player.y;if(dx*dx+dy*dy<ACTIVE_DEF_RADIUS*ACTIVE_DEF_RADIUS){n++;return false}return true});addGauge(n*2);}

function traceLine(name,duration,pts){return{name,duration,pts}}
function traceBezier(name,duration,p0,p1,p2,p3){return{name,duration,p0,p1,p2,p3}}
function evalTrace(tr,t){const k=clamp(t/tr.duration,0,1);if(tr.pts){const n=tr.pts.length-1,seg=Math.min(n-1,Math.floor(k*n)),lk=k*n-seg,a=tr.pts[seg],b=tr.pts[seg+1];return{x:lerp(a.x,b.x,smooth(lk)),y:lerp(a.y,b.y,smooth(lk))}}return bez(tr.p0,tr.p1,tr.p2,tr.p3,smooth(k))}
function spawnEnemy(type,opt){
  const e=Object.assign({type,x:W/2,y:-20,r:8,hp:1,maxHp:1,t:0,delay:0,fireT:9999,group:null,trace:null,slot:0,reward:3,role:null,offsetX:0,offsetY:0,open:false},opt||{});
  if(type==='heli')Object.assign(e,{r:7,hp:1,maxHp:1,reward:3,fireT:9999});
  if(type==='tank')Object.assign(e,{r:13,hp:6,maxHp:6,reward:10,fireT:70});
  if(type==='bunker')Object.assign(e,{r:18,hp:14,maxHp:14,reward:18,fireT:96});
  if(type==='smallTank')Object.assign(e,{r:8,hp:1,maxHp:1,reward:4,fireT:9999});
  if(type==='crane')Object.assign(e,{r:16,hp:8,maxHp:8,reward:22,fireT:9999});
  if(type==='stock')Object.assign(e,{r:11,hp:2,maxHp:2,reward:24,fireT:9999});
  if(type==='midboss')Object.assign(e,{r:34,hp:48,maxHp:48,reward:36,fireT:54});
  if(type==='boss')Object.assign(e,{r:44,hp:BOSS_HP,maxHp:BOSS_HP,reward:30,fireT:44});
  if(type==='bossPart')Object.assign(e,{r:16,hp:e.role==='back'?18:14,maxHp:e.role==='back'?18:14,reward:10,fireT:e.role==='back'?74:46});
  state.enemies.push(e);return e;
}
function spawnPopcornArc(name,x0,y0,n,dir){
  mark('dpPopcornArc');const group=name+'_'+state.t;
  for(let i=0;i<n;i++){
    const p0={x:x0,y:y0+i*14},p1={x:W*(dir>0?0.18:0.82),y:88+i*18},p2={x:W*(dir>0?0.38:0.62),y:170+i*8},p3={x:W*(dir>0?0.50:0.50),y:H+36};
    spawnEnemy('heli',{trace:traceBezier('dp_popcorn_arc',270,p0,p1,p2,p3),group,slot:i,x:p0.x,y:p0.y,delay:i*8});
  }
}
function spawnConnectorRow(name,start,end,n){
  mark('dpConnectorRow');const group=name+'_'+state.t;
  for(let i=0;i<n;i++){
    const k=i/(n-1||1),x=W*lerp(start,end,k);
    const tr=traceLine('dp_connector_row',250,[{x,y:-18-i*9},{x:x+(k-.5)*24,y:120+i*5},{x:x+(k-.5)*36,y:H+36}]);
    spawnEnemy('heli',{trace:tr,group,slot:i,x:tr.pts[0].x,y:tr.pts[0].y,delay:i*5});
  }
}
function spawnTankPair(name,a,b){
  mark('dpTankPair');const group=name+'_'+state.t;
  for(const [i,xn] of [a,b].entries()){
    const x=W*xn,tr=traceLine('dp_tank_pair',520,[{x,y:-30},{x,y:104},{x,y:178},{x,y:H+48}]);
    spawnEnemy('tank',{trace:tr,group,slot:i,x,y:-30,fireT:64+i*14});
  }
}
function spawnBunker(name,xn,y){
  mark('dpBunkerRelease');
  const x=W*xn,tr=traceLine('dp_bunker_stop',9999,[{x,y:-32},{x,y},{x,y}]);
  spawnEnemy('bunker',{trace:tr,x,y:-32,group:name+'_'+state.t,release:false});
}
function spawnBraidHelis(name){
  mark('dpBraidHelis');
  spawnPopcornArc(name+'_l',-24,80,5,1);
  spawnPopcornArc(name+'_r',W+24,98,5,-1);
}
function spawnCrane(name,xn){
  mark('dpCraneReward');
  const x=W*xn,tr=traceLine('dp_crane_reward',9999,[{x,y:-24},{x,y:130},{x,y:230},{x,y:H+48}]);
  spawnEnemy('crane',{trace:tr,x,y:-24,group:name+'_'+state.t});
}
function spawnMidboss(){
  mark('dpHighTurretMidboss');
  const tr=traceLine('dp_stage1_high_turret',9999,[{x:W/2,y:-46},{x:W/2,y:78},{x:W/2,y:126},{x:W/2,y:126}]);
  spawnEnemy('midboss',{trace:tr,x:W/2,y:-46});
}
function spawnStockCarriers(){
  mark('dpBossStockCarriers');
  spawnConnectorRow('boss_stock_connectors',0.24,0.76,7);
  for(const x of [W*.30,W*.70])spawnEnemy('stock',{trace:traceLine('dp_stock_carrier',330,[{x,y:-24},{x,y:120},{x,y:H+40}]),x,y:-24});
}
function spawnBoss(){
  mark('dpPartBoss');
  const tr=traceLine('dp_part_boss_core',9999,[{x:W/2,y:-58},{x:W/2,y:72},{x:W/2,y:96},{x:W/2,y:96}]);
  spawnEnemy('boss',{trace:tr,x:W/2,y:-58});
  for(const p of [{role:'back',ox:0,oy:-24},{role:'left',ox:-48,oy:18},{role:'right',ox:48,oy:18}]){
    spawnEnemy('bossPart',{role:p.role,offsetX:p.ox,offsetY:p.oy,x:W/2+p.ox,y:-58+p.oy});
  }
}
function aimed(e,sp=1.6,spread=0){const dx=state.player.x-e.x,dy=state.player.y-e.y,d=Math.hypot(dx,dy)||1,a=Math.atan2(dy,dx)+spread;state.ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,grazed:false});}
function wide(e,n,sp,base=Math.PI/2,deg=12){for(let i=0;i<n;i++){const a=base+(i-(n-1)/2)*deg*Math.PI/180;state.ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,grazed:false});}}
function fireEnemy(e){
  if(e.y<20||e.y>H-70)return;
  if(e.type==='tank'){aimed(e,1.55);}
  else if(e.type==='bunker'){wide(e,3,1.45,Math.PI/2,18);}
  else if(e.type==='midboss'){aimed(e,1.85);wide(e,5,1.55,Math.PI/2,13);}
  else if(e.type==='bossPart'&&e.role==='back')wide(e,7,1.7,Math.PI/2,12);
  else if(e.type==='bossPart')for(let i=0;i<4;i++)aimed(e,1.9,(i-1.5)*0.08);
  else if(e.type==='boss'){wide(e,5,1.7,Math.PI/2,16);}
}
function updateEnemy(e){
  e.t++;if(e.delay&&e.t<e.delay)return;const lt=e.t-(e.delay||0);
  if(e.type==='bossPart'){const b=state.enemies.find(x=>x.type==='boss');if(b){e.x=b.x+e.offsetX;e.y=b.y+e.offsetY;}}
  else if(e.trace){const p=evalTrace(e.trace,lt);e.x=p.x;e.y=p.y;}
  if(e.type==='bunker'&&!e.release&&lt>130){e.release=true;e.open=true;for(let i=0;i<4;i++){const dir=i<2?-1:1;spawnEnemy('smallTank',{trace:traceLine('dp_bunker_small_tank',260,[{x:e.x+(i-1.5)*12,y:e.y+8},{x:e.x+dir*(44+i*8),y:e.y+58+i*8},{x:e.x+dir*(92+i*10),y:H+30}]),x:e.x,y:e.y+8,group:e.group+'_release',delay:i*7});}}
  if(e.fireT!==9999&&lt>0&&lt%e.fireT===0)fireEnemy(e);
}
function spawnPlayerBullets(){
  const n=gaugeLevel(),px=state.player.x,py=state.player.y-8;
  state.bullets.push({x:px,y:py,vx:0,vy:-9});
  if(n>=2){state.bullets.push({x:px-6,y:py+2,vx:-0.25,vy:-9});state.bullets.push({x:px+6,y:py+2,vx:0.25,vy:-9});}
  if(n>=3){state.bullets.push({x:px-9,y:py+4,vx:-1.15,vy:-8.7});state.bullets.push({x:px+9,y:py+4,vx:1.15,vy:-8.7});}
}
function updateBossCue(){
  const boss=state.enemies.find(e=>e.type==='boss');
  if(!boss)return;
  const parts=state.enemies.some(e=>e.type==='bossPart');
  if(!parts&&boss.hp/boss.maxHp<0.42&&!state.stageFlags.bossFinalCue){mark('bossFinalCue');state.gauge=G_MAX;state.popups.push({x:W/2,y:118,text:'CORE OPEN - BOMB',life:FINAL_BOMB_CUE_FRAMES,c:'#ffd870'});}
}
function updateBot(){
  const ev=ROUTE_EVENTS[Math.min(state.eventIndex,ROUTE_EVENTS.length-1)];
  let tx=ev?W*ev.lane:W/2,ty=H-75;
  const target=state.enemies.filter(e=>e.y>0&&e.y<state.player.y-36).sort((a,b)=>{
    const rank={bossPart:0,boss:1,midboss:2,bunker:3,tank:4,crane:5,stock:6,smallTank:7,heli:8};
    return (rank[a.type]??9)-(rank[b.type]??9)||Math.abs(a.x-state.player.x)-Math.abs(b.x-state.player.x);
  })[0];
  if(target)tx=lerp(tx,target.x,0.65);
  for(const b of state.ebullets){const dx=state.player.x-b.x,dy=state.player.y-b.y,d2=dx*dx+dy*dy;if(d2<118*118){const w=(118*118-d2)/(118*118);tx+=dx*w*3.4;ty+=dy*w*2;}}
  tx=clamp(tx,28,W-28);ty=clamp(ty,H-145,H-28);
  keys.arrowleft=tx<state.player.x-7;keys.arrowright=tx>state.player.x+7;keys.arrowup=ty<state.player.y-7;keys.arrowdown=ty>state.player.y+7;
  if(state.grazeStreak>=8)triggerActiveDef();
  const boss=state.enemies.find(e=>e.type==='boss');if(boss&&bombReady()&&(state.stageFlags.bossFinalCue||(!state.enemies.some(e=>e.type==='bossPart')&&boss.hp/boss.maxHp<0.35)))fireBomb();
}
function update(){
  if(BOT_ENABLED)updateBot();
  while(state.eventIndex<ROUTE_EVENTS.length&&state.t>=ROUTE_EVENTS[state.eventIndex].t){const ev=ROUTE_EVENTS[state.eventIndex++];state.phaseLabel=ev.label;state.phaseIntent=ev.intent;state.wave=state.eventIndex;state.routeLog.push({t:state.t,label:ev.label,intent:ev.intent,lane:ev.lane});ev.fn();}
  state.t++;if(state.player.iframe>0)state.player.iframe--;if(state.bombCooldownT>0)state.bombCooldownT--;if(state.bombBrakeT>0)state.bombBrakeT--;if(state.bombFlash>0)state.bombFlash--;if(state.hitFlash>0)state.hitFlash--;if(state.activeDefT>0)state.activeDefT--;
  let sp=4.1;if(keys.arrowleft||keys.a)state.player.x-=sp;if(keys.arrowright||keys.d)state.player.x+=sp;if(keys.arrowup||keys.w)state.player.y-=sp;if(keys.arrowdown||keys.s)state.player.y+=sp;state.player.x=clamp(state.player.x,18,W-18);state.player.y=clamp(state.player.y,70,H-22);
  if(--state.shotCooldown<=0){spawnPlayerBullets();state.shotCooldown=gaugeLevel()===3?6:gaugeLevel()===2?7:8}
  for(const e of state.enemies)updateEnemy(e);
  for(const b of state.bullets){b.x+=b.vx;b.y+=b.vy}
  for(const b of state.ebullets){b.x+=b.vx;b.y+=b.vy}
  for(const b of state.bullets){for(const e of state.enemies){if(e.hp<=0)continue;if(e.type==='boss'&&state.enemies.some(x=>x.type==='bossPart'&&x.hp>0))continue;const dx=b.x-e.x,dy=b.y-e.y;if(dx*dx+dy*dy<(e.r+4)*(e.r+4)){e.hp--;b.y=-99;if(e.type==='boss')updateBossCue();if(e.hp<=0)killEnemy(e);break}}}
  state.bullets=state.bullets.filter(b=>b.y>-20&&b.x>-20&&b.x<W+20);
  for(const b of state.ebullets){const dx=b.x-state.player.x,dy=b.y-state.player.y,d2=dx*dx+dy*dy;if(!b.grazed&&d2<R_GRAZE*R_GRAZE&&d2>R_HIT*R_HIT){b.grazed=true;state.grazeCount++;state.grazeStreak++;addGauge(6);state.score+=10;}if(state.player.iframe<=0&&d2<R_HIT*R_HIT)onHit();}
  state.ebullets=state.ebullets.filter(b=>b.y<H+25&&b.x>-25&&b.x<W+25);
  state.enemies=state.enemies.filter(e=>e.hp>0&&e.y<H+90&&e.x>-100&&e.x<W+100);
  for(const p of state.particles){p.x+=p.vx;p.y+=p.vy;p.life--}state.particles=state.particles.filter(p=>p.life>0);
  for(const p of state.popups){p.y-=0.45;p.life--}state.popups=state.popups.filter(p=>p.life>0);
  updateBossCue();
  if(state.eventIndex>=ROUTE_EVENTS.length&&!state.enemies.some(e=>e.type==='boss'||e.type==='bossPart')&&state.t>BOSS_START_FRAME+160){state.mode='clear';state.clearTime=state.t;state.lastGrade=state.bombCount>0?'S':'A';}
}
function killEnemy(e){
  state.killCount++;if(state.t-state.lastKillT<=CHAIN_WINDOW)state.chain++;else{if(state.chain>0)state.chainBreaks++;state.chain=1;}state.lastKillT=state.t;state.maxChain=Math.max(state.maxChain,state.chain);
  const base=e.type==='boss'?6000:e.type==='midboss'?1800:e.type==='bunker'?700:e.type==='crane'?900:e.type==='tank'?320:e.type==='stock'?650:e.type==='bossPart'?900:80;
  state.score+=base*state.chain;addGauge(e.reward||3);
  if(e.type==='bossPart')mark(e.role==='back'?'bossBackTurretDestroyed':'bossSideTurretDestroyed');
  if(e.type==='midboss')mark('midbossDestroyed');
  if(e.type==='bunker')mark('bunkerDestroyed');
  for(let i=0;i<8;i++){const a=state.rng()*Math.PI*2,sp=0.5+state.rng()*1.8;state.particles.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:15+state.rng()*18,c:e.type==='heli'?'#ff6060':'#ffd070'});}
}
function onHit(){if(state.player.iframe>0)return;if(state.shieldStock>0){state.shieldStock--;state.player.iframe=80;state.gauge=Math.max(0,state.gauge-G_LV2);state.hitFlash=16;return}state.mode='over';}
function draw(){
  ctx.fillStyle='#071126';ctx.fillRect(0,0,W,H);ctx.fillStyle='#10254a';for(let y=(state.t*1.2)%46-46;y<H;y+=46)ctx.fillRect(0,y,W,1);
  for(const e of state.enemies)drawEnemy(e);
  ctx.fillStyle='#8ee8ff';for(const b of state.bullets)ctx.fillRect(b.x-2,b.y-6,4,10);
  for(const b of state.ebullets){ctx.fillStyle=b.grazed?'#806860':'#ff8068';ctx.beginPath();ctx.arc(b.x,b.y,3.4,0,Math.PI*2);ctx.fill();}
  for(const p of state.particles){ctx.globalAlpha=Math.max(0,p.life/24);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,2,2);ctx.globalAlpha=1}
  if(state.mode!=='over'){ctx.fillStyle=state.player.iframe%6<3?'#80ffd0':'#d8fff0';ctx.beginPath();ctx.moveTo(state.player.x,state.player.y-8);ctx.lineTo(state.player.x-7,state.player.y+8);ctx.lineTo(state.player.x+7,state.player.y+8);ctx.closePath();ctx.fill();}
  if(state.bombFlash>0){ctx.fillStyle=`rgba(255,216,112,${state.bombFlash/18*0.28})`;ctx.fillRect(0,0,W,H)}if(state.hitFlash>0){ctx.fillStyle=`rgba(255,80,80,${state.hitFlash/16*0.25})`;ctx.fillRect(0,0,W,H)}
  ctx.fillStyle='#cfd4e4';ctx.font='11px system-ui';ctx.textAlign='left';ctx.fillText(`SCORE ${state.score}`,10,16);ctx.fillText(`G ${state.gauge}/${G_MAX} SHIELD ${state.shieldStock}/${START_SHIELDS} BOMB ${state.bombCount}`,10,31);ctx.fillText(`CHAIN ${state.chain}/${state.maxChain} BREAK ${state.chainBreaks}`,10,46);ctx.fillText(`${state.wave}/${ROUTE_EVENTS.length} ${state.phaseIntent}`,10,61);
  if(state.stageFlags.bossFinalCue&&state.mode==='play'){ctx.textAlign='center';ctx.font='bold 18px system-ui';ctx.fillStyle=bombReady()?'#ffd870':'#ff8068';ctx.fillText(bombReady()?'CORE OPEN: PRESS SPACE/B':'CORE OPEN: NEED FULL GAUGE',W/2,92)}
  for(const p of state.popups){ctx.globalAlpha=Math.max(0,p.life/44);ctx.fillStyle=p.c;ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);ctx.globalAlpha=1}
  if(state.mode==='title'){ctx.textAlign='center';ctx.fillStyle='#e8ecff';ctx.font='bold 20px system-ui';ctx.fillText('GRAZE',W/2,H/2-56);ctx.font='11px system-ui';ctx.fillText('v32 - DonPachi route study',W/2,H/2-28);ctx.fillText('SPACE TO START',W/2,H/2+18)}
  if(state.mode==='clear'||state.mode==='over'){ctx.textAlign='center';ctx.fillStyle=state.mode==='clear'?'#80ffd0':'#ff8a8a';ctx.font='bold 22px system-ui';ctx.fillText(state.mode==='clear'?'STAGE CLEAR':'GAME OVER',W/2,H/2-20);ctx.font='12px system-ui';ctx.fillText(`GRADE ${state.lastGrade||'-'} SCORE ${state.score}`,W/2,H/2+8)}
}
function drawEnemy(e){
  if(e.type==='heli'||e.type==='smallTank'||e.type==='stock'){ctx.fillStyle=e.type==='stock'?'#ffd870':e.type==='smallTank'?'#ff9d50':'#ff5050';ctx.beginPath();ctx.moveTo(e.x,e.y-e.r);ctx.lineTo(e.x-e.r,e.y+e.r);ctx.lineTo(e.x+e.r,e.y+e.r);ctx.closePath();ctx.fill();return}
  if(e.type==='tank'){ctx.fillStyle='#9da8b6';ctx.fillRect(e.x-14,e.y-10,28,20);ctx.fillStyle='#303848';ctx.fillRect(e.x-4,e.y-18,8,16);return}
  if(e.type==='bunker'||e.type==='crane'){ctx.fillStyle=e.type==='crane'?'#d8a850':(e.open?'#ffb050':'#705040');ctx.fillRect(e.x-20,e.y-14,40,28);ctx.fillStyle='#ffe0a0';ctx.fillRect(e.x-7,e.y-20,14,10);return}
  if(e.type==='midboss'){ctx.fillStyle='#7a74d8';ctx.beginPath();ctx.ellipse(e.x,e.y,42,30,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd870';ctx.fillRect(e.x-8,e.y-34,16,28);return}
  if(e.type==='bossPart'){ctx.fillStyle=e.role==='back'?'#ffd870':'#ff8068';ctx.fillRect(e.x-16,e.y-12,32,24);return}
  ctx.fillStyle='#5160c8';ctx.fillRect(e.x-52,e.y-32,104,64);ctx.fillStyle='#1a1f30';ctx.fillRect(70,52,280,7);ctx.fillStyle='#ff7050';ctx.fillRect(70,52,280*(e.hp/e.maxHp),7);
}
function loop(){if(state.mode==='play')update();draw();requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='ArrowLeft')keys.arrowleft=true;if(e.key==='ArrowRight')keys.arrowright=true;if(e.key==='ArrowUp')keys.arrowup=true;if(e.key==='ArrowDown')keys.arrowdown=true;if(e.code==='Space'){if(state.mode==='title'||state.mode==='over'||state.mode==='clear')startGame();else fireBomb()}if(e.key.toLowerCase()==='b')fireBomb();if(e.key.toLowerCase()==='d')triggerActiveDef()});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key==='ArrowLeft')keys.arrowleft=false;if(e.key==='ArrowRight')keys.arrowright=false;if(e.key==='ArrowUp')keys.arrowup=false;if(e.key==='ArrowDown')keys.arrowdown=false});
if(BOT_ENABLED)startGame();
loop();
</script>
</body>
</html>
