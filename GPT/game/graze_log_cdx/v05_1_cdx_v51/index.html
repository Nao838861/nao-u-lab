function createEvalTelemetry(){
  return {
    cadenceFrames:30,
    samples:[],
    events:[],
    style:{
      horizontalSwitches:0,
      verticalSwitches:0,
      urgentFrames:0,
      targetFrames:0,
      routeIntentSwitches:0,

      lastHorizontal:0,
      lastVertical:0,
      lastIntent:'OPENING',
      maxThreat:0,
      dangerSpikes:0,
      lastThreatBucket:0
    }
  };
}
function recordEvalEvent(type,extra={}){
  if(!state.evalTelemetry)return;
  state.evalTelemetry.events.push(Object.assign({
    t:state.t,
    type,
    phase:state.phaseIntent,
    wave:state.wave,
    x:Math.round(state.player.x),
    y:Math.round(state.player.y),
    gauge:state.gauge,
    chain:state.chain,
    enemies:state.enemies.length,
    bullets:state.ebullets.length
  },extra));
}
function nearestThreatDistance(){
  let best=9999;
  for(const b of state.ebullets){
    const d=Math.hypot(b.x-state.player.x,b.y-state.player.y);
    if(d<best)best=d;
  }
  return best;
}
function updateEvalTelemetry(){
  if(!state.evalTelemetry||state.mode!=='play')return;
  const tel=state.evalTelemetry, st=tel.style;
  const dx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0);
  const dy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
  if(dx&&st.lastHorizontal&&dx!==st.lastHorizontal)st.horizontalSwitches++;
  if(dy&&st.lastVertical&&dy!==st.lastVertical)st.verticalSwitches++;
  if(dx)st.lastHorizontal=dx;
  if(dy)st.lastVertical=dy;
  if(state.phaseIntent!==st.lastIntent){st.routeIntentSwitches++;st.lastIntent=state.phaseIntent;}
  const nearest=nearestThreatDistance();
  const pressure=nearest<9999?Math.max(0,1-nearest/140):0;
  st.maxThreat=Math.max(st.maxThreat,pressure);
  const bucket=pressure>=0.68?2:pressure>=0.36?1:0;
  if(bucket>st.lastThreatBucket)st.dangerSpikes++;
  st.lastThreatBucket=bucket;
  if(pressure>=0.58)st.urgentFrames++;
  if(state.enemies.some(e=>e.y>20&&e.y<state.player.y-38))st.targetFrames++;
  st.routeSamples++;
  if(state.t%tel.cadenceFrames===0){
    tel.samples.push({
      t:state.t,
      x:Math.round(state.player.x),
      y:Math.round(state.player.y),
      gauge:state.gauge,
      chain:state.chain,

  }
}
function summarizeEvalTelemetry(){

    version:GAME_VERSION,
    evalMethod:EVAL_METHOD_VERSION,

    cadenceFrames:tel.cadenceFrames,
    sampleCount:tel.samples.length,
    eventCount:tel.events.length,

      bossCue:eventTypes.bossCue||0,
      bossCueVolley:eventTypes.bossCueVolley||0,
      bossCueSteer:eventTypes.bossCueSteer||0,
      crossLockWave:eventTypes.crossLockWave||0,
      postMidCrossWave:eventTypes.postMidCrossWave||0,
      crossLockGuide:eventTypes.crossLockGuide||0,

}

function startGame(){
  Object.assign(state,{mode:'play',t:0,bullets:[],ebullets:[],enemies:[],particles:[],popups:[],guides:[],gauge:0,score:0,grazeCount:0,bombCount:0,shieldStock:START_SHIELDS,killCount:0,eventIndex:0,wave:0,phaseLabel:'opening',phaseIntent:'OPENING',shotCooldown:0,bombCooldownT:0,bombBrakeT:0,bombFlash:0,hitFlash:0,grazeStreak:0,activeDefT:0,activeDefCount:0,chain:0,maxChain:0,lastKillT:-999,chainBreaks:0,stageFlags:{},clearTime:null,lastGrade:'-',routeLog:[],botTargetX:W/2,bossCueGapX:null,bossCueT:-999,botStyle:BOT_STYLE,evalTelemetry:createEvalTelemetry()});
  state.player={x:W/2,y:H-80,r:5,iframe:80};
  recordEvalEvent('start');
}
function mark(k){state.stageFlags[k]=true}
function addGauge(n){const before=state.gauge;state.gauge=clamp(state.gauge+n,0,G_MAX);if(before<G_MAX&&state.gauge>=G_MAX)state.popups.push({x:state.player.x,y:state.player.y-32,text:'CORE CHARGED',life:44,c:'#ffd870'});}
function gaugeLevel(){return state.gauge>=G_LV3?3:state.gauge>=G_LV2?2:1}
function bombReady(){return state.gauge>=G_MAX&&state.bombCooldownT<=0}
function fireBomb(){if(!bombReady()||state.mode!=='play')return;const before=state.ebullets.length;state.bombCount++;state.gauge=G_LV3;state.bombCooldownT=BOMB_COOLDOWN_FRAMES;state.bombBrakeT=BOMB_BRAKE_FRAMES;state.bombFlash=18;for(const e of state.enemies){e.hp-=e.type==='boss'?20:e.type==='bossPart'?10:e.type==='midboss'?12:99;e.bombed=true;}state.ebullets=[];recordEvalEvent('bomb',{clearedBullets:before});}
function triggerActiveDef(){if(state.mode!=='play'||state.grazeStreak<8)return;state.activeDefCount++;state.activeDefT=ACTIVE_DEF_FRAMES;state.player.iframe=Math.max(state.player.iframe,ACTIVE_DEF_FRAMES);state.grazeStreak=0;let n=0;state.ebullets=state.ebullets.filter(b=>{const dx=b.x-state.player.x,dy=b.y-state.player.y;if(dx*dx+dy*dy<ACTIVE_DEF_RADIUS*ACTIVE_DEF_RADIUS){n++;return false}return true});addGauge(n*2);recordEvalEvent('activeDef',{clearedBullets:n});}

function traceLine(name,duration,pts){return{name,duration,pts}}
function traceBezier(name,duration,p0,p1,p2,p3){return{name,duration,p0,p1,p2,p3}}
function evalTrace(tr,t){const k=clamp(t/tr.duration,0,1);if(tr.pts){const n=tr.pts.length-1,seg=Math.min(n-1,Math.floor(k*n)),lk=k*n-seg,a=tr.pts[seg],b=tr.pts[seg+1];return{x:lerp(a.x,b.x,smooth(lk)),y:lerp(a.y,b.y,smooth(lk))}}return bez(tr.p0,tr.p1,tr.p2,tr.p3,smooth(k))}
function addWaveGuide(kind,color,duration,paths){

  recordEvalEvent(kind,{duration,paths:paths.length,alpha:GUIDE_ALPHA,lineWidth:GUIDE_LINE_WIDTH,chevrons:false});
}

  }
}
function spawnConnectorRow(name,start,end,n){

    spawnEnemy('heli',{trace:tr,group,slot:i,x:tr.pts[0].x,y:tr.pts[0].y,delay:i*5});
  }
}

  }
  recordEvalEvent('kill',{enemyType:e.type,role:e.role||null,routeChoice:!!e.routeChoice});
  for(let i=0;i<8;i++){const a=state.rng()*Math.PI*2,sp=0.5+state.rng()*1.8;state.particles.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:15+state.rng()*18,c:e.type==='heli'?'#ff6060':'#ffd070'});}
}
function onHit(){if(state.player.iframe>0)return;if(state.shieldStock>0){state.shieldStock--;state.player.iframe=80;state.gauge=Math.max(0,state.gauge-G_LV2);state.hitFlash=16;recordEvalEvent('shieldHit',{shieldStock:state.shieldStock});return}state.mode='over';recordEvalEvent('gameOver');}
function draw(){
  ctx.fillStyle='#071126';ctx.fillRect(0,0,W,H);ctx.fillStyle='#10254a';for(let y=(state.t*1.2)%46-46;y<H;y+=46)ctx.fillRect(0,y,W,1);
  for(const g of state.guides)drawGuide(g);
  for(const e of state.enemies)drawEnemy(e);
  ctx.fillStyle='#8ee8ff';for(const b of state.bullets)ctx.fillRect(b.x-2,b.y-6,4,10);
  for(const b of state.ebullets){ctx.fillStyle=b.grazed?'#806860':'#ff8068';ctx.beginPath();ctx.arc(b.x,b.y,3.4,0,Math.PI*2);ctx.fill();}
  for(const p of state.particles){ctx.globalAlpha=Math.max(0,p.life/24);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,2,2);ctx.globalAlpha=1}
  if(state.mode!=='over'){ctx.fillStyle=state.player.iframe%6<3?'#80ffd0':'#d8fff0';ctx.beginPath();ctx.moveTo(state.player.x,state.player.y-8);ctx.lineTo(state.player.x-7,state.player.y+8);ctx.lineTo(state.player.x+7,state.player.y+8);ctx.closePath();ctx.fill();}
  if(state.bombFlash>0){ctx.fillStyle=`rgba(255,216,112,${state.bombFlash/18*0.28})`;ctx.fillRect(0,0,W,H)}if(state.hitFlash>0){ctx.fillStyle=`rgba(255,80,80,${state.hitFlash/16*0.25})`;ctx.fillRect(0,0,W,H)}
  ctx.fillStyle='#cfd4e4';ctx.font='11px system-ui';ctx.textAlign='left';ctx.fillText(`SCORE ${state.score}`,10,16);ctx.fillText(`G ${state.gauge}/${G_MAX} SHIELD ${state.shieldStock}/${START_SHIELDS} BOMB ${state.bombCount}`,10,31);ctx.fillText(`CHAIN ${state.chain}/${state.maxChain} BREAK ${state.chainBreaks}`,10,46);ctx.fillText(`${state.wave}/${ROUTE_EVENTS.length} ${state.phaseIntent}`,10,61);
  if(state.stageFlags.bossFinalCue&&state.mode==='play'){ctx.textAlign='center';ctx.font='bold 18px system-ui';ctx.fillStyle=bombReady()?'#ffd870':'#ff8068';ctx.fillText(bombReady()?'CORE OPEN: PRESS SPACE/B':'CORE OPEN: NEED FULL GAUGE',W/2,92)}
  for(const p of state.popups){ctx.globalAlpha=Math.max(0,p.life/44);ctx.fillStyle=p.c;ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);ctx.globalAlpha=1}
  if(state.mode==='title'){ctx.textAlign='center';ctx.fillStyle='#e8ecff';ctx.font='bold 20px system-ui';ctx.fillText('GRAZE',W/2,H/2-56);ctx.font='11px system-ui';ctx.fillText('v51 - no guide chevrons',W/2,H/2-28);ctx.fillText('SPACE TO START',W/2,H/2+18)}
  if(state.mode==='clear'||state.mode==='over'){ctx.textAlign='center';ctx.fillStyle=state.mode==='clear'?'#80ffd0':'#ff8a8a';ctx.font='bold 22px system-ui';ctx.fillText(state.mode==='clear'?'STAGE CLEAR':'GAME OVER',W/2,H/2-20);ctx.font='12px system-ui';ctx.fillText(`GRADE ${state.lastGrade||'-'} SCORE ${state.score}`,W/2,H/2+8)}
}
function drawGuide(g){
  const fadeIn=clamp(g.t/24,0,1),fadeOut=clamp((g.duration-g.t)/42,0,1);
  ctx.globalAlpha=g.alpha*Math.min(fadeIn,fadeOut);
  ctx.strokeStyle=g.color;ctx.lineWidth=g.lineWidth;
  for(const pts of g.paths){
    ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function drawEnemy(e){
  const cross=typeof e.group==='string'&&e.group.startsWith('cross_lock_');
  const post=typeof e.group==='string'&&e.group.startsWith('post_mid_cross_');
  if(e.type==='heli'||e.type==='smallTank'||e.type==='stock'){ctx.fillStyle=cross?'#ff6aa8':post?'#ff8a58':e.type==='stock'?'#ffd870':e.type==='smallTank'?'#ff9d50':'#ff5050';ctx.beginPath();ctx.moveTo(e.x,e.y-e.r);ctx.lineTo(e.x-e.r,e.y+e.r);ctx.lineTo(e.x+e.r,e.y+e.r);ctx.closePath();ctx.fill();if(cross||post){ctx.strokeStyle=cross?'#ffd870':'#7ee7ff';ctx.lineWidth=2;ctx.stroke();}return}
  if(e.type==='tank'){ctx.fillStyle=post?'#7ee7ff':'#9da8b6';ctx.fillRect(e.x-14,e.y-10,28,20);ctx.fillStyle=post?'#164b5a':'#303848';ctx.fillRect(e.x-4,e.y-18,8,16);if(post){ctx.strokeStyle='#ffffff';ctx.lineWidth=1.5;ctx.strokeRect(e.x-15,e.y-11,30,22);}return}
  if(e.type==='armored'){ctx.fillStyle='#b6c0d0';ctx.beginPath();ctx.ellipse(e.x,e.y,24,18,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff7050';ctx.fillRect(e.x-12,e.y-3,24,6);return}
  if(e.type==='relay'){
    if(e.routePreview){
      ctx.globalAlpha=0.48;ctx.strokeStyle='#ffd870';ctx.lineWidth=1.5;
      for(const dir of [-1,1]){
        const lx=e.x+dir*76,ly=e.y+72;
        ctx.beginPath();ctx.moveTo(e.x,e.y+10);ctx.lineTo(lx,ly);ctx.stroke();
        ctx.strokeRect(lx-9,ly-6,18,14);
        ctx.beginPath();ctx.arc(lx,ly-7,6,Math.PI,0);ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
    ctx.fillStyle='#80ffd0';ctx.beginPath();ctx.moveTo(e.x,e.y-e.r-3);ctx.lineTo(e.x+e.r+3,e.y);ctx.lineTo(e.x,e.y+e.r+3);ctx.lineTo(e.x-e.r-3,e.y);ctx.closePath();ctx.fill();ctx.strokeStyle='#173a4a';ctx.lineWidth=2;ctx.stroke();return}
  if(e.type==='shield'){
    const armored=e.t<e.shieldT&&e.shieldArmor>0;
    ctx.fillStyle=armored?'#70a8ff':'#b8c0d8';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
    if(armored){
      const k=e.shieldArmor/e.shieldArmorMax;
      ctx.strokeStyle=e.shieldHitFlash>0?'#ffffff':'#d8ecff';ctx.lineWidth=e.shieldHitFlash>0?4:2;ctx.beginPath();ctx.arc(e.x,e.y,e.r+5,-Math.PI/2,-Math.PI/2+Math.PI*2*k);ctx.stroke();
      ctx.fillStyle='#10254a';ctx.fillRect(e.x-15,e.y+20,30,4);ctx.fillStyle=e.shieldArmor<=2?'#ffd870':'#80ffd0';ctx.fillRect(e.x-15,e.y+20,30*k,4);
      if(e.shieldArmor<=2){ctx.strokeStyle='#ffd870';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(e.x-10,e.y-9);ctx.lineTo(e.x+10,e.y+9);ctx.moveTo(e.x+10,e.y-9);ctx.lineTo(e.x-10,e.y+9);ctx.stroke();}
    }
    return
  }
  if(e.type==='bunker'||e.type==='crane'){ctx.fillStyle=e.type==='crane'?'#d8a850':(e.open?'#ffb050':'#705040');ctx.fillRect(e.x-20,e.y-14,40,28);ctx.fillStyle='#ffe0a0';ctx.fillRect(e.x-7,e.y-20,14,10);return}
  if(e.type==='midboss'){ctx.fillStyle='#7a74d8';ctx.beginPath();ctx.ellipse(e.x,e.y,42,30,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd870';ctx.fillRect(e.x-8,e.y-34,16,28);return}
  if(e.type==='bossPart'){ctx.fillStyle=e.role==='back'?'#ffd870':'#ff8068';ctx.fillRect(e.x-16,e.y-12,32,24);return}
  ctx.fillStyle='#5160c8';ctx.fillRect(e.x-52,e.y-32,104,64);ctx.fillStyle='#1a1f30';ctx.fillRect(70,52,280,7);ctx.fillStyle='#ff7050';ctx.fillRect(70,52,280*(e.hp/e.maxHp),7);
}
function loop(){if(state.mode==='play')update();draw();requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='ArrowLeft')keys.arrowleft=true;if(e.key==='ArrowRight')keys.arrowright=true;if(e.key==='ArrowUp')keys.arrowup=true;if(e.key==='ArrowDown')keys.arrowdown=true;if(e.code==='Space'){if(state.mode==='title'||state.mode==='over'||state.mode==='clear')startGame();else fireBomb()}if(e.key.toLowerCase()==='b')fireBomb();if(e.key.toLowerCase()==='d')triggerActiveDef()});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key==='ArrowLeft')keys.arrowleft=false;if(e.key==='ArrowRight')keys.arrowright=false;if(e.key==='ArrowUp')keys.arrowup=false;if(e.key==='ArrowDown')keys.arrowdown=false});
if(BOT_ENABLED)startGame();
loop();
</script>
</body>
</html>
