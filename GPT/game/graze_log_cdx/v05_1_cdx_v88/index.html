function updateEvalTelemetry(){
  if(!state.evalTelemetry||state.mode!=='play')return;
  const tel=state.evalTelemetry, st=tel.style;
  const dx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0);
  const dy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
  if(dx&&st.lastHorizontal&&dx!==st.lastHorizontal)st.horizontalSwitches++;
  if(dy&&st.lastVertical&&dy!==st.lastVertical)st.verticalSwitches++;
  if(dx)st.lastHorizontal=dx;
  if(dy)st.lastVertical=dy;
  if(state.phaseIntent!==st.lastIntent){st.routeIntentSwitches++;st.lastIntent=state.phaseIntent;}
  const nearest=nearestThreatDistance();
  const pressure=nearest<9999?Math.max(0,1-nearest/140):0;
  st.maxThreat=Math.max(st.maxThreat,pressure);
  const bucket=pressure>=0.68?2:pressure>=0.36?1:0;
  if(bucket>st.lastThreatBucket)st.dangerSpikes++;
  st.lastThreatBucket=bucket;
  if(pressure>=0.58)st.urgentFrames++;
  if(state.player.y>H-120)st.bottomCampFrames++;
  if(state.player.y<H-130)st.forwardAttackFrames++;
  if(state.enemies.some(e=>e.y>20&&e.y<state.player.y-38))st.targetFrames++;
  st.routeSamples++;
  if(state.t%tel.cadenceFrames===0){
    const density=densitySnapshot();
    tel.samples.push({
      t:state.t,
      x:Math.round(state.player.x),
      y:Math.round(state.player.y),
      gauge:state.gauge,
      chain:state.chain,
      maxChain:state.maxChain,
      enemies:state.enemies.length,
      bullets:state.ebullets.length,
      killCount:state.killCount,
      visibleEnemies:density.visibleEnemies,
      shootableEnemies:density.shootableEnemies,
      hardTargets:density.hardTargets,
      enemyBullets:density.enemyBullets,
      nearBullets:density.nearBullets,
      activeThreats:density.activeThreats,
      enemyTypes:density.enemyTypes,
      pressure:Number(pressure.toFixed(3)),
      phase:state.phaseIntent,
      targetVisible:state.enemies.some(e=>e.y>20&&e.y<state.player.y-38)
    });
  }
}

function mark(k){state.stageFlags[k]=true}
function addGauge(n){const before=state.gauge;state.gauge=clamp(state.gauge+n,0,G_MAX);if(before<G_MAX&&state.gauge>=G_MAX)state.popups.push({x:state.player.x,y:state.player.y-32,text:'CORE CHARGED',life:44,c:'#ffd870'});}
function chasePopupThreatNearby(x,y){return state.ebullets.some(b=>{const dx=b.x-x,dy=b.y-y;return dx*dx+dy*dy<CHASE_POPUP_THREAT_RADIUS*CHASE_POPUP_THREAT_RADIUS;});}
function chasePopupBossCueOverlap(x,y){return state.stageFlags.bossFinalCue&&x>78&&x<W-78&&y>70&&y<116;}
function chooseChasePopupPosition(x,y){
  const sideX=x<W/2?58:W-58;
  const anchorY=clamp(state.player.y-96,150,H-104);
  const candidates=[
    {x:sideX,y:anchorY},
    {x:sideX,y:clamp(anchorY-44,150,H-104)},
    {x:sideX,y:clamp(anchorY+44,150,H-104)},
    {x:sideX,y:clamp(anchorY-88,150,H-104)}
  ];
  const safe=candidates.find(p=>!chasePopupThreatNearby(p.x,p.y)&&!chasePopupBossCueOverlap(p.x,p.y))||candidates[0];
  return Object.assign({repositioned:true},safe);
}
function addChasePopup(x,y){
  const active=state.popups.filter(p=>p.kind==='chase').length;
  state.maxChasePopupsActive=Math.max(state.maxChasePopupsActive,active);
  if(state.t-state.lastChasePopupT<CHASE_POPUP_COOLDOWN_FRAMES||active>=CHASE_POPUP_MAX_ACTIVE){
    state.suppressedChasePopups++;
    recordEvalEvent('chasePopupSuppressed',{active});
    return;
  }
  const text=state.chaseBonusCount>1&&state.chaseBonusCount%5===0?`CHASE x${state.chaseBonusCount}`:'CHASE';
  const pos=chooseChasePopupPosition(x,y);
  if(pos.repositioned)state.chasePopupRepositioned++;
  const side=pos.x<W/2?'left':'right';
  const playerDist=Math.hypot(pos.x-state.player.x,pos.y-state.player.y);
  const killDist=Math.hypot(pos.x-x,pos.y-y);
  state.chasePopupPlayerDistSum+=playerDist;
  state.chasePopupKillDistSum+=killDist;
  if(side==='left')state.chasePopupLeftCount++;else state.chasePopupRightCount++;
  if(state.lastChasePopupSide&&state.lastChasePopupSide!==side)state.chasePopupSideSwitches++;
  state.lastChasePopupSide=side;
  state.popups.push({kind:'chase',x:pos.x,y:pos.y,text,life:24,c:'#80ffd0',side});
  state.chasePopupCount++;
  state.lastChasePopupT=state.t;
  const nowActive=active+1;
  state.maxChasePopupsActive=Math.max(state.maxChasePopupsActive,nowActive);
  state.chasePopupBurstMax=Math.max(state.chasePopupBurstMax,nowActive);
  recordEvalEvent('chasePopup',{active:nowActive,text,repositioned:pos.repositioned,side,playerDist:Number(playerDist.toFixed(1)),killDist:Number(killDist.toFixed(1))});
}

function aimed(e,sp=1.6,spread=0){const dx=state.player.x-e.x,dy=state.player.y-e.y,d=Math.hypot(dx,dy)||1,a=Math.atan2(dy,dx)+spread;state.ebullets.push(Object.assign({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,grazed:false},enemyBulletMeta(e)));}
function wide(e,n,sp,base=Math.PI/2,deg=12){for(let i=0;i<n;i++){const a=base+(i-(n-1)/2)*deg*Math.PI/180;state.ebullets.push(Object.assign({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,grazed:false},enemyBulletMeta(e)));}}
function fireEnemy(e){
  if(state.ebullets.length>76&&e.type!=='boss'&&e.type!=='bossPart')return;
  if(e.y<20||e.y>H-70)return;
  if(e.type==='tank'){aimed(e,1.55);}
  else if(e.type==='bunker'){wide(e,3,1.45,Math.PI/2,18);}
  else if(e.type==='midboss'){aimed(e,1.85);wide(e,5,1.55,Math.PI/2,13);}
  else if(e.type==='bossPart'&&e.role==='back')wide(e,7,1.7,Math.PI/2,12);
  else if(e.type==='bossPart')for(let i=0;i<4;i++)aimed(e,1.9,(i-1.5)*0.08);
  else if(e.type==='raider'){
    aimed(e,1.45);
    if(state.player.y>H-70){
      aimed(e,2.05,-0.13);
      aimed(e,2.05,0.13);
    }
  }
  else if(e.type==='boss'){wide(e,5,1.7,Math.PI/2,16);}
}

function updateEnemy(e){
  e.t++;if(e.delay&&e.t<e.delay)return;const lt=e.t-(e.delay||0);
  if(e.shieldHitFlash>0)e.shieldHitFlash--;
  if(e.type==='bossPart'){const b=state.enemies.find(x=>x.type==='boss');if(b){e.x=b.x+e.offsetX;e.y=b.y+e.offsetY;}}
  else if(e.trace){const p=evalTrace(e.trace,lt);e.x=p.x;e.y=p.y;}
  if(e.type==='bunker'&&!e.release&&lt>130){e.release=true;e.open=true;for(let i=0;i<4;i++){const dir=i<2?-1:1;spawnEnemy('smallTank',{trace:traceLine('dp_bunker_small_tank',260,[{x:e.x+(i-1.5)*12,y:e.y+8},{x:e.x+dir*(44+i*8),y:e.y+58+i*8},{x:e.x+dir*(92+i*10),y:H+30}]),x:e.x,y:e.y+8,group:e.group+'_release',delay:i*7});}}
  if(e.type==='armored'&&!e.release&&lt>120)releaseArmoredSplit(e);
  if(e.fireT!==9999&&lt>0&&lt%e.fireT===0)fireEnemy(e);
}

function updateBot(){
  const ev=ROUTE_EVENTS[Math.min(state.eventIndex,ROUTE_EVENTS.length-1)];
  const style=state.botStyle||'route';
  const stylePhase=((state.t/360)|0);
  const isNovice=style==='novice', isMarksman=style==='marksman', isSurvival=style==='survival', isCamper=style==='camper';
  let tx=ev?W*ev.lane:W/2,ty=(style==='aggressive'||isMarksman)?H-170:(style==='route'?H-145:H-75);
  const traceInfo={
    style,
    routeIntent:ev?ev.intent:null,
    routeLane:ev?Number(ev.lane.toFixed(3)):null,
    baseTx:Math.round(tx),
    baseTy:Math.round(ty),
    targetType:null,
    targetX:null,
    targetY:null,
    nearestBefore:null,
    jitterX:0,
    jitterY:0,
    preLagTx:null,
    preLagTy:null,
    lagApplied:false,
    lagSourceT:null,
    finalTx:null,
    finalTy:null,
    action:null
  };
  if(isCamper){tx=W/2+Math.sin(state.t/34)*96;ty=H-45;}
  if(isNovice){
    tx=lerp(tx,W*(0.5+0.32*Math.sin(state.t/95)),0.42);
    ty=lerp(ty,H-62-(stylePhase%3)*18,0.34);
  }
  const target=state.enemies.filter(e=>e.y>0&&e.y<state.player.y-36).sort((a,b)=>{
    const rank={bossPart:0,boss:1,midboss:2,armored:3,shield:4,relay:5,bunker:6,tank:7,crane:8,stock:9,smallTank:10,heli:11};
    return (rank[a.type]??9)-(rank[b.type]??9)||Math.abs(a.x-state.player.x)-Math.abs(b.x-state.player.x);
  })[0];
  if(target){
    traceInfo.targetType=target.type;
    traceInfo.targetX=Math.round(target.x);
    traceInfo.targetY=Math.round(target.y);
    const aimMix=style==='aggressive'?0.86:style==='defensive'?0.38:style==='panic'?0.18:isNovice?0.30:isMarksman?0.94:isSurvival?0.28:isCamper?0.08:0.65;
    tx=lerp(tx,target.x,aimMix);
    if(style==='aggressive'||isMarksman)ty=lerp(ty,Math.max(120,target.y+(isMarksman?66:84)),isMarksman?0.48:0.35);
    if(isCamper)ty=H-45;

    if(armored){
      const k=e.shieldArmor/e.shieldArmorMax;
      ctx.strokeStyle=e.shieldHitFlash>0?'#ffffff':'#d8ecff';ctx.lineWidth=e.shieldHitFlash>0?4:2;ctx.beginPath();ctx.arc(e.x,e.y,e.r+5,-Math.PI/2,-Math.PI/2+Math.PI*2*k);ctx.stroke();
      ctx.fillStyle='#10254a';ctx.fillRect(e.x-15,e.y+20,30,4);ctx.fillStyle=e.shieldArmor<=2?'#ffd870':'#80ffd0';ctx.fillRect(e.x-15,e.y+20,30*k,4);
      if(e.shieldArmor<=2){ctx.strokeStyle='#ffd870';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(e.x-10,e.y-9);ctx.lineTo(e.x+10,e.y+9);ctx.moveTo(e.x+10,e.y-9);ctx.lineTo(e.x-10,e.y+9);ctx.stroke();}
    }
    return
  }
  if(e.type==='bunker'||e.type==='crane'){ctx.fillStyle=e.type==='crane'?'#d8a850':(e.open?'#ffb050':'#705040');ctx.fillRect(e.x-20,e.y-14,40,28);ctx.fillStyle='#ffe0a0';ctx.fillRect(e.x-7,e.y-20,14,10);return}
  if(e.type==='midboss'){ctx.fillStyle='#7a74d8';ctx.beginPath();ctx.ellipse(e.x,e.y,42,30,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd870';ctx.fillRect(e.x-8,e.y-34,16,28);return}
  if(e.type==='bossPart'){ctx.fillStyle=e.role==='back'?'#ffd870':'#ff8068';ctx.fillRect(e.x-16,e.y-12,32,24);return}
  ctx.fillStyle='#5160c8';ctx.fillRect(e.x-52,e.y-32,104,64);ctx.fillStyle='#1a1f30';ctx.fillRect(70,52,280,7);ctx.fillStyle='#ff7050';ctx.fillRect(70,52,280*(e.hp/e.maxHp),7);
}
function loop(){if(state.mode==='play')update();draw();requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='ArrowLeft')keys.arrowleft=true;if(e.key==='ArrowRight')keys.arrowright=true;if(e.key==='ArrowUp')keys.arrowup=true;if(e.key==='ArrowDown')keys.arrowdown=true;if(e.code==='Space'){if(state.mode==='title'||state.mode==='over'||state.mode==='clear')startGame();else fireBomb()}if(e.key.toLowerCase()==='b')fireBomb();if(e.key.toLowerCase()==='d')triggerActiveDef()});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key==='ArrowLeft')keys.arrowleft=false;if(e.key==='ArrowRight')keys.arrowright=false;if(e.key==='ArrowUp')keys.arrowup=false;if(e.key==='ArrowDown')keys.arrowdown=false});
if(PROBE_FRAME!==null){
  startGame();
  if(PROBE_FORCE_IFRAME)state.player.iframe=999999;
  if(PROBE_REVIEW){
    const beforeFrame=Math.max(0,PROBE_FRAME-2),afterFrame=PROBE_FRAME+2;
    while(state.t<beforeFrame&&state.mode==='play')update();
    const before=makeProbeSnapshot();
    while(state.t<PROBE_FRAME&&state.mode==='play')update();
    draw();
    const snapshot=makeProbeSnapshot();
    while(state.t<afterFrame&&state.mode==='play')update();
    const after=makeProbeSnapshot();
    const reviewPacket=makeReviewPacket(snapshot,before,after);
    setReviewPanelData(snapshot,reviewPacket);
    if(PROBE_DRAW)window.__probe={...snapshot,reviewPacket};
  }else{
    while(state.t<PROBE_FRAME&&state.mode==='play')update();
    draw();
    const snapshot=makeProbeSnapshot();
    if(PROBE_DRAW)window.__probe=snapshot;
  }
}else{
  if(BOT_ENABLED)startGame();
  loop();
}
</script>
</body>
