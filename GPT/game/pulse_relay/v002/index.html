<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulse Relay v002: Vector Wake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <canvas id="game" width="480" height="640" aria-label="Pulse Relay v002 game canvas"></canvas>
  </main>
  <script src="game.js"></script>
  <script>
    const { Game, COLORS, W, H, FPS, BOSS_START } = window.VectorWake;
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const game = new Game();
    const keys = new Set();
    let pauseLatch = false;

    window.addEventListener("keydown", (event) => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(event.code)) event.preventDefault();
      keys.add(event.code);
    });
    window.addEventListener("keyup", (event) => {
      keys.delete(event.code);
    });

    function input() {
      const pausePressed = keys.has("KeyP") && !pauseLatch;
      pauseLatch = keys.has("KeyP");
      return {
        left: keys.has("ArrowLeft") || keys.has("KeyA"),
        right: keys.has("ArrowRight") || keys.has("KeyD"),
        up: keys.has("ArrowUp") || keys.has("KeyW"),
        down: keys.has("ArrowDown") || keys.has("KeyS"),
        shoot: true,
        pulse: keys.has("Space") || keys.has("KeyX") || keys.has("ShiftLeft") || keys.has("ShiftRight"),
        restart: keys.has("KeyR"),
        pausePressed,
      };
    }

    function drawBackground() {
      ctx.fillStyle = "#071018";
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = "rgba(126, 248, 255, 0.08)";
      ctx.lineWidth = 1;
      for (let x = 0; x <= W; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
      for (let y = (game.frame % 40); y <= H; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }
      ctx.fillStyle = "rgba(255,255,255,0.28)";
      for (let i = 0; i < 36; i++) {
        const x = (i * 89 + 37) % W;
        const y = (i * 131 + game.frame * (1 + (i % 3))) % H;
        ctx.fillRect(x, y, 1, 8 + (i % 3) * 3);
      }
    }

    function poly(points, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(points[0][0], points[0][1]);
      for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
      ctx.closePath();
      ctx.fill();
    }

    function drawPlayer() {
      const p = game.player;
      ctx.save();
      ctx.globalAlpha = p.invuln > 0 && Math.floor(game.frame / 4) % 2 === 0 ? 0.45 : 1;
      poly([[p.x, p.y - 14], [p.x - 10, p.y + 10], [p.x, p.y + 4], [p.x + 10, p.y + 10]], COLORS.player);
      ctx.fillStyle = COLORS.pulse;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      if (p.charge >= 65) {
        ctx.strokeStyle = "rgba(126,248,255,0.34)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 104 + Math.sin(game.frame / 7) * 4, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawEnemy(e) {
      const color = COLORS[e.type] || "#fff";
      ctx.save();
      ctx.translate(e.x, e.y);
      if (e.type === "boss") {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, -42);
        ctx.lineTo(-44, -8);
        ctx.lineTo(-28, 36);
        ctx.lineTo(0, 24);
        ctx.lineTo(28, 36);
        ctx.lineTo(44, -8);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = e.phase === "phase1" ? "#48d7ff" : e.phase === "phase2" ? "#ff9f32" : "#ff6d70";
        ctx.beginPath();
        ctx.arc(0, 0, 13 + Math.sin(game.frame / 5) * 2, 0, Math.PI * 2);
        ctx.fill();
      } else if (e.type === "carrier") {
        ctx.fillStyle = color;
        ctx.fillRect(-18, -14, 36, 28);
        ctx.fillStyle = "#071018";
        ctx.fillRect(-8, -6, 16, 12);
      } else if (e.type === "diver") {
        poly([[0, -15], [-14, 12], [0, 5], [14, 12]], color);
      } else if (e.type === "lance") {
        poly([[-16, -9], [12, -13], [18, 0], [12, 13], [-16, 9], [-8, 0]], color);
      } else {
        poly([[0, -12], [-12, 8], [0, 13], [12, 8]], color);
      }
      if (e.type !== "boss") {
        ctx.fillStyle = "rgba(255,255,255,0.55)";
        ctx.fillRect(-e.radius, e.radius + 4, e.radius * 2 * Math.max(0, e.hp / e.maxHp), 2);
      }
      ctx.restore();
    }

    function drawHud() {
      const p = game.player;
      ctx.fillStyle = "rgba(7,16,24,0.72)";
      ctx.fillRect(0, 0, W, 42);
      ctx.fillStyle = "#e9f6ff";
      ctx.font = "13px system-ui, sans-serif";
      ctx.fillText(`SCORE ${game.score}`, 12, 17);
      ctx.fillText(`HP ${p.hp}`, 132, 17);
      ctx.fillText(`PULSE ${Math.floor(p.charge)}%`, 188, 17);
      ctx.fillText(`TIME ${(game.frame / FPS).toFixed(1)}`, 300, 17);
      ctx.fillStyle = "#132b35";
      ctx.fillRect(188, 24, 102, 8);
      ctx.fillStyle = p.charge >= 65 ? COLORS.pulse : "#3d8291";
      ctx.fillRect(188, 24, Math.min(100, p.charge), 8);
      const boss = game.enemies.find((e) => e.type === "boss");
      if (boss) {
        ctx.fillStyle = "#2a1720";
        ctx.fillRect(12, 46, W - 24, 8);
        ctx.fillStyle = boss.phase === "phase1" ? COLORS.scout : boss.phase === "phase2" ? COLORS.lance : "#ff6d70";
        ctx.fillRect(12, 46, (W - 24) * Math.max(0, boss.hp / boss.maxHp), 8);
      } else if (game.frame > BOSS_START - 180 && game.frame < BOSS_START) {
        ctx.fillStyle = "#ffd166";
        ctx.font = "18px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("VECTOR CORE APPROACH", W / 2, 78);
        ctx.textAlign = "left";
      }
      ctx.fillStyle = "rgba(233,246,255,0.74)";
      ctx.font = "11px system-ui, sans-serif";
      ctx.fillText("Move WASD/Arrows  Auto Shot  Pulse Space/X/Shift  Restart R", 12, H - 12);
    }

    function drawMessage() {
      if (game.state === "play") return;
      ctx.fillStyle = "rgba(7,16,24,0.72)";
      ctx.fillRect(0, 230, W, 120);
      ctx.fillStyle = "#e9f6ff";
      ctx.font = "24px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(game.state === "pause" ? "PAUSED" : game.message, W / 2, 280);
      ctx.font = "14px system-ui, sans-serif";
      ctx.fillText("Press R to restart", W / 2, 312);
      ctx.textAlign = "left";
    }

    function render() {
      drawBackground();
      for (const s of game.playerShots) {
        ctx.fillStyle = s.kind === "pulse" ? COLORS.pulse : COLORS.shot;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      for (const b of game.enemyBullets) {
        ctx.fillStyle = b.color || COLORS.enemyBullet;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      }
      for (const e of game.enemies) drawEnemy(e);
      drawPlayer();
      for (const fx of game.effects) {
        const t = 1 - fx.life / fx.max;
        ctx.save();
        ctx.globalAlpha = 1 - t;
        ctx.strokeStyle = fx.color;
        ctx.fillStyle = fx.color;
        if (fx.kind === "ring") {
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(fx.x, fx.y, 8 + t * 104, 0, Math.PI * 2);
          ctx.stroke();
        } else if (fx.kind === "burst") {
          ctx.beginPath();
          ctx.arc(fx.x, fx.y, 8 + t * 34, 0, Math.PI * 2);
          ctx.stroke();
        } else {
          ctx.fillRect(fx.x - 2, fx.y - 2, 4, 4);
        }
        ctx.restore();
      }
      drawHud();
      drawMessage();
    }

    function loop() {
      game.update(input());
      render();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
