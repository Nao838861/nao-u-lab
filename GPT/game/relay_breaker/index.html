<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relay Breaker</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <section class="play-area" aria-label="Relay Breaker game">
      <div class="top-hud" aria-label="Status">
        <div class="brand">Relay Breaker</div>
        <div class="stat"><span>Score</span><strong id="score">0</strong></div>
        <div class="stat"><span>Stage</span><strong id="stage">1</strong></div>
        <div class="stat"><span>Balls</span><strong id="balls">3</strong></div>
        <div class="meter"><span>Relay</span><div><i id="relayMeter"></i></div></div>
        <div class="meter"><span>Focus</span><div><i id="focusMeter"></i></div></div>
        <div class="commands">
          <button id="pauseButton" type="button" title="Pause">Pause</button>
          <button id="resetButton" type="button" title="Reset">Reset</button>
        </div>
      </div>
      <canvas id="game" width="960" height="640"></canvas>
      <div class="overlay" id="overlay">
        <h1>Relay Breaker</h1>
        <p id="overlayText">赤い BREAK と黄色い SHIELD を壊し、青い RELAY は残してステージを進める。</p>
        <button id="startButton" type="button">開始</button>
      </div>
    </section>
  </main>
  <script src="./game.js"></script>
</body>
</html>
