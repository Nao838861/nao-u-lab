MEMORY {
 ZP: start=$00,size=$100,type=rw,file="";
 RAM: start=$500,size=$230,type=rw,file="";
 PRG: start=$8000,size=$6000,type=ro,fill=yes;
 FIX: start=$e000,size=$1ffa,type=ro,fill=yes;
 VEC: start=$fffa,size=6,type=ro;
}
SEGMENTS {
 ZEROPAGE: load=ZP,type=zp;
 BSS: load=RAM,type=bss;
 CODE: load=PRG,type=ro;
 RODATA: load=PRG,type=ro;
 STARTUP: load=FIX,type=ro;
 VECTORS: load=VEC,type=ro;
}

