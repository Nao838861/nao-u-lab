MEMORY {
 ACT: start=$a000,size=$4000,type=ro,file="build/actor-bank.bin",fill=yes;
 WRAM: start=$6800,size=$0800,type=rw,file="";
 ZP: start=$00,size=$100,type=rw,file="";
 RAM: start=$600,size=$1b0,type=rw,file="";
 RESIDENT: start=$8000,size=$2000,type=ro,fill=yes;
 PRG: start=$a000,size=$4000,type=ro,fill=yes;
 FIX: start=$e000,size=$1ffa,type=ro,fill=yes;
 VEC: start=$fffa,size=6,type=ro;
}
SEGMENTS {
 ACTORS: load=ACT,type=ro;
 ACTORRAM: load=WRAM,type=bss;
 ZEROPAGE: load=ZP,type=zp;
 BSS: load=RAM,type=bss;
 CODE: load=RESIDENT,type=ro;
 RODATA: load=PRG,type=ro,align=$100;
 STARTUP: load=FIX,type=ro;
 STAGEDATA: load=FIX,type=ro;
 VECTORS: load=VEC,type=ro;
}

