function search(){const query=norm($('#search').value),year=Number($('#year').value),box=$('#results');box.replaceChildren();if(!query){box.hidden=true;return;}const hits=Object.values(nodes).filter(n=>norm(n.title).includes(query)&&(!year||(!n.external&&n.year===year)));for(const n of hits.slice(0,60)){const b=document.createElement('button');b.textContent=n.title;const small=document.createElement('small');small.textContent=n.platform+' · '+(n.external?'初出 '+n.year:n.date);b.append(small);b.onclick=()=>{goTo(n.id);box.hidden=true;$('#search').blur();};box.append(b);}if(!hits.length){const p=document.createElement('div');p.className='empty';p.textContent='該当するタイトルがありません';box.append(p);}box.hidden=false;}
$('#search').addEventListener('input',search);$('#search').addEventListener('focus',search);$('#search').addEventListener('keydown',e=>{if(e.key==='Enter'){$('#results button')?.click();}if(e.key==='Escape')$('#results').hidden=true;if(e.key==='ArrowDown'){$('#results button')?.focus();e.preventDefault();}});

$('#year').onchange=()=>{search();const year=Number($('#year').value);if(year){const cs=cards.filter(c=>!c.alias&&!nodes[c.node].external&&nodes[c.node].year===year);cs.sort((a,b)=>Math.abs(a.x-camera.x)-Math.abs(b.x-camera.x));if(cs[0])goTo(cs[0].node);}schedule();};
$('#plus').onclick=()=>zoom(1.3);$('#minus').onclick=()=>zoom(1/1.3);$('#overview').onclick=()=>moveTo(data.width/2,data.height/2,Math.min((W-70)/data.width,(H-90)/data.height));
for(const button of document.querySelectorAll('[data-title]'))button.onclick=()=>{const n=Object.values(nodes).find(n=>!n.external&&n.title===button.dataset.title);if(n)goTo(n.id);};
function hit(x,y){const [wx,wy]=screenToWorld(x,y);return cards.findLast(c=>wx>=c.x&&wx<=c.x+c.w&&wy>=c.y&&wy<=c.y+c.h);}
const pointers=new Map();let dragged=false,startPointer=null;
canvas.addEventListener('pointerdown',e=>{animation=null;canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,local(e));if(pointers.size===1){startPointer=local(e);dragged=false;}canvas.classList.add('dragging');});
canvas.addEventListener('pointermove',e=>{const pos=local(e);if(!pointers.has(e.pointerId)){const c=hit(...pos);if(hover!==c?.id){hover=c?.id||null;schedule();}return;}const old=[...pointers.values()];pointers.set(e.pointerId,pos);const next=[...pointers.values()];if(next.length===1){const dx=pos[0]-old[0][0],dy=pos[1]-old[0][1];camera.x-=dx/camera.z;camera.y-=dy/camera.z;if(Math.hypot(pos[0]-startPointer[0],pos[1]-startPointer[1])>4)dragged=true;}else{dragged=true;const center=ps=>[(ps[0][0]+ps[1][0])/2,(ps[0][1]+ps[1][1])/2],a=center(old),b=center(next),distance=ps=>Math.hypot(ps[0][0]-ps[1][0],ps[0][1]-ps[1][1]),factor=distance(next)/Math.max(1,distance(old));zoom(factor,...a);camera.x-=(b[0]-a[0])/camera.z;camera.y-=(b[1]-a[1])/camera.z;}clamp();schedule();});
function release(e){const last=pointers.size===1;pointers.delete(e.pointerId);if(last&&!dragged&&e.type==='pointerup'){const c=hit(...local(e));if(c)select(c.node);}if(!pointers.size)canvas.classList.remove('dragging');else{startPointer=[...pointers.values()][0];dragged=true;}}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',e=>{pointers.delete(e.pointerId);if(!pointers.size)canvas.classList.remove('dragging');});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(-Math.max(-120,Math.min(120,e.deltaY))*.003),...local(e));},{passive:false});canvas.addEventListener('dblclick',e=>{const c=hit(...local(e));if(c)goTo(c.node);});
canvas.addEventListener('keydown',e=>{if(e.key==='+'||e.key==='=')zoom(1.3);else if(e.key==='-')zoom(1/1.3);else if(e.key.startsWith('Arrow')){animation=null;const step=100/camera.z;camera.x+=(e.key==='ArrowRight'?step:e.key==='ArrowLeft'?-step:0);camera.y+=(e.key==='ArrowDown'?step:e.key==='ArrowUp'?-step:0);clamp();schedule();}else return;e.preventDefault();});
function minimap(){mctx.setTransform(2,0,0,2,0,0);mctx.clearRect(0,0,273,72);const s=Math.min(273/data.width,72/data.height),oy=(72-data.height*s)/2;mctx.fillStyle='#f4f7f9';mctx.fillRect(0,oy,data.width*s,data.height*s);mctx.strokeStyle='#d9e1e8';mctx.lineWidth=.5;for(const band of Object.values(data.bands)){mctx.beginPath();mctx.moveTo(0,oy+band[0]*s);mctx.lineTo(273,oy+band[0]*s);mctx.stroke();}for(const c of cards){mctx.fillStyle=c.node===selected?'#bd464d':'#899dae';mctx.fillRect(c.x*s,oy+c.y*s,Math.max(1,c.w*s),Math.max(1,c.h*s));}const x=(camera.x-W/2/camera.z)*s,y=oy+(camera.y-H/2/camera.z)*s;mctx.fillStyle='#3c81ab20';mctx.fillRect(x,y,W/camera.z*s,H/camera.z*s);mctx.strokeStyle='#286d99';mctx.lineWidth=1.2;mctx.strokeRect(x,y,Math.max(2,W/camera.z*s),Math.max(2,H/camera.z*s));}
let miniDrag=false;function miniMove(e){const [x,y]=local(e,mini),s=Math.min(273/data.width,72/data.height),oy=(72-data.height*s)/2;animation=null;camera.x=x/s;camera.y=(y-oy)/s;clamp();schedule();}mini.addEventListener('pointerdown',e=>{mini.setPointerCapture(e.pointerId);miniDrag=true;miniMove(e);});mini.addEventListener('pointermove',e=>{if(miniDrag)miniMove(e);});mini.addEventListener('pointerup',()=>miniDrag=false);mini.addEventListener('pointercancel',()=>miniDrag=false);
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function draw(time){frame=0;const begin=performance.now();if(animation){const p=Math.min(1,(time-animation.time)/260),t=1-(1-p)**3;camera={x:animation.start.x+(animation.end.x-animation.start.x)*t,y:animation.start.y+(animation.end.y-animation.start.y)*t,z:animation.start.z+(animation.end.z-animation.start.z)*t};if(p===1)animation=null;else schedule();}
ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.translate(W/2,H/2);ctx.scale(camera.z,camera.z);ctx.translate(-camera.x,-camera.y);
const x0=camera.x-W/2/camera.z,y0=camera.y-H/2/camera.z,x1=x0+W/camera.z,y1=y0+H/camera.z,filter=Number($('#year').value);
for(const [year,band] of Object.entries(data.bands)){if(band[1]<y0||band[0]>y1)continue;ctx.fillStyle=Number(year)%2?'#fff':'#f8fafc';ctx.fillRect(x0,band[0],x1-x0,band[1]-band[0]);ctx.strokeStyle='#ccd7e0';ctx.lineWidth=1/camera.z;ctx.beginPath();ctx.moveTo(x0,band[0]);ctx.lineTo(x1,band[0]);ctx.stroke();ctx.fillStyle='#8193a4';ctx.font=`600 ${20/camera.z}px ${font}`;ctx.textAlign='left';ctx.fillText(year,x0+16/camera.z,band[0]+29/camera.z);}
const ordered=selected?[...paths.filter(p=>!activeEdges.has(p.edge)),...paths.filter(p=>activeEdges.has(p.edge))]:paths;
for(const p of ordered){const [a,b,c,d]=p.bounds;if(c<x0||a>x1||d<y0||b>y1)continue;const e=p.edge,active=!selected||activeEdges.has(e);ctx.globalAlpha=(active?1:.16)*(filter && nodes[e.target].year!==filter ? .12 : 1);ctx.strokeStyle=edgeColors[e.kind];ctx.lineWidth=(e.sequel?3.8:1.5)+(selected&&active?1:0);ctx.lineJoin='round';ctx.beginPath();p.points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();const [x,y]=p.points.at(-1);ctx.fillStyle=edgeColors[e.kind];ctx.beginPath();ctx.moveTo(x,y+5);ctx.lineTo(x-4,y-3);ctx.lineTo(x+4,y-3);ctx.closePath();ctx.fill();}
drawnCards=0;for(const c of cards){if(c.x+c.w<x0||c.x>x1||c.y+c.h<y0||c.y>y1)continue;drawnCards++;const n=nodes[c.node],chosen=c.node===selected,related=!selected||highlighted.has(c.node);ctx.globalAlpha=(related?1:.48)*(filter && !n.external && n.year!==filter ? .15 : 1);ctx.fillStyle=n.external?'#fff':colors[n.group];ctx.strokeStyle=chosen?'#286d99':hover===c.id?'#457b9b':n.external?'#98a7b5':'#60758a';ctx.lineWidth=chosen?2.5/camera.z:1;rounded(c.x,c.y,c.w,c.h,n.external?12:2);ctx.fill();ctx.stroke();if(!n.external){ctx.fillStyle=n.platform==='FDS'?'#7693ab':'#b64d52';ctx.fillRect(c.x,c.y,4,c.h);}if(camera.z<.4&&!chosen)continue;
ctx.fillStyle=n.external?'#798a98':n.platform==='FDS'?'#456b85':'#a54249';ctx.font=`600 10px ${font}`;ctx.textAlign='left';ctx.fillText(n.platform,c.x+11,c.y+21);if(c.alias){ctx.textAlign='right';ctx.fillText('再掲',c.x+c.w-9,c.y+21);}const size=Math.min(15,Math.max(7,Math.floor(62/n.lines.length)-3)),spacing=size+3,start=c.y+33+(62-spacing*n.lines.length)/2+size;ctx.font=`${n.external?400:650} ${size}px ${font}`;ctx.fillStyle=n.external?'#445464':'#1d3045';ctx.textAlign='center';n.lines.forEach((s,j)=>ctx.fillText(s,c.x+c.w/2,start+j*spacing));ctx.fillStyle='#738396';ctx.font=`10px ${font}`;ctx.fillText((n.external?'初出 '+n.year:n.date.replaceAll('-','.'))+(c.alias?' · 再掲':''),c.x+c.w/2,c.y+101);}
ctx.globalAlpha=1;ctx.setTransform(dpr,0,0,dpr,0,0);$('#zoom').textContent=Math.round(camera.z*100)+'%';minimap();lastDrawMs=performance.now()-begin;
}
$('#count').textContent=data.stats.fc_count+'作品 ＋ 外部参考'+data.stats.external_count+'作品';
new ResizeObserver(()=>{const h=$('#header').getBoundingClientRect().height;$('#stage').style.height=`calc(100dvh - ${h}px)`;size();}).observe($('#header'));window.addEventListener('resize',size);size();
const hash=decodeURIComponent(location.hash.slice(1)),initial=originals.has(hash)?hash:Object.values(nodes).find(n=>!n.external&&n.title==='スーパーマリオブラザーズ').id;const c=originals.get(initial);select(initial);moveTo(c.x+c.w/2+(W>650?145/camera.z:0),c.y+c.h/2+H*.1/camera.z,camera.z,false);
// ブラウザでの操作検証用。描画時間と可視作品数も確認できる。
window.lineageViewer={goTo,fit,family,getState:()=>({camera:{...camera},selected,drawnCards,lastDrawMs,width:W,height:H,dpr,totalCards:cards.length,totalEdges:paths.length})};
})();
