<body>
<header id="header">
<h1>ファミコンの系譜<small>1983–1989 · <span id="count"></span></small></h1>
<div class="search"><input id="search" type="search" placeholder="タイトルを探す" autocomplete="off" aria-label="ゲームタイトルを検索" aria-controls="results"><div id="results" hidden role="region" aria-label="検索結果"></div></div>

</main>
<script id="lineage-data" type="application/json">__LINEAGE_DATA__</script>
<script>
(() => {

const $=s=>document.querySelector(s), canvas=$('#map'), ctx=canvas.getContext('2d',{alpha:false}), mini=$('#mini'), mctx=mini.getContext('2d');

function panel(){const panel=$('#inspector');panel.replaceChildren();if(!selected){panel.textContent='タイトルを検索するか、図の作品をクリックすると、前後の作品へ移動できます。';return;}const n=nodes[selected],title=document.createElement('h2');title.textContent=n.title;panel.append(title);const meta=document.createElement('div');meta.className='meta';meta.textContent=n.external?n.platform+' · 初出 '+n.year+' · 外部参考':n.platform+' · 国内発売 '+n.date;panel.append(meta);
const actions=document.createElement('div');actions.className='selection-tools';for(const [label,fn] of [['文字を読む',()=>goTo(selected)],['この系統を見る',family]]){const b=document.createElement('button');b.textContent=label;b.onclick=fn;actions.append(b);}panel.append(actions);
for(const [label,es,side] of [['影響を受けた作品',incoming.get(selected)||[],'source'],['つながる作品',outgoing.get(selected)||[],'target']]){const h=document.createElement('h3');h.textContent=label+' · '+es.length;panel.append(h);if(!es.length){const p=document.createElement('div');p.className='meta';p.textContent=side==='source'?'この図では未接続です。':'この図には接続先がありません。';panel.append(p);}for(const e of es){const b=document.createElement('button');b.className='neighbor';b.textContent=nodes[e[side]].title;const small=document.createElement('small');small.textContent=(e.sequel?'続編 · ':'')+({lineage:'継承',documented:'証言あり',inferred:'推定'}[e.kind]);b.append(small);b.onclick=()=>goTo(e[side]);panel.append(b);}}
const es=[...(incoming.get(selected)||[]),...(outgoing.get(selected)||[])];if(es.length){const details=document.createElement('details'),summary=document.createElement('summary');summary.textContent='関係の理由と出典';details.append(summary);for(const e of es){const p=document.createElement('p');p.textContent=nodes[e.source].title+' → '+nodes[e.target].title+'：'+e.reason;details.append(p);for(const u of e.sources||[]){if(!/^https?:\/\//.test(u))continue;const a=document.createElement('a');a.href=u;a.textContent='出典を開く';a.target='_blank';a.rel='noopener noreferrer';details.append(a,document.createElement('br'));}}panel.append(details);}}
function search(){const query=norm($('#search').value),year=Number($('#year').value),box=$('#results');box.replaceChildren();if(!query){box.hidden=true;return;}const hits=Object.values(nodes).filter(n=>norm(n.title).includes(query)&&(!year||(!n.external&&n.year===year)));for(const n of hits.slice(0,60)){const b=document.createElement('button');b.textContent=n.title;const small=document.createElement('small');small.textContent=n.platform+' · '+(n.external?'初出 '+n.year:n.date);b.append(small);b.onclick=()=>{goTo(n.id);box.hidden=true;$('#search').blur();};box.append(b);}if(!hits.length){const p=document.createElement('div');p.className='empty';p.textContent='該当するタイトルがありません';box.append(p);}box.hidden=false;}
$('#search').addEventListener('input',search);$('#search').addEventListener('focus',search);$('#search').addEventListener('keydown',e=>{if(e.key==='Enter'){$('#results button')?.click();}if(e.key==='Escape')$('#results').hidden=true;if(e.key==='ArrowDown'){$('#results button')?.focus();e.preventDefault();}});
$('#results').addEventListener('keydown',e=>{if(!['ArrowDown','ArrowUp'].includes(e.key))return;const b=[...$('#results').querySelectorAll('button')],i=b.indexOf(document.activeElement);b[Math.max(0,Math.min(b.length-1,i+(e.key==='ArrowDown'?1:-1)))]?.focus();e.preventDefault();});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.search'))$('#results').hidden=true;});
$('#year').onchange=()=>{search();const year=Number($('#year').value);if(year){const cs=cards.filter(c=>!c.alias&&!nodes[c.node].external&&nodes[c.node].year===year);cs.sort((a,b)=>Math.abs(a.x-camera.x)-Math.abs(b.x-camera.x));if(cs[0])goTo(cs[0].node);}schedule();};
$('#plus').onclick=()=>zoom(1.3);$('#minus').onclick=()=>zoom(1/1.3);$('#overview').onclick=()=>moveTo(data.width/2,data.height/2,Math.min((W-70)/data.width,(H-90)/data.height));
for(const button of document.querySelectorAll('[data-title]'))button.onclick=()=>{const n=Object.values(nodes).find(n=>!n.external&&n.title===button.dataset.title);if(n)goTo(n.id);};
function hit(x,y){const [wx,wy]=screenToWorld(x,y);return cards.findLast(c=>wx>=c.x&&wx<=c.x+c.w&&wy>=c.y&&wy<=c.y+c.h);}
const pointers=new Map();let dragged=false,startPointer=null;
canvas.addEventListener('pointerdown',e=>{animation=null;canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,local(e));if(pointers.size===1){startPointer=local(e);dragged=false;}canvas.classList.add('dragging');});

let miniDrag=false;function miniMove(e){const [x,y]=local(e,mini),s=Math.min(273/data.width,72/data.height),oy=(72-data.height*s)/2;animation=null;camera.x=x/s;camera.y=(y-oy)/s;clamp();schedule();}mini.addEventListener('pointerdown',e=>{mini.setPointerCapture(e.pointerId);miniDrag=true;miniMove(e);});mini.addEventListener('pointermove',e=>{if(miniDrag)miniMove(e);});mini.addEventListener('pointerup',()=>miniDrag=false);mini.addEventListener('pointercancel',()=>miniDrag=false);

const ordered=selected?[...paths.filter(p=>!activeEdges.has(p.edge)),...paths.filter(p=>activeEdges.has(p.edge))]:paths;
