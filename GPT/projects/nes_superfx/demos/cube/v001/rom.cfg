MEMORY {
 H:start=0,size=16,file=%O;
 Z:start=$0000,size=$0100,type=rw,file="";
 P:start=$8000,size=$7FFA,file=%O,fill=yes;
 V:start=$FFFA,size=6,file=%O;
 C:start=0,size=$2000,file=%O;
}
SEGMENTS {
 HEADER:load=H,type=ro;
 ZEROPAGE:load=Z,type=zp;
 CODE:load=P,type=ro;
 RODATA:load=P,type=ro;
 VECTORS:load=V,type=ro;
 CHR:load=C,type=ro;
}
