<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>磁石と鉄片 — avoid_log_02</title>
<style>
  html,body{margin:0;background:#05050f;color:#cfd4e4;font-family:system-ui,sans-serif;
            display:flex;flex-direction:column;align-items:center;min-height:100vh}
  canvas{background:#07091a;box-shadow:0 0 40px #1b2040;display:block;margin-top:12px}
  h1{font-size:14px;margin:8px 0 0;letter-spacing:.1em;color:#9fb1d8}
  p{font-size:11px;opacity:.55;margin:4px 0 0}
</style>
</head>
<body>
<h1>磁石と鉄片</h1>
<p>← → / A D で移動 &middot; SPACE で極性反転（AIが吸った鉄片を撃ち返す） &middot; R でやり直し</p>
<canvas id="c" width="420" height="620"></canvas>
<script>
const W=420,H=620,FPS=60;
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const keys={};
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  keys[k]=1;
  if(k===' '||e.code==='Space'){keys[' ']=1;e.preventDefault();}
  if(k==='r'&&state.over)reset();
});
addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  keys[k]=0;
  if(k===' '||e.code==='Space')keys[' ']=0;
});

// ---- 世界観: 鉄片（bullet）は磁石（AI）に引かれる。プレイヤーは極性を反転して撃ち返す。----
// 意味変換 3段: 障害(降ってくる鉄片) → 武器(AIに吸われた鉄片) → 報酬源(撃ち返しが次の鉄片を壊してコンボ)
// 死の意味変換:
//   AI死  = 吸収した鉄片を一斉解放（場が変わる環境変化。罰でも報酬でもない）
//   P死   = カメラがAI側に寄る。AIが最後までどう戦うかを見届ける
//   両死  = 軌跡+死因マーカー（誰がどの鉄片で死んだか）重ね表示

let state;
function reset(){
  state={
    player:{x:W*0.35,y:H-70,r:9,alive:true,path:[],deathBy:null,burstCd:0},
    ai:{x:W*0.65,y:H-70,r:10,alive:true,path:[],deathBy:null,absorbed:0,absorbMax:6},
    bullets:[],
    sparks:[],
    spawn:0,
    t:0,
    pT:0,pEndT:0,
    aT:0,aEndT:0,
    over:false, overAt:0,
    playerDeadPov:0, // P死んだ後AIを追うためのカメラ補助
    aiDeathBurstFired:false,
    chain:0, chainDecay:0, score:0,
    stars:state && state.stars ? state.stars : null
  };
  if(!state.stars){
    state.stars=[];
    for(let i=0;i<80;i++)state.stars.push({x:Math.random()*W,y:Math.random()*H,z:1+Math.random()*2});
  }
}
reset();

function spawn(){
  const t=state.t/FPS;
  const speed=2.2+Math.min(3.2,t*0.04);
  state.bullets.push({
    x:Math.random()*(W-30)+15,y:-20,
    vx:(Math.random()-0.5)*0.8,vy:speed,
    r:6+Math.random()*4,
    mode:'iron',   // 'iron' = 降ってくる鉄片 / 'weapon' = AI吸収後 / 'returned' = 撃ち返された
    ownerId:null,  // weapon化した時、どのAIが吸収したか（今はAI1体）
    life:0
  });
}

function aiAttract(b){
  // 磁石引力: AI方向に加速。ただし距離が近すぎると吸収。
  const a=state.ai;
  if(!a.alive)return;
  const dx=a.x-b.x, dy=a.y-b.y, d=Math.hypot(dx,dy)+0.001;
  // 引力は画面下半分+AI生存時のみ効かせる（序盤の自由回避を残す）
  if(b.y>H*0.3 && b.mode==='iron' && d<220){
    const pull=0.08 * (1 - Math.min(1,d/220));
    b.vx += (dx/d)*pull*3;
    b.vy += (dy/d)*pull*3;
  }
  // 吸収判定
  if(b.mode==='iron' && d < a.r+b.r+2){
    if(state.ai.absorbed < state.ai.absorbMax){
      state.ai.absorbed++;
      // 鉄片は吸収されて消える
      b._consumed=true;
    }else{
      // 吸収限界を超えた鉄片はAIにダメージを与える（実質死亡要因）
      // → いや、今回は絶対吸収制限をAI死トリガに使う方が"死の意味変換"に綺麗
      b._consumed=true;
      state.ai.absorbed = state.ai.absorbMax;
    }
  }
}

function triggerPolarityReversal(){
  const a=state.ai;
  if(!a.alive) return false;
  if(a.absorbed<=0) return false;
  if(state.player.burstCd>0) return false;
  state.player.burstCd = 12;
  // 吸収分を放射状に撃ち返す（極性反転）
  const n=a.absorbed;
  for(let i=0;i<n;i++){
    const ang=-Math.PI/2 + (i-(n-1)/2)*0.22 + (Math.random()-0.5)*0.08;
    const speed=5+Math.random()*1.2;
    state.bullets.push({
      x:a.x, y:a.y-2,
      vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed,
      r:5,
      mode:'returned', life:0
    });
  }
  a.absorbed=0;
  return true;
}

function aiMove(a){
  // 磁石AIはあまり動かない（玉を受けに行く。ただし極端な接近は避ける）
  let threatClose=null,bestDy=9e9;
  for(const b of state.bullets){
    if(b.mode!=='iron') continue;
    const dy=a.y-b.y;
    if(dy>0 && dy<80 && Math.abs(a.x-b.x)<40 && a.absorbed>=a.absorbMax-1){
      // 満タン近ければ緊急回避
      if(dy<bestDy){threatClose=b;bestDy=dy;}
    }
  }
  let tx;
  if(threatClose){
    const side=a.x>threatClose.x?1:-1;
    tx=a.x+side*40;
  }else{
    // 基本はプレイヤーの少し反対側に居て、場を広く受ける
    tx = W*0.5 + (W*0.5 - state.player.x)*0.5;
  }
  tx=Math.max(a.r,Math.min(W-a.r,tx));
  const d=tx-a.x;
  a.x += Math.sign(d)*Math.min(2.0,Math.abs(d));
}

function fireAiDeathBurst(){
  // AI死の一斉解放: 吸収していた鉄片を全方位に放つ。環境変化（罰でも報酬でもない）。
  const a=state.ai;
  const n = Math.max(4, a.absorbed+3);
  for(let i=0;i<n;i++){
    const ang = (i/n)*Math.PI*2 + Math.random()*0.2;
    const speed=2.4+Math.random()*1.8;
    state.bullets.push({
      x:a.x, y:a.y,
      vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed,
      r:6+Math.random()*3,
      mode:'returned', // 撃ち返し扱い（プレイヤーにも当たるが、倒せる）
      life:0
    });
  }
  a.absorbed=0;
  for(let i=0;i<18;i++) state.sparks.push({x:a.x,y:a.y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,life:28,col:'rgba(255,200,120,'});
}

function step(){
  if(!state.over){
    state.t++;
    state.spawn++;
    const interval=Math.max(11, 28 - Math.floor(state.t/150));
    if(state.spawn>=interval){state.spawn=0;spawn();}

    const p=state.player, a=state.ai;

    // player
    if(p.alive){
      const sp=4.4;
      if(keys['arrowleft']||keys['a'])p.x-=sp;
      if(keys['arrowright']||keys['d'])p.x+=sp;
      p.x=Math.max(p.r,Math.min(W-p.r,p.x));
      if(keys[' '] && a.alive && a.absorbed>0 && p.burstCd<=0){
        triggerPolarityReversal();
      }
      if(p.burstCd>0) p.burstCd--;
      state.pT=state.t;
      if(state.t%2===0)p.path.push([p.x,p.y]);
    }
    // ai
    if(a.alive){
      aiMove(a);
      state.aT=state.t;
      if(state.t%2===0)a.path.push([a.x,a.y]);
      // 吸収しすぎは死トリガ（満タン+3フレーム維持で崩壊）
      if(a.absorbed>=a.absorbMax){
        a._fullFrames=(a._fullFrames||0)+1;
        if(a._fullFrames>90){
          a.alive=false; state.aEndT=state.t; a.deathBy='overload';
        }
      }else{
        a._fullFrames=0;
      }
    }else if(!state.aiDeathBurstFired){
      state.aiDeathBurstFired=true;
      fireAiDeathBurst();
    }

    // bullets (含む attract)
    for(const b of state.bullets){
      b.life++;
      if(b.mode==='iron') aiAttract(b);
      b.x+=b.vx; b.y+=b.vy;
      // 重力的な微減（magnetic field内で減速）
      b.vx *= 0.995;
    }

    // 鉄片同士の衝突（returned vs iron）でチェイン加算・破壊
    for(const r of state.bullets){
      if(r.mode!=='returned') continue;
      for(const b of state.bullets){
        if(b===r || b.mode!=='iron') continue;
        if(Math.hypot(r.x-b.x,r.y-b.y) < r.r+b.r){
          b._consumed=true; r._consumed=true;
          state.chain++; state.chainDecay=90;
          state.score += 10 * state.chain;
          for(let i=0;i<6;i++) state.sparks.push({
            x:(r.x+b.x)/2, y:(r.y+b.y)/2,
            vx:(Math.random()-0.5)*3, vy:(Math.random()-0.5)*3,
            life:22, col:'rgba(255,220,140,'
          });
          break;
        }
      }
    }

    state.bullets = state.bullets.filter(b=>!b._consumed && b.y<H+60 && b.y>-60 && b.x>-40 && b.x<W+40);

    // collisions: 鉄片がプレイヤー/AIに当たる
    for(const b of state.bullets){
      if(p.alive && Math.hypot(p.x-b.x,p.y-b.y)<p.r+b.r){
        // 撃ち返し(returned)はプレイヤーに当たらない（味方判定） — ただしAI死後の爆発は当たる
        if(b.mode==='returned' && !state.aiDeathBurstFired) continue;
        if(b.mode==='returned' && state.aiDeathBurstFired && b.life>12){
          // AI死爆発は時間差でプレイヤーを脅かす
        }
        p.alive=false; state.pEndT=state.t; p.deathBy=b.mode;
      }
      if(a.alive && b.mode==='returned' && Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r && b.life>8){
        // 稀に撃ち返しがAIに戻る（極性反転の代償）
      }
    }

    // chain decay
    if(state.chainDecay>0){state.chainDecay--; if(state.chainDecay===0) state.chain=0;}

    if(!p.alive && !a.alive && !state.over){
      state.over=true; state.overAt=state.t;
    }
    if(!p.alive) state.playerDeadPov = Math.min(60, state.playerDeadPov+1);

    // stars
    for(const s of state.stars){s.y+=s.z*0.35; if(s.y>H){s.y=0;s.x=Math.random()*W;}}
    // sparks
    for(const sp of state.sparks){sp.x+=sp.vx; sp.y+=sp.vy; sp.life--;}
    state.sparks=state.sparks.filter(sp=>sp.life>0);
  }
  draw();
  requestAnimationFrame(step);
}

function draw(){
  ctx.fillStyle='#06081a'; ctx.fillRect(0,0,W,H);
  for(const s of state.stars){
    const c=60+s.z*60;
    ctx.fillStyle=`rgb(${c},${c},${Math.min(255,c+40)})`;
    ctx.fillRect(s.x|0,s.y|0,s.z|0,s.z|0);
  }

  const p=state.player,a=state.ai;

  // 磁力場の視覚化: AI生存中、AIを中心に淡いリング
  if(a.alive){
    const grad=ctx.createRadialGradient(a.x,a.y,10,a.x,a.y,160);
    const ratio=a.absorbed/a.absorbMax;
    grad.addColorStop(0,`rgba(255,170,90,${0.12+ratio*0.2})`);
    grad.addColorStop(1,'rgba(255,170,90,0.0)');
    ctx.fillStyle=grad;
    ctx.beginPath(); ctx.arc(a.x,a.y,160,0,6.283); ctx.fill();
  }

  // linking line
  if(p.alive&&a.alive&&!state.over){
    ctx.strokeStyle='rgba(120,150,220,0.25)';
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(a.x,a.y); ctx.stroke();
  }

  // bullets
  for(const b of state.bullets){
    if(b.mode==='iron')      ctx.fillStyle='#c7cdd9'; // 鉄片
    else if(b.mode==='returned') ctx.fillStyle='#ffd170'; // 撃ち返し
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.283); ctx.fill();
  }

  // sparks
  for(const sp of state.sparks){
    const alpha = Math.max(0,sp.life/28);
    ctx.fillStyle = sp.col + alpha.toFixed(2) + ')';
    ctx.fillRect(sp.x|0, sp.y|0, 2, 2);
  }

  // paths (light)
  drawPath(p.path,'rgba(100,180,255,0.22)');
  drawPath(a.path,'rgba(255,180,90,0.22)');

  // figures
  if(p.alive) drawFig(p.x,p.y,p.r,'#6cc6ff','you');
  else drawGhost(p.x,p.y,p.r,'rgba(100,180,255,0.5)');
  if(a.alive) drawMagnet(a);
  else drawGhost(a.x,a.y,a.r,'rgba(255,180,90,0.55)');

  // HUD
  ctx.fillStyle='#9fb1d8'; ctx.font='12px system-ui';
  ctx.fillText(`you ${(state.pT/FPS).toFixed(1)}s`,10,18);
  ctx.fillText(`AI  ${(state.aT/FPS).toFixed(1)}s`,10,34);
  ctx.fillText(`score ${state.score}`,10,50);
  if(state.chain>1){
    ctx.fillStyle='#ffd170';
    ctx.fillText(`chain x${state.chain}`, 10, 66);
  }

  // absorb meter (AI側に)
  if(a.alive){
    ctx.strokeStyle='rgba(255,200,130,0.7)';
    ctx.strokeRect(a.x-16, a.y+a.r+6, 32, 4);
    ctx.fillStyle='rgba(255,200,130,0.9)';
    ctx.fillRect(a.x-16, a.y+a.r+6, 32*(a.absorbed/a.absorbMax), 4);
  }

  // 中間画面: Pが先に死んだ時の「AIを見届ける」表示
  if(!p.alive && a.alive && !state.over){
    ctx.fillStyle='rgba(0,0,0,'+Math.min(0.35,state.playerDeadPov/60*0.35)+')';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e9d1a6'; ctx.font='13px system-ui';
    const msg='AIがどこまで生き延びるか、見届けろ';
    ctx.fillText(msg, W/2-ctx.measureText(msg).width/2, 40);
  }

  // Over screen
  if(state.over){
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,W,H);
    const py=(state.pT/FPS), ay=(state.aT/FPS);
    const winner = py>ay?'you outlived AI':(py<ay?'AI outlived you':'tied');
    ctx.fillStyle='#fff'; ctx.font='bold 20px system-ui';
    ctx.fillText(winner,W/2-ctx.measureText(winner).width/2,H/2-80);

    ctx.font='13px system-ui'; ctx.fillStyle='#cfd4e4';
    ctx.fillText(`you ${py.toFixed(1)}s / AI ${ay.toFixed(1)}s  score ${state.score}`,
                 W/2-120, H/2-56);

    // 死因マーカー
    ctx.fillStyle='#9fb1d8'; ctx.font='11px system-ui';
    const pReason = p.deathBy==='returned' ? '跳ね返りで死' : p.deathBy==='iron' ? '鉄片で死' : '—';
    const aReason = a.deathBy==='overload' ? '吸収過多で崩壊' : '鉄片で死';
    ctx.fillText(`you死因: ${pReason}`, W/2-120, H/2-32);
    ctx.fillText(`AI死因: ${aReason}`, W/2-120, H/2-16);

    ctx.fillStyle='#8ea4cc';
    ctx.fillText('磁石(AI)は鉄片を集めた。極性反転で撃ち返した。',W/2-170,H/2+6);
    ctx.fillStyle='#6e84ac';
    ctx.fillText('press R to restart',W/2-55,H/2+30);
  }
}

function drawFig(x,y,r,col,lab){
  ctx.fillStyle=col;
  ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.fill();
  ctx.fillStyle='rgba(240,240,255,0.7)';
  ctx.font='10px system-ui';
  ctx.fillText(lab,x-ctx.measureText(lab).width/2,y-r-4);
}
function drawMagnet(a){
  // 磁石のようにU字のハイライトで描く
  ctx.fillStyle='#ffb558';
  ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,6.283); ctx.fill();
  ctx.fillStyle='#3a2a10';
  ctx.fillRect(a.x-a.r+1,a.y-1,a.r*2-2,3);
  ctx.fillStyle='rgba(240,240,255,0.7)';
  ctx.font='10px system-ui';
  ctx.fillText('AI',a.x-ctx.measureText('AI').width/2,a.y-a.r-4);
}
function drawGhost(x,y,r,col){
  ctx.strokeStyle=col; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(x,y,r+1,0,6.283); ctx.stroke();
  ctx.lineWidth=1;
}
function drawPath(path,col){
  if(path.length<2)return;
  ctx.strokeStyle=col;
  ctx.beginPath();
  ctx.moveTo(path[0][0],path[0][1]);
  for(let i=1;i<path.length;i++)ctx.lineTo(path[i][0],path[i][1]);
  ctx.stroke();
}

requestAnimationFrame(step);
</script>
</body>
</html>
