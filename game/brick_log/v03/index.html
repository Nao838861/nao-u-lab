<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>brick_log v03 — BRICK</title>
<style>
  html,body{margin:0;background:#05050f;color:#cfd4e4;font-family:system-ui,sans-serif;
            display:flex;flex-direction:column;align-items:center;min-height:100vh}
  canvas{background:#07091a;box-shadow:0 0 40px #1b2040;display:block;margin-top:12px}
  h1{font-size:14px;margin:8px 0 0;letter-spacing:.1em;color:#9fb1d8}
  p{font-size:11px;opacity:.55;margin:4px 0 0}
</style>
</head>
<body>
<h1>BRICK v03 — CONSTANT AIM</h1>
<p>← → / A D / MOUSE  PADDLE &middot; SPACE  START / SERVE / RETRY</p>
<canvas id="c" width="420" height="620"></canvas>
<script>
const W=420,H=620;
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const keys={};
let mouseX=null;

// === PADDLE / BALL ===
const PAD_W=72, PAD_H=8, PAD_Y=H-40, PAD_SPEED=6;
const BALL_R=5, BALL_BASE_SPEED=4.2;
const MAX_REFLECT_ANGLE=Math.PI/3; // ±60°

// === BLOCKS ===
const BR_COLS=10, BR_ROWS=6, BR_W=36, BR_H=14, BR_GAP=2;
const BR_X0=(W-(BR_COLS*(BR_W+BR_GAP)-BR_GAP))/2;
const BR_Y0=70;
const ROW_DEF=[
  {hp:3,score:50,col:'#e85a7a'},
  {hp:2,score:30,col:'#e8a04a'},
  {hp:2,score:30,col:'#e8d44a'},
  {hp:1,score:10,col:'#7adea0'},
  {hp:1,score:10,col:'#5ac6e8'},
  {hp:1,score:10,col:'#9d8ae8'},
];

// === v03: ガイドは「ボール飛行中ほぼ常時」表示 ===
// Nao_u 2026-05-01 04:10「ガイドは常時表示に近づける方が良い。
// 『予想する楽しさ』は減少するが、操作は必要なのでゲームとしては成立し、
// 上級者にしかできなかった『狙ったところに飛ばせる楽しさ』が味わいやすくなる」
//
// 実装方針: ボールが play 中なら全飛行軌道を予測する。
// 現在位置から壁/天井/ブロックの反射を再帰的に計算し、
// パドル平面に到達したらそこから出射ベクトルを再計算してさらに 1反射先まで描画。
// 接触前ウィンドウ (PREDICT_TRIGGER_DY) という概念は廃止。

const RETRY_UNLOCK_FRAMES=120;

const state={
  mode:'title',
  t:0,
  paddle:{x:W/2,y:PAD_Y,w:PAD_W,h:PAD_H},
  ball:{x:W/2,y:PAD_Y-BALL_R-1,vx:0,vy:0},
  blocks:[],
  particles:[],
  lives:3,
  score:0,
  hiscore:(function(){try{return parseInt(localStorage.getItem('bricklog_v03_hi')||'0',10);}catch(e){return 0;}})(),
  combo:0,
  comboMax:0,
  unlockT:0,
};

function initBlocks(){
  state.blocks.length=0;
  for(let r=0;r<BR_ROWS;r++){
    const def=ROW_DEF[r];
    for(let c=0;c<BR_COLS;c++){
      state.blocks.push({
        x:BR_X0+c*(BR_W+BR_GAP),
        y:BR_Y0+r*(BR_H+BR_GAP),
        w:BR_W, h:BR_H,
        hp:def.hp, maxHp:def.hp, score:def.score, col:def.col,
        alive:true,
      });
    }
  }
}

function resetBall(){
  state.ball.x=state.paddle.x;
  state.ball.y=PAD_Y-BALL_R-1;
  state.ball.vx=0;
  state.ball.vy=0;
  state.combo=0;
}

function startGame(){
  state.mode='serve';
  state.t=0;
  state.lives=3;
  state.score=0;
  state.combo=0; state.comboMax=0;
  state.particles.length=0;
  initBlocks();
  state.paddle.x=W/2;
  resetBall();
}

function serveBall(){
  state.ball.x=state.paddle.x;
  state.ball.y=PAD_Y-BALL_R-1;
  const ang=(-Math.PI/2)+(Math.random()*0.5-0.25);
  state.ball.vx=Math.cos(ang)*BALL_BASE_SPEED;
  state.ball.vy=Math.sin(ang)*BALL_BASE_SPEED;
  state.mode='play';
}

function spawnParticles(x,y,col,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=1+Math.random()*2.5;
    state.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:24+Math.random()*16,col});
  }
}

function rectCircleHit(rx,ry,rw,rh,cx,cy,cr){
  const nx=Math.max(rx,Math.min(cx,rx+rw));
  const ny=Math.max(ry,Math.min(cy,ry+rh));
  const dx=cx-nx,dy=cy-ny;
  return dx*dx+dy*dy<=cr*cr;
}

function update(){
  state.t++;
  const p=state.paddle;
  if(mouseX!==null){
    p.x=Math.max(p.w/2,Math.min(W-p.w/2,mouseX));
  }else{
    if(keys['ArrowLeft']||keys['a']||keys['A'])p.x-=PAD_SPEED;
    if(keys['ArrowRight']||keys['d']||keys['D'])p.x+=PAD_SPEED;
    p.x=Math.max(p.w/2,Math.min(W-p.w/2,p.x));
  }
  if(state.mode==='serve'){
    state.ball.x=p.x;
    state.ball.y=PAD_Y-BALL_R-1;
    return;
  }
  if(state.mode!=='play')return;

  const b=state.ball;
  b.x+=b.vx; b.y+=b.vy;
  if(b.x<BALL_R){b.x=BALL_R;b.vx=Math.abs(b.vx);}
  if(b.x>W-BALL_R){b.x=W-BALL_R;b.vx=-Math.abs(b.vx);}
  if(b.y<BALL_R){b.y=BALL_R;b.vy=Math.abs(b.vy);}
  if(b.y>H+BALL_R){
    state.lives--;
    state.combo=0;
    if(state.lives<=0){
      state.mode='over';
      state.unlockT=RETRY_UNLOCK_FRAMES;
      try{if(state.score>state.hiscore){state.hiscore=state.score;localStorage.setItem('bricklog_v03_hi',String(state.score));}}catch(e){}
    }else{
      state.mode='serve';
      resetBall();
    }
    return;
  }

  // paddle 衝突
  if(b.vy>0 && b.y+BALL_R>=p.y-p.h/2 && b.y-BALL_R<=p.y+p.h/2 &&
     b.x>=p.x-p.w/2-BALL_R && b.x<=p.x+p.w/2+BALL_R){
    b.y=p.y-p.h/2-BALL_R-0.1;
    const off=(b.x-p.x)/(p.w/2);
    const ang=(-Math.PI/2)+off*MAX_REFLECT_ANGLE;
    const sp=Math.hypot(b.vx,b.vy);
    b.vx=Math.cos(ang)*sp;
    b.vy=Math.sin(ang)*sp;
    state.combo=0;
  }

  // blocks 衝突
  for(const blk of state.blocks){
    if(!blk.alive)continue;
    if(!rectCircleHit(blk.x,blk.y,blk.w,blk.h,b.x,b.y,BALL_R))continue;
    const cx=blk.x+blk.w/2, cy=blk.y+blk.h/2;
    const dx=b.x-cx, dy=b.y-cy;
    const px=blk.w/2+BALL_R-Math.abs(dx);
    const py=blk.h/2+BALL_R-Math.abs(dy);
    if(px<py){
      b.vx=-b.vx; b.x+=Math.sign(dx||1)*px;
    }else{
      b.vy=-b.vy; b.y+=Math.sign(dy||1)*py;
    }
    blk.hp--;
    if(blk.hp<=0){
      blk.alive=false;
      state.score+=blk.score;
      state.combo++;
      if(state.combo>state.comboMax)state.comboMax=state.combo;
      spawnParticles(cx,cy,blk.col,8);
    }else{
      spawnParticles(b.x,b.y,blk.col,3);
    }
    break;
  }

  if(state.blocks.every(bk=>!bk.alive)){
    state.mode='clear';
    state.unlockT=RETRY_UNLOCK_FRAMES;
    try{if(state.score>state.hiscore){state.hiscore=state.score;localStorage.setItem('bricklog_v03_hi',String(state.score));}}catch(e){}
  }

  for(const pt of state.particles){pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.05;pt.life--;}
  state.particles=state.particles.filter(p=>p.life>0);
  if(state.unlockT>0)state.unlockT--;
}

// === v03: 全飛行軌道予測 ===
// 現ボール位置と速度ベクトルから、壁/天井反射を再帰的にシミュレート。
// パドル平面到達 or ブロック衝突 or 画面外 で終了。
// パドル平面到達時は現在のパドル位置で出射角を計算→さらに1反射先まで延長。
//
// 戻り値: { segments: [{x1,y1,x2,y2}...], paddleHitX, isBack }
//   segments: 多段反射の線分リスト（壁/天井反射ごとに分かれる）
//   paddleHitX: パドル平面に到達した場合の x 座標（null なら未到達）
//   isBack: 反射後の軌道がブロック群上端を抜けるか（裏抜け検出継続）
function computeFullTrajectory(){
  const b=state.ball, p=state.paddle;
  if(state.mode!=='play')return null;
  if(Math.hypot(b.vx,b.vy)<0.01)return null;

  const segments=[];
  const STEP=2;
  const MAX_STEPS=600; // 600 * 2px = 1200px (画面対角の約2倍)
  const contactPlaneY=p.y-p.h/2-BALL_R-0.1;

  let cx=b.x, cy=b.y;
  let dvx=b.vx, dvy=b.vy;
  const sp=Math.hypot(dvx,dvy);
  let segStartX=cx, segStartY=cy;
  let paddleHitX=null;
  let phase=0; // 0: ball→paddle, 1: paddle→next collision (after reflection)
  let phase1StartIdx=-1; // segments[] のうち phase 1 開始インデックス
  let isBack=false;
  let blockHit=false;

  for(let i=0;i<MAX_STEPS;i++){
    const nx=cx+dvx*STEP/sp, ny=cy+dvy*STEP/sp;

    // 壁反射
    if(nx<BALL_R){
      const reflX=BALL_R;
      segments.push({x1:segStartX,y1:segStartY,x2:reflX,y2:ny});
      dvx=Math.abs(dvx);
      cx=reflX; cy=ny;
      segStartX=cx; segStartY=cy;
      continue;
    }
    if(nx>W-BALL_R){
      const reflX=W-BALL_R;
      segments.push({x1:segStartX,y1:segStartY,x2:reflX,y2:ny});
      dvx=-Math.abs(dvx);
      cx=reflX; cy=ny;
      segStartX=cx; segStartY=cy;
      continue;
    }
    // 天井反射
    if(ny<BALL_R){
      const reflY=BALL_R;
      segments.push({x1:segStartX,y1:segStartY,x2:nx,y2:reflY});
      dvy=Math.abs(dvy);
      cx=nx; cy=reflY;
      segStartX=cx; segStartY=cy;
      continue;
    }

    // ブロック衝突
    let hitBlk=false;
    for(const blk of state.blocks){
      if(!blk.alive)continue;
      if(rectCircleHit(blk.x,blk.y,blk.w,blk.h,nx,ny,BALL_R)){
        segments.push({x1:segStartX,y1:segStartY,x2:nx,y2:ny});
        hitBlk=true;
        blockHit=true;
        break;
      }
    }
    if(hitBlk)break;

    // ブロック群上端越え検出（phase 1 の場合のみ＝パドル反射後）
    if(phase===1 && ny<BR_Y0)isBack=true;

    // パドル平面到達（phase 0 で下向き移動中のみ）
    if(phase===0 && dvy>0 && ny>=contactPlaneY){
      // 線形補間でパドル平面交差点を求める
      const t=(contactPlaneY-cy)/(ny-cy);
      const hitX=cx+(nx-cx)*t;
      segments.push({x1:segStartX,y1:segStartY,x2:hitX,y2:contactPlaneY});

      // パドル外チェック (off の絶対値が 1+small を超える＝外し中)
      const offRaw=(hitX-p.x)/(p.w/2);
      if(Math.abs(offRaw)>1+BALL_R/(p.w/2)){
        // パドルが届かない位置 → 出射軌道は描かない、パドル平面の交点で終了
        paddleHitX=hitX;
        return {segments,paddleHitX,isBack:false,reachable:false,blockHit:false,phase1StartIdx:-1};
      }

      // 出射ベクトル計算
      const off=Math.max(-1,Math.min(1,offRaw));
      const ang=(-Math.PI/2)+off*MAX_REFLECT_ANGLE;
      dvx=Math.cos(ang)*sp;
      dvy=Math.sin(ang)*sp;
      cx=hitX; cy=contactPlaneY;
      segStartX=cx; segStartY=cy;
      paddleHitX=hitX;
      phase=1;
      phase1StartIdx=segments.length; // 次に push される segment が phase 1 の先頭
      continue;
    }

    cx=nx; cy=ny;
  }

  // 末尾セグメント
  if(segStartX!==cx||segStartY!==cy){
    segments.push({x1:segStartX,y1:segStartY,x2:cx,y2:cy});
  }

  return {segments,paddleHitX,isBack,reachable:true,blockHit,phase1StartIdx};
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='#1b2040';ctx.lineWidth=1;ctx.strokeRect(0.5,0.5,W-1,H-1);

  // blocks
  for(const blk of state.blocks){
    if(!blk.alive)continue;
    const dim=blk.hp/blk.maxHp;
    ctx.fillStyle=blk.col;
    ctx.globalAlpha=0.55+0.45*dim;
    ctx.fillRect(blk.x,blk.y,blk.w,blk.h);
    ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.strokeRect(blk.x+0.5,blk.y+0.5,blk.w-1,blk.h-1);
  }

  // particles
  for(const pt of state.particles){
    ctx.globalAlpha=Math.min(1,pt.life/30);
    ctx.fillStyle=pt.col;
    ctx.fillRect(pt.x-1,pt.y-1,2,2);
  }
  ctx.globalAlpha=1;

  // === v03: 全飛行軌道予測線 ===
  // 全 segments を描画。phase 0 (ball→paddle) は薄め、
  // phase 1 (paddle以降出射) は濃いめ。裏抜け軌道なら金色。
  const traj=computeFullTrajectory();
  if(traj && traj.segments.length>0){
    ctx.save();

    // phase 0 セグメント（ball→paddle 到達まで）— 薄め水色
    const phase0Color='rgba(180,210,255,0.40)';
    const phase0Width=2;
    // phase 1 セグメント（パドル反射後の出射軌道）— 濃いめオレンジ／裏抜け金
    const phase1Color=traj.isBack?'rgba(255,230,150,0.85)':'rgba(255,200,100,0.65)';
    const phase1Width=traj.isBack?3.5:2.8;

    const p1=traj.phase1StartIdx;
    for(let i=0;i<traj.segments.length;i++){
      const s=traj.segments[i];
      const isPhase1=(p1>=0 && i>=p1);
      ctx.strokeStyle=isPhase1?phase1Color:phase0Color;
      ctx.lineWidth=isPhase1?phase1Width:phase0Width;
      ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();
    }

    // パドル接触予定点マーカ
    if(traj.paddleHitX!==null && traj.reachable){
      const PADDLE_PLANE=state.paddle.y-state.paddle.h/2-BALL_R-0.1;
      ctx.fillStyle=traj.isBack?'rgba(255,230,150,0.95)':'rgba(255,200,100,0.85)';
      ctx.beginPath();ctx.arc(traj.paddleHitX,PADDLE_PLANE,traj.isBack?4:3,0,Math.PI*2);ctx.fill();
    }
    // パドル外＝届かないマーカ
    if(traj.paddleHitX!==null && !traj.reachable){
      const PADDLE_PLANE=state.paddle.y-state.paddle.h/2-BALL_R-0.1;
      ctx.strokeStyle='rgba(255,100,100,0.75)';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(traj.paddleHitX,PADDLE_PLANE,5,0,Math.PI*2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(traj.paddleHitX-4,PADDLE_PLANE-4);
      ctx.lineTo(traj.paddleHitX+4,PADDLE_PLANE+4);
      ctx.moveTo(traj.paddleHitX+4,PADDLE_PLANE-4);
      ctx.lineTo(traj.paddleHitX-4,PADDLE_PLANE+4);
      ctx.stroke();
    }
    ctx.restore();
  }

  // paddle
  const p=state.paddle;
  ctx.fillStyle='#cfd4e4';
  ctx.fillRect(p.x-p.w/2,p.y-p.h/2,p.w,p.h);

  // === Spec D: パドル角度メーター（v02 から継承） ===
  ctx.save();
  const TICK=4;
  ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.fillRect(p.x-p.w/2+1,p.y-p.h/2-TICK,3,p.h+TICK);
  ctx.fillRect(p.x+p.w/2-4,p.y-p.h/2-TICK,3,p.h+TICK);
  ctx.fillStyle='rgba(140,200,255,0.85)';
  ctx.fillRect(p.x-2,p.y-p.h/2-TICK,4,p.h+TICK);
  ctx.restore();

  // ball
  if(state.mode!=='over'&&state.mode!=='clear'){
    const b=state.ball;
    ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.arc(b.x,b.y,BALL_R,0,Math.PI*2);ctx.fill();
  }

  // === HUD: top ===
  ctx.fillStyle='#9fb1d8';ctx.font='11px system-ui,sans-serif';ctx.textAlign='left';
  ctx.fillText('SCORE '+state.score,8,16);
  ctx.textAlign='right';
  ctx.fillText('HI '+state.hiscore,W-8,16);
  ctx.textAlign='center';
  ctx.fillText('LIFE '+'●'.repeat(Math.max(0,state.lives))+'○'.repeat(Math.max(0,3-state.lives)),W/2,16);

  // overlays
  if(state.mode==='title'){
    overlay('BRICK v03','SPACE  START');
  }else if(state.mode==='serve'){
    ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='11px system-ui,sans-serif';ctx.textAlign='center';
    ctx.fillText('SPACE  SERVE',W/2,H-12);
  }else if(state.mode==='clear'){
    overlay('CLEAR','SCORE '+state.score+(state.unlockT===0?'  /  SPACE  RETRY':''));
  }else if(state.mode==='over'){
    overlay('GAME OVER','SCORE '+state.score+(state.unlockT===0?'  /  SPACE  RETRY':''));
  }
}

function overlay(title,sub){
  ctx.fillStyle='rgba(5,5,15,0.55)';ctx.fillRect(0,H/2-50,W,100);
  ctx.fillStyle='#cfd4e4';ctx.font='22px system-ui,sans-serif';ctx.textAlign='center';
  ctx.fillText(title,W/2,H/2-6);
  ctx.fillStyle='#9fb1d8';ctx.font='12px system-ui,sans-serif';
  ctx.fillText(sub,W/2,H/2+22);
}

// === input ===
addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key===' '){
    if(state.mode==='title')startGame();
    else if(state.mode==='serve')serveBall();
    else if((state.mode==='over'||state.mode==='clear')&&state.unlockT===0)startGame();
    e.preventDefault();
  }
});
addEventListener('keyup',e=>{keys[e.key]=false;});
cvs.addEventListener('mousemove',e=>{
  const r=cvs.getBoundingClientRect();
  mouseX=(e.clientX-r.left)*(W/r.width);
});
cvs.addEventListener('mouseleave',()=>{mouseX=null;});
cvs.addEventListener('click',()=>{
  if(state.mode==='title')startGame();
  else if(state.mode==='serve')serveBall();
  else if((state.mode==='over'||state.mode==='clear')&&state.unlockT===0)startGame();
});

function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
