<h1>BRICK v08 — ENEMY + MOVING BOSS (guide-integrated)</h1>
<p>← → / A D / MOUSE  PADDLE &middot; SPACE  START / SERVE / RETRY</p>
<canvas id="c" width="420" height="620"></canvas>
<script>
// brick_log v08 — Nao_u 2026-05-02 #game-rights
// 05:08 直接指示「アルカノイドのシンプルに敵」「動くボスを出す」
// 10:14 再指摘「ガイドで上級者プレイができたから敵を出した順番、ガイドを消す意味が分からない」
// 10:57 指示「ブレストの上で決めて実装、実装前後の批判的自己判断」
// 採用: E-1 直線降下 + B-1 横振りボス + ガイド継続（敵/ボスを反射体としてガイド計算に含む）
// 型前例: Arkanoid 1986 (敵キャラ本家), Wizorb 2011 / Shatter 2009 (動くボス)

const W=420,H=620;
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const keys={};
let mouseX=null;

// === PADDLE / BALL ===
const PAD_W=72, PAD_H=8, PAD_Y=H-40, PAD_SPEED=6;
const BALL_R=5, BALL_BASE_SPEED=4.2;
const MAX_REFLECT_ANGLE=Math.PI/3;

// === BLOCKS ===
const BR_COLS=10, BR_ROWS=6, BR_W=36, BR_H=14, BR_GAP=2;
const BR_X0=(W-(BR_COLS*(BR_W+BR_GAP)-BR_GAP))/2;
const BR_Y0=70;
const ROW_DEF=[
  {hp:3,score:50,col:'#e85a7a'},
  {hp:2,score:30,col:'#e8a04a'},
  {hp:2,score:30,col:'#e8d44a'},
  {hp:1,score:10,col:'#7adea0'},
  {hp:1,score:10,col:'#5ac6e8'},
  {hp:1,score:10,col:'#9d8ae8'},
];

// === v08: ENEMIES (E-1 直線降下のみ採用、E-2 sin揺れはガイド予測誤差大で v09 保留) ===
const ENEMY_W=14, ENEMY_H=14;
const E1_SPEED=50/60;          // 50 px/sec @60fps
const E1_SCORE=100;

// === v08: MOVING BOSS (B-1 横振り、HP=8) ===
const BOSS_W=80, BOSS_H=30;
const BOSS_Y=70;
const BOSS_SPEED=60/60;
const BOSS_HP=8;
const BOSS_SCORE=1000;

const RETRY_UNLOCK_FRAMES=120;

const STAGE_DEFS=[
  // stage 1: 通常 + E-1 6体, スポーン間隔 5秒
  {kind:'normal', enemyTypes:['E1'], spawnInterval:300, spawnCount:6, spawnDelay:300},
  // stage 2: 通常 + E-1 8体, スポーン間隔 3.5秒（やや密）
  {kind:'normal', enemyTypes:['E1'], spawnInterval:210, spawnCount:8, spawnDelay:180},
  // stage 3: ボス面
  {kind:'boss'},
];

const state={
  mode:'title',
  t:0,
  stage:0,
  paddle:{x:W/2,y:PAD_Y,w:PAD_W,h:PAD_H},
  ball:{x:W/2,y:PAD_Y-BALL_R-1,vx:0,vy:0},
  blocks:[],
  enemies:[],
  boss:null,
  spawnT:0,
  spawnedThisStage:0,
  particles:[],
  lives:3,
  score:0,
  hiscore:(function(){try{return parseInt(localStorage.getItem('bricklog_v08_hi')||'0',10);}catch(e){return 0;}})(),
  combo:0,
  comboMax:0,
  unlockT:0,
  enemiesKilled:0,
};

function initBlocks(){
  state.blocks.length=0;
  for(let r=0;r<BR_ROWS;r++){
    const def=ROW_DEF[r];
    for(let c=0;c<BR_COLS;c++){
      const baseX=BR_X0+c*(BR_W+BR_GAP);
      const baseY=BR_Y0+r*(BR_H+BR_GAP);
      state.blocks.push({
        x:baseX, y:baseY, w:BR_W, h:BR_H,
        hp:def.hp, maxHp:def.hp, score:def.score, col:def.col, alive:true
      });
    }
  }
}

function spawnEnemy(){
  const x=20+Math.random()*(W-40-ENEMY_W);
  state.enemies.push({type:'E1', x:x, y:30, vy:E1_SPEED, hp:1, alive:true});
}

function startStage(stageIdx){
  state.stage=stageIdx;
  state.enemies.length=0;
  state.boss=null;
  state.spawnT=0;
  state.spawnedThisStage=0;
  if(stageIdx>=STAGE_DEFS.length){
    state.mode='gameclear';
    state.unlockT=RETRY_UNLOCK_FRAMES;
    try{if(state.score>state.hiscore){state.hiscore=state.score;localStorage.setItem('bricklog_v08_hi',String(state.score));}}catch(e){}
    return;
  }
  const def=STAGE_DEFS[stageIdx];
  if(def.kind==='normal'){
    initBlocks();
  }else if(def.kind==='boss'){
    state.blocks.length=0;
    state.boss={x:W/2-BOSS_W/2, y:BOSS_Y, w:BOSS_W, h:BOSS_H, vx:BOSS_SPEED, hp:BOSS_HP, maxHp:BOSS_HP, alive:true};
  }
}

function updateEnemies(){
  const def=STAGE_DEFS[state.stage];
  if(!def||def.kind!=='normal')return;
  state.spawnT++;
  if(state.spawnedThisStage<def.spawnCount){
    const elapsed=state.spawnT-def.spawnDelay;
    if(elapsed>=0 && elapsed%def.spawnInterval===0){
      spawnEnemy();
      state.spawnedThisStage++;
    }
  }
  for(const e of state.enemies){
    if(!e.alive)continue;
    e.y+=e.vy;
    // パドル到達でライフ減
    if(e.y+ENEMY_H>=PAD_Y-PAD_H/2 &&
       e.x+ENEMY_W>=state.paddle.x-state.paddle.w/2 &&
       e.x<=state.paddle.x+state.paddle.w/2){
      e.alive=false;
      state.lives--;
      state.combo=0;
      spawnParticles(e.x+ENEMY_W/2, e.y+ENEMY_H/2, '#ff5555', 16);
      if(state.lives<=0){
        state.mode='over';
        state.unlockT=RETRY_UNLOCK_FRAMES;
        try{if(state.score>state.hiscore){state.hiscore=state.score;localStorage.setItem('bricklog_v08_hi',String(state.score));}}catch(e){}
      }
    }
    if(e.y>H+ENEMY_H){e.alive=false;}
  }
  state.enemies=state.enemies.filter(e=>e.alive);
}

function updateBoss(){
  const b=state.boss;
  if(!b||!b.alive)return;
  b.x+=b.vx;
  if(b.x<10){b.x=10; b.vx=Math.abs(b.vx);}
  if(b.x+b.w>W-10){b.x=W-10-b.w; b.vx=-Math.abs(b.vx);}
}

function resetBall(){
  state.ball.x=state.paddle.x;
  state.ball.y=PAD_Y-BALL_R-1;
  state.ball.vx=0;
  state.ball.vy=0;
  state.combo=0;
}

function startGame(){
  state.mode='serve';
  state.t=0;
  state.lives=3;
  state.score=0;
  state.combo=0; state.comboMax=0;
  state.enemiesKilled=0;
  state.particles.length=0;
  startStage(0);
  state.paddle.x=W/2;
  resetBall();
}

function serveBall(){
  state.ball.x=state.paddle.x;
  state.ball.y=PAD_Y-BALL_R-1;
  const ang=(-Math.PI/2)+(Math.random()*0.5-0.25);
  state.ball.vx=Math.cos(ang)*BALL_BASE_SPEED;
  state.ball.vy=Math.sin(ang)*BALL_BASE_SPEED;
  state.mode='play';
}

function spawnParticles(x,y,col,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=1+Math.random()*2.5;
    state.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:24+Math.random()*16,col});
  }
}

function rectCircleHit(rx,ry,rw,rh,cx,cy,cr){
  const nx=Math.max(rx,Math.min(cx,rx+rw));
  const ny=Math.max(ry,Math.min(cy,ry+rh));
  const dx=cx-nx,dy=cy-ny;
  return dx*dx+dy*dy<=cr*cr;
}

function checkStageClear(){
  const def=STAGE_DEFS[state.stage];
  if(!def)return;
  if(def.kind==='normal'){
    const allBlocks=state.blocks.every(bk=>!bk.alive);
    const allEnemiesDone=state.spawnedThisStage>=def.spawnCount && state.enemies.length===0;
    if(allBlocks && allEnemiesDone){
      startStage(state.stage+1);
      if(state.mode!=='gameclear'){
        state.mode='serve';
        resetBall();
      }
    }
  }else if(def.kind==='boss'){
    if(state.boss && !state.boss.alive){
      startStage(state.stage+1);
      if(state.mode!=='gameclear'){
        state.mode='serve';
        resetBall();
      }
    }
  }
}

function update(){
  state.t++;
  const p=state.paddle;
  if(mouseX!==null){
    p.x=Math.max(p.w/2,Math.min(W-p.w/2,mouseX));
  }else{
    if(keys['ArrowLeft']||keys['a']||keys['A'])p.x-=PAD_SPEED;
    if(keys['ArrowRight']||keys['d']||keys['D'])p.x+=PAD_SPEED;
    p.x=Math.max(p.w/2,Math.min(W-p.w/2,p.x));
  }
  if(state.mode==='serve'){
    state.ball.x=p.x;
    state.ball.y=PAD_Y-BALL_R-1;
    return;
  }
  if(state.mode!=='play')return;

  updateEnemies();
  updateBoss();

  const b=state.ball;
  b.x+=b.vx; b.y+=b.vy;
  if(b.x<BALL_R){b.x=BALL_R;b.vx=Math.abs(b.vx);}
  if(b.x>W-BALL_R){b.x=W-BALL_R;b.vx=-Math.abs(b.vx);}
  if(b.y<BALL_R){b.y=BALL_R;b.vy=Math.abs(b.vy);}
  if(b.y>H+BALL_R){
    state.lives--;
    state.combo=0;
    if(state.lives<=0){
      state.mode='over';
      state.unlockT=RETRY_UNLOCK_FRAMES;
      try{if(state.score>state.hiscore){state.hiscore=state.score;localStorage.setItem('bricklog_v08_hi',String(state.score));}}catch(e){}
    }else{
      state.mode='serve';
      resetBall();
    }
    return;
  }

  // paddle 衝突
  if(b.vy>0 && b.y+BALL_R>=p.y-p.h/2 && b.y-BALL_R<=p.y+p.h/2 &&
     b.x>=p.x-p.w/2-BALL_R && b.x<=p.x+p.w/2+BALL_R){
    b.y=p.y-p.h/2-BALL_R-0.1;
    const off=(b.x-p.x)/(p.w/2);
    const ang=(-Math.PI/2)+off*MAX_REFLECT_ANGLE;
    const sp=Math.hypot(b.vx,b.vy);
    b.vx=Math.cos(ang)*sp;
    b.vy=Math.sin(ang)*sp;
    state.combo=0;
  }

  // blocks 衝突
  for(const blk of state.blocks){
    if(!blk.alive)continue;
    if(!rectCircleHit(blk.x,blk.y,blk.w,blk.h,b.x,b.y,BALL_R))continue;
    const cx=blk.x+blk.w/2, cy=blk.y+blk.h/2;
    const dx=b.x-cx, dy=b.y-cy;
    const px=blk.w/2+BALL_R-Math.abs(dx);
    const py=blk.h/2+BALL_R-Math.abs(dy);
    if(px<py){b.vx=-b.vx; b.x+=Math.sign(dx||1)*px;}
    else{b.vy=-b.vy; b.y+=Math.sign(dy||1)*py;}
    blk.hp--;
    if(blk.hp<=0){
      blk.alive=false;
      state.score+=blk.score;
      state.combo++;
      if(state.combo>state.comboMax)state.comboMax=state.combo;
      spawnParticles(cx,cy,blk.col,8);
    }else{
      spawnParticles(b.x,b.y,blk.col,3);
    }
    break;
  }

  // 敵衝突 (ボール ↔ 敵)
  for(const e of state.enemies){
    if(!e.alive)continue;
    if(!rectCircleHit(e.x,e.y,ENEMY_W,ENEMY_H,b.x,b.y,BALL_R))continue;
    const cx=e.x+ENEMY_W/2, cy=e.y+ENEMY_H/2;
    const dx=b.x-cx, dy=b.y-cy;
    const px=ENEMY_W/2+BALL_R-Math.abs(dx);
    const py=ENEMY_H/2+BALL_R-Math.abs(dy);
    if(px<py){b.vx=-b.vx; b.x+=Math.sign(dx||1)*px;}
    else{b.vy=-b.vy; b.y+=Math.sign(dy||1)*py;}
    e.hp--;
    if(e.hp<=0){
      e.alive=false;
      state.score+=E1_SCORE;
      state.combo++;
      state.enemiesKilled++;
      if(state.combo>state.comboMax)state.comboMax=state.combo;
      spawnParticles(cx,cy,'#5ac6e8',14);
    }
    break;
  }

  // ボス衝突 (ボール ↔ ボス)
  if(state.boss && state.boss.alive){
    const bs=state.boss;
    if(rectCircleHit(bs.x,bs.y,bs.w,bs.h,b.x,b.y,BALL_R)){
      const cx=bs.x+bs.w/2, cy=bs.y+bs.h/2;
      const dx=b.x-cx, dy=b.y-cy;
      const px=bs.w/2+BALL_R-Math.abs(dx);
      const py=bs.h/2+BALL_R-Math.abs(dy);
      if(px<py){b.vx=-b.vx; b.x+=Math.sign(dx||1)*px;}
      else{b.vy=-b.vy; b.y+=Math.sign(dy||1)*py;}
      bs.hp--;
      spawnParticles(b.x,b.y,'#e85a7a',8);
      if(bs.hp<=0){
        bs.alive=false;
        state.score+=BOSS_SCORE;
        spawnParticles(cx,cy,'#ffd070',40);
      }
    }
  }

  for(const pt of state.particles){pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.05;pt.life--;}
  state.particles=state.particles.filter(p=>p.life>0);
  if(state.unlockT>0)state.unlockT--;

  checkStageClear();
}

// === v03 から継承+v08 拡張: 全飛行軌道予測 (敵/ボスを反射体として含む) ===
// 線形運動の敵/ボスは現位置スナップショットで予測可能。
// E-1 直線降下: 毎フレーム vy=E1_SPEED で下降、ガイド計算は現位置で扱う
//   → ガイドが計算した時点での敵位置で反射計算。ボール接触までの時間は短い (1-2秒) ので
//      敵の位置ずれは数十ピクセル以内、ガイド誤差は許容範囲
// B-1 横振り: 毎フレーム vx=±BOSS_SPEED、現位置スナップショットで反射計算
function computeFullTrajectory(){
  const b=state.ball, p=state.paddle;
  if(state.mode!=='play')return null;
  if(Math.hypot(b.vx,b.vy)<0.01)return null;

  const segments=[];
  const STEP=2;
  const MAX_STEPS=600;
  const contactPlaneY=p.y-p.h/2-BALL_R-0.1;

  let cx=b.x, cy=b.y;
  let dvx=b.vx, dvy=b.vy;
  const sp=Math.hypot(dvx,dvy);
  let segStartX=cx, segStartY=cy;
  let paddleHitX=null;
  let phase=0;
  let phase1StartIdx=-1;
  let isBack=false;
  let blockHit=false;

  // 敵/ボスの現位置スナップショット (deep copy)
  const enemySnap=state.enemies.filter(e=>e.alive).map(e=>({
    x:e.x, y:e.y, w:ENEMY_W, h:ENEMY_H, hit:false
  }));
  const bossSnap=(state.boss&&state.boss.alive)?{
    x:state.boss.x, y:state.boss.y, w:state.boss.w, h:state.boss.h, hit:false
  }:null;

  for(let i=0;i<MAX_STEPS;i++){
    const nx=cx+dvx*STEP/sp, ny=cy+dvy*STEP/sp;

    if(nx<BALL_R){
      const reflX=BALL_R;
      segments.push({x1:segStartX,y1:segStartY,x2:reflX,y2:ny});
      dvx=Math.abs(dvx);
      cx=reflX; cy=ny;
      segStartX=cx; segStartY=cy;
      continue;
    }
    if(nx>W-BALL_R){
      const reflX=W-BALL_R;
      segments.push({x1:segStartX,y1:segStartY,x2:reflX,y2:ny});
      dvx=-Math.abs(dvx);
      cx=reflX; cy=ny;
      segStartX=cx; segStartY=cy;
      continue;
    }
    if(ny<BALL_R){
      const reflY=BALL_R;
      segments.push({x1:segStartX,y1:segStartY,x2:nx,y2:reflY});
      dvy=Math.abs(dvy);
      cx=nx; cy=reflY;
      segStartX=cx; segStartY=cy;
      continue;
    }

    // ブロック衝突 (現状ブロック配置で判定)
    let hitBlk=false;
    for(const blk of state.blocks){
      if(!blk.alive)continue;
      if(rectCircleHit(blk.x,blk.y,blk.w,blk.h,nx,ny,BALL_R)){
        segments.push({x1:segStartX,y1:segStartY,x2:nx,y2:ny});
        hitBlk=true;
        blockHit=true;
        break;
      }
    }
    if(hitBlk)break;

    // === v08 拡張: 敵を反射体として扱う (現位置スナップショット) ===
    let hitEnemy=false;
    for(const es of enemySnap){
      if(es.hit)continue;
      if(rectCircleHit(es.x,es.y,es.w,es.h,nx,ny,BALL_R)){
        // 反射計算
        const ecx=es.x+es.w/2, ecy=es.y+es.h/2;
        const ddx=nx-ecx, ddy=ny-ecy;
        const ppx=es.w/2+BALL_R-Math.abs(ddx);
        const ppy=es.h/2+BALL_R-Math.abs(ddy);
        if(ppx<ppy){dvx=-dvx; cx=nx+Math.sign(ddx||1)*ppx; cy=ny;}
        else{dvy=-dvy; cx=nx; cy=ny+Math.sign(ddy||1)*ppy;}
        segments.push({x1:segStartX,y1:segStartY,x2:cx,y2:cy});
        segStartX=cx; segStartY=cy;
        es.hit=true; // 1ヒットで撃破扱い
        hitEnemy=true;
        break;
      }
    }
    if(hitEnemy)continue;

    // === v08 拡張: ボスを反射体として扱う (HP制で1ヒットでは消えない) ===
    if(bossSnap && !bossSnap.hit){
      if(rectCircleHit(bossSnap.x,bossSnap.y,bossSnap.w,bossSnap.h,nx,ny,BALL_R)){
        const bcx=bossSnap.x+bossSnap.w/2, bcy=bossSnap.y+bossSnap.h/2;
        const ddx=nx-bcx, ddy=ny-bcy;
        const ppx=bossSnap.w/2+BALL_R-Math.abs(ddx);
        const ppy=bossSnap.h/2+BALL_R-Math.abs(ddy);
        if(ppx<ppy){dvx=-dvx; cx=nx+Math.sign(ddx||1)*ppx; cy=ny;}
        else{dvy=-dvy; cx=nx; cy=ny+Math.sign(ddy||1)*ppy;}
        segments.push({x1:segStartX,y1:segStartY,x2:cx,y2:cy});
        segStartX=cx; segStartY=cy;
        bossSnap.hit=true; // ガイドでは1反射までシミュレート (HP多いがプレビューは短く)
        continue;
      }
    }

    if(phase===1 && ny<BR_Y0)isBack=true;

    if(phase===0 && dvy>0 && ny>=contactPlaneY){
      const t=(contactPlaneY-cy)/(ny-cy);
      const hitX=cx+(nx-cx)*t;
      segments.push({x1:segStartX,y1:segStartY,x2:hitX,y2:contactPlaneY});

      const offRaw=(hitX-p.x)/(p.w/2);
      if(Math.abs(offRaw)>1+BALL_R/(p.w/2)){
        paddleHitX=hitX;
        return {segments,paddleHitX,isBack:false,reachable:false,blockHit:false,phase1StartIdx:-1};
      }

      const off=Math.max(-1,Math.min(1,offRaw));
      const ang=(-Math.PI/2)+off*MAX_REFLECT_ANGLE;
      dvx=Math.cos(ang)*sp;
      dvy=Math.sin(ang)*sp;
      cx=hitX; cy=contactPlaneY;
      segStartX=cx; segStartY=cy;
      paddleHitX=hitX;
      phase=1;
      phase1StartIdx=segments.length;
      continue;
    }

    cx=nx; cy=ny;
  }

  if(segStartX!==cx||segStartY!==cy){
    segments.push({x1:segStartX,y1:segStartY,x2:cx,y2:cy});
  }

  return {segments,paddleHitX,isBack,reachable:true,blockHit,phase1StartIdx};
}

function drawEnemy(e){
  const cx=e.x+ENEMY_W/2;
  // 直線降下: 三角形 (グリーンメン風)
  ctx.fillStyle='#5ac6e8';
  ctx.beginPath();
  ctx.moveTo(cx, e.y);
  ctx.lineTo(e.x, e.y+ENEMY_H);
  ctx.lineTo(e.x+ENEMY_W, e.y+ENEMY_H);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.5)';
  ctx.stroke();
}

function drawBoss(bs){
  // 大型ボス (Doh風)
  ctx.fillStyle='#7a3a4a';
  ctx.fillRect(bs.x, bs.y, bs.w, bs.h);
  ctx.fillStyle='#e85a7a';
  ctx.fillRect(bs.x+8, bs.y+8, 12, 8);
  ctx.fillRect(bs.x+bs.w-20, bs.y+8, 12, 8);
  ctx.fillStyle='#ffd070';
  ctx.fillRect(bs.x+bs.w/2-12, bs.y+bs.h-8, 24, 4);
  // HP バー
  const hpRatio=bs.hp/bs.maxHp;
  ctx.fillStyle='#222';
  ctx.fillRect(bs.x, bs.y-8, bs.w, 4);
  ctx.fillStyle=hpRatio>0.5?'#7adea0':(hpRatio>0.25?'#e8d44a':'#e85a7a');
  ctx.fillRect(bs.x, bs.y-8, bs.w*hpRatio, 4);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='#1b2040';ctx.lineWidth=1;ctx.strokeRect(0.5,0.5,W-1,H-1);

  // blocks
  for(const blk of state.blocks){
    if(!blk.alive)continue;
    const dim=blk.hp/blk.maxHp;
    ctx.fillStyle=blk.col;
    ctx.globalAlpha=0.55+0.45*dim;
    ctx.fillRect(blk.x,blk.y,blk.w,blk.h);
    ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(0,0,0,0.25)';
    ctx.strokeRect(blk.x+0.5,blk.y+0.5,blk.w-1,blk.h-1);
  }

  // enemies
  for(const e of state.enemies){
    if(!e.alive)continue;
    drawEnemy(e);
  }

  // boss
  if(state.boss && state.boss.alive){
    drawBoss(state.boss);
  }

  // particles
  for(const pt of state.particles){
    ctx.globalAlpha=Math.min(1,pt.life/30);
    ctx.fillStyle=pt.col;
    ctx.fillRect(pt.x-1,pt.y-1,2,2);
  }
  ctx.globalAlpha=1;

  // === v08: 軌道予測線 (敵/ボスを反射体として含む) ===
  const traj=computeFullTrajectory();
  if(traj && traj.segments.length>0){
    ctx.save();
    const phase0Color='rgba(180,210,255,0.40)';
    const phase0Width=2;
    const phase1Color=traj.isBack?'rgba(255,230,150,0.85)':'rgba(255,200,100,0.65)';
    const phase1Width=traj.isBack?3.5:2.8;

    const p1=traj.phase1StartIdx;
    for(let i=0;i<traj.segments.length;i++){
      const s=traj.segments[i];
      const isPhase1=(p1>=0 && i>=p1);
      ctx.strokeStyle=isPhase1?phase1Color:phase0Color;
      ctx.lineWidth=isPhase1?phase1Width:phase0Width;
      ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();
    }

    if(traj.paddleHitX!==null && traj.reachable){
      const PADDLE_PLANE=state.paddle.y-state.paddle.h/2-BALL_R-0.1;
      ctx.fillStyle=traj.isBack?'rgba(255,230,150,0.95)':'rgba(255,200,100,0.85)';
      ctx.beginPath();ctx.arc(traj.paddleHitX,PADDLE_PLANE,traj.isBack?4:3,0,Math.PI*2);ctx.fill();
    }
    if(traj.paddleHitX!==null && !traj.reachable){
      const PADDLE_PLANE=state.paddle.y-state.paddle.h/2-BALL_R-0.1;
      ctx.strokeStyle='rgba(255,100,100,0.75)';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(traj.paddleHitX,PADDLE_PLANE,5,0,Math.PI*2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(traj.paddleHitX-4,PADDLE_PLANE-4);
      ctx.lineTo(traj.paddleHitX+4,PADDLE_PLANE+4);
      ctx.moveTo(traj.paddleHitX+4,PADDLE_PLANE-4);
      ctx.lineTo(traj.paddleHitX-4,PADDLE_PLANE+4);
      ctx.stroke();
    }
    ctx.restore();
  }

  // paddle
  const p=state.paddle;
  ctx.fillStyle='#cfd4e4';
  ctx.fillRect(p.x-p.w/2,p.y-p.h/2,p.w,p.h);

  // パドル角度メーター
  ctx.save();
  const TICK=4;
  ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.fillRect(p.x-p.w/2+1,p.y-p.h/2-TICK,3,p.h+TICK);
  ctx.fillRect(p.x+p.w/2-4,p.y-p.h/2-TICK,3,p.h+TICK);
  ctx.fillStyle='rgba(140,200,255,0.85)';
  ctx.fillRect(p.x-2,p.y-p.h/2-TICK,4,p.h+TICK);
  ctx.restore();

  // ball
  if(state.mode!=='over'&&state.mode!=='gameclear'){
    const b=state.ball;
    ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.arc(b.x,b.y,BALL_R,0,Math.PI*2);ctx.fill();
  }

  // HUD
  ctx.fillStyle='#9fb1d8';ctx.font='11px system-ui,sans-serif';ctx.textAlign='left';
  ctx.fillText('SCORE '+state.score,8,16);
  ctx.fillStyle='#ffd070';
  ctx.fillText('STAGE '+(state.stage+1)+'/'+STAGE_DEFS.length, 8, 30);
  ctx.fillStyle='#9fb1d8';
  ctx.textAlign='right';
  ctx.fillText('HI '+state.hiscore,W-8,16);
  ctx.fillStyle='#5ac6e8';
  ctx.fillText('KILL '+state.enemiesKilled,W-8,30);
  ctx.textAlign='center';
  ctx.fillStyle='#9fb1d8';
  ctx.fillText('LIFE '+'●'.repeat(Math.max(0,state.lives))+'○'.repeat(Math.max(0,3-state.lives)),W/2,16);

  if(state.mode==='title'){
    overlay('BRICK v08','ENEMY + MOVING BOSS  /  SPACE  START');
  }else if(state.mode==='serve'){
    ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='11px system-ui,sans-serif';ctx.textAlign='center';
    ctx.fillText('SPACE  SERVE',W/2,H-12);
  }else if(state.mode==='gameclear'){
    overlay('GAME CLEAR','SCORE '+state.score+'  /  KILL '+state.enemiesKilled+(state.unlockT===0?'  /  SPACE  RETRY':''));
  }else if(state.mode==='over'){
    overlay('GAME OVER','SCORE '+state.score+'  /  KILL '+state.enemiesKilled+(state.unlockT===0?'  /  SPACE  RETRY':''));
  }
}

function overlay(title,sub){
  ctx.fillStyle='rgba(5,5,15,0.55)';ctx.fillRect(0,H/2-50,W,100);
  ctx.fillStyle='#cfd4e4';ctx.font='22px system-ui,sans-serif';ctx.textAlign='center';
  ctx.fillText(title,W/2,H/2-6);
  ctx.fillStyle='#9fb1d8';ctx.font='12px system-ui,sans-serif';
  ctx.fillText(sub,W/2,H/2+22);
}

addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key===' '){
    if(state.mode==='title')startGame();
    else if(state.mode==='serve')serveBall();
    else if((state.mode==='over'||state.mode==='gameclear')&&state.unlockT===0)startGame();
    e.preventDefault();
  }
});
addEventListener('keyup',e=>{keys[e.key]=false;});
cvs.addEventListener('mousemove',e=>{
  const r=cvs.getBoundingClientRect();
  mouseX=(e.clientX-r.left)*(W/r.width);
});
cvs.addEventListener('mouseleave',()=>{mouseX=null;});
cvs.addEventListener('click',()=>{
  if(state.mode==='title')startGame();
  else if(state.mode==='serve')serveBall();
  else if((state.mode==='over'||state.mode==='gameclear')&&state.unlockT===0)startGame();
});

initBlocks();
function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
