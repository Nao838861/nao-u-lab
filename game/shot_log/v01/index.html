<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>shot_log v01 — 弾撃つ × ゲージで弾増える</title>
<style>
  html,body{margin:0;background:#05050f;color:#cfd4e4;font-family:system-ui,sans-serif;
            display:flex;flex-direction:column;align-items:center;min-height:100vh}
  canvas{background:#07091a;box-shadow:0 0 40px #1b2040;display:block;margin-top:12px}
  h1{font-size:14px;margin:8px 0 0;letter-spacing:.1em;color:#9fb1d8}
  p{font-size:11px;opacity:.55;margin:4px 0 0}
</style>
</head>
<body>
<h1>shot_log v01 — 弾撃つ × ゲージで弾増える</h1>
<p>← → で移動 &middot; SPACE で発射（ゲージMAXで3way）&middot; R でやり直し</p>
<p style="opacity:.4">avoid_log v04 凍結後の新シリーズ v01：弾撃つ快感とゲージ拡張の最小ループ確認</p>
<canvas id="c" width="420" height="620"></canvas>
<script>
const W=420,H=620;
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const keys={};
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  keys[k]=1;
  if(k===' '||e.code==='Space'){keys[' ']=1;e.preventDefault();}
  if(k==='r'&&state.over)reset();
});
addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  keys[k]=0;
  if(k===' '||e.code==='Space')keys[' ']=0;
});

function mulberry32(a){return function(){var t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}}

let state;
function reset(){
  const seed=Date.now()&0xFFFFFFFF;
  state={
    seed:seed,
    rng:mulberry32(seed),
    t:0,
    player:{x:W/2,y:H-60,r:10},
    bullets:[],
    enemies:[],
    cooldown:0,
    gauge:20,
    score:0,
    nextSpawn:30,
    over:false,
  };
}
reset();

function shoot(){
  const px=state.player.x, py=state.player.y;
  const lvl=state.gauge>=67?3:state.gauge>=34?2:1;
  if(lvl===1){
    state.bullets.push({x:px,y:py-12,vx:0,vy:-7});
  }else if(lvl===2){
    state.bullets.push({x:px-6,y:py-12,vx:0,vy:-7});
    state.bullets.push({x:px+6,y:py-12,vx:0,vy:-7});
  }else{
    state.bullets.push({x:px,y:py-12,vx:0,vy:-7});
    state.bullets.push({x:px-8,y:py-10,vx:-1.4,vy:-6.8});
    state.bullets.push({x:px+8,y:py-10,vx:1.4,vy:-6.8});
  }
  state.cooldown=lvl===3?6:lvl===2?7:8;
}

function step(){
  if(state.over){draw();return;}
  state.t++;
  // player move
  const sp=3.5;
  if(keys['arrowleft']||keys['a'])state.player.x-=sp;
  if(keys['arrowright']||keys['d'])state.player.x+=sp;
  state.player.x=Math.max(14,Math.min(W-14,state.player.x));
  // shoot
  if(state.cooldown>0)state.cooldown--;
  if(keys[' ']&&state.cooldown<=0)shoot();
  // bullets
  state.bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;});
  state.bullets=state.bullets.filter(b=>b.y>-10&&b.x>-10&&b.x<W+10);
  // spawn enemies
  state.nextSpawn--;
  if(state.nextSpawn<=0){
    state.enemies.push({x:20+state.rng()*(W-40),y:-12,vy:1.4+state.rng()*1.0,r:11});
    state.nextSpawn=Math.floor(28+state.rng()*22);
  }
  // enemies
  state.enemies.forEach(e=>{e.y+=e.vy;});
  // hit detection bullet-enemy
  for(const e of state.enemies){
    if(e.dead)continue;
    for(const b of state.bullets){
      if(b.dead)continue;
      const dx=b.x-e.x,dy=b.y-e.y;
      if(dx*dx+dy*dy<(e.r+3)*(e.r+3)){
        e.dead=true;b.dead=true;
        state.score++;
        state.gauge=Math.min(100,state.gauge+10);
        break;
      }
    }
  }
  state.bullets=state.bullets.filter(b=>!b.dead);
  state.enemies=state.enemies.filter(e=>!e.dead && e.y<H+20);
  // player-enemy collision
  for(const e of state.enemies){
    const dx=e.x-state.player.x, dy=e.y-state.player.y;
    if(dx*dx+dy*dy<(e.r+state.player.r)*(e.r+state.player.r)){
      state.over=true;break;
    }
  }
  // gauge decay
  state.gauge=Math.max(0,state.gauge-0.06);
  draw();
}

function draw(){
  ctx.fillStyle='#07091a';ctx.fillRect(0,0,W,H);
  // gauge bar
  const gw=Math.floor((W-40)*state.gauge/100);
  ctx.fillStyle='#1a2238';ctx.fillRect(20,12,W-40,8);
  const lvl=state.gauge>=67?3:state.gauge>=34?2:1;
  const gc=lvl===3?'#ffd45c':lvl===2?'#7ad0ff':'#5a7aa8';
  ctx.fillStyle=gc;ctx.fillRect(20,12,gw,8);
  // gauge level marks
  ctx.fillStyle='#3b4868';
  ctx.fillRect(20+(W-40)*0.34,10,1,12);
  ctx.fillRect(20+(W-40)*0.67,10,1,12);
  // score
  ctx.fillStyle='#cfd4e4';ctx.font='12px system-ui';
  ctx.fillText('score '+state.score+'   way '+lvl,20,38);
  // bullets
  ctx.fillStyle='#ffe27a';
  state.bullets.forEach(b=>{ctx.fillRect(b.x-1.5,b.y-6,3,8);});
  // enemies
  ctx.fillStyle='#ff6080';
  state.enemies.forEach(e=>{
    ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
  });
  // player
  ctx.fillStyle=state.over?'#604050':'#9ee6ff';
  ctx.beginPath();
  ctx.moveTo(state.player.x,state.player.y-state.player.r);
  ctx.lineTo(state.player.x-state.player.r,state.player.y+state.player.r);
  ctx.lineTo(state.player.x+state.player.r,state.player.y+state.player.r);
  ctx.closePath();ctx.fill();
  if(state.over){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,H/2-40,W,80);
    ctx.fillStyle='#fff';ctx.font='18px system-ui';
    ctx.textAlign='center';
    ctx.fillText('GAME OVER  score '+state.score,W/2,H/2-4);
    ctx.font='12px system-ui';
    ctx.fillText('R でやり直し',W/2,H/2+18);
    ctx.textAlign='left';
  }
}

setInterval(step,1000/60);
</script>
</body>
</html>
